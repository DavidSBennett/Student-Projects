  function showHelp() {
    const content = el('div', { class: 'ed-help' });
    content.innerHTML = HELP_HTML;   // fixed text written above, never student text
    return showDialog(EDITOR_TEXT.helpTitle, [content], [{ label: EDITOR_TEXT.close, value: 'close', primary: true }]);
  }

  // Ask for the password. Resolves true if it's right.
  async function askPassword() {
    const input = el('input', { type: 'password', id: 'ed-password', autocomplete: 'current-password' });
    const error = el('p', { class: 'error', role: 'alert' });
    const label = el('label', { for: 'ed-password' }, EDITOR_TEXT.passwordLabel);
    const help = el('button', { type: 'button', class: 'ed-link' }, EDITOR_TEXT.howToEditLink);
    help.addEventListener('click', showHelp);
    let ok = false;
    const shown = showDialog(EDITOR_TEXT.passwordTitle, [label, input, error, help], [
      { label: EDITOR_TEXT.cancel, value: 'cancel' },
      { label: EDITOR_TEXT.unlock, value: 'unlock', primary: true }
    ], () => {
      ok = sha256(FILE_DATA.auth.salt + ':' + input.value) === FILE_DATA.auth.hash;
      if (!ok) { error.textContent = EDITOR_TEXT.passwordWrong; input.select(); }
      return ok;
    });
    input.focus();
    await shown;
    return ok;
  }

  let asking = false;          // true while the password window is open

  async function startEditing() {
    if (editing || asking) return;
    if (!unlockStore.isUnlocked()) {
      asking = true;
      const ok = await askPassword();
      asking = false;
      if (!ok) { clearEditHash(); return; }
      unlockStore.remember();
    }
    editing = true;
    document.body.classList.add('is-editing');
    document.querySelectorAll('[data-image-box]').forEach(b => b.setAttribute('data-upload-hint', EDITOR_TEXT.uploadHint));
    buildEditBar();
    render();
    buildCardEditor();
    const canSave = await autoSaveStore.available();
    if (!canSave) setStatus(EDITOR_TEXT.statusNoStorage);
    else setStatus(sameAsFile(data) ? EDITOR_TEXT.statusClean : EDITOR_TEXT.statusHasChanges);
    if (pendingConflict) await resolveConflict();
  }

  async function stopEditing() {
    if (document.activeElement) document.activeElement.blur();
    await autoSaveNow();
    editing = false;
    document.body.classList.remove('is-editing');
    document.querySelectorAll('[data-text]').forEach(n => { n.removeAttribute('contenteditable'); n.removeAttribute('spellcheck'); });
    document.querySelectorAll('[data-image-box]').forEach(b => b.removeAttribute('data-upload-hint'));
    if (editBar) { editBar.remove(); editBar = null; statusEl = null; }
    removeCardEditor();
    render();
    clearEditHash();
  }

  function clearEditHash() {
    if (location.hash === '#edit') {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* not allowed here */ }
    }
  }

  function buildEditBar() {
    editBar = el('div', { class: 'edit-bar', role: 'region', 'aria-label': EDITOR_TEXT.editorLabel });
    statusEl = el('span', { class: 'status', 'aria-live': 'polite' });
    const buttons = [
      [EDITOR_TEXT.howToEdit, showHelp],
      [EDITOR_TEXT.otherText, editOtherText],
      [EDITOR_TEXT.discard, discardChanges],
      [EDITOR_TEXT.saveFile, saveFile],
      [EDITOR_TEXT.done, stopEditing, true]
    ];
    editBar.appendChild(statusEl);
    buttons.forEach(([label, action, primary]) => {
      const b = el('button', { type: 'button', class: primary ? 'primary' : '' }, label);
      b.addEventListener('click', action);
      editBar.appendChild(b);
    });
    document.body.appendChild(editBar);
  }

  // Can this browser do "plain text only" editing? (Most can.)
  const PLAIN_ONLY = (function () {
    try { const d = document.createElement('div'); d.contentEditable = 'plaintext-only'; return d.contentEditable === 'plaintext-only'; }
    catch (e) { return false; }
  })();

  // Turn on click-and-type editing for every data-text element.
  // Safe to call again after re-drawing (listeners are only added once).
  function makeEditable() {
    document.querySelectorAll('[data-text]').forEach(node => {
      node.setAttribute('contenteditable', PLAIN_ONLY ? 'plaintext-only' : 'true');
      node.setAttribute('spellcheck', 'true');
      if (node._editBound) return;
      node._editBound = true;

      node.addEventListener('input', () => {
        if (!editing) return;
        const value = node.innerText.replace(/ /g, ' ');
        setPath(data, node.dataset.text, value);
        // Keep the matching box in the Game editor up to date.
        const twin = tableInputs.get(node.dataset.text);
        if (twin) twin.value = value;
        changed();
      });
      // Single-line text: Enter finishes editing instead of adding a line.
      node.addEventListener('keydown', e => {
        if (editing && e.key === 'Enter' && !node.hasAttribute('data-multiline')) { e.preventDefault(); node.blur(); }
      });
      // Clicking text inside something clickable (like a drop space) shouldn't also trigger it.
      node.addEventListener('click', e => { if (editing) e.stopPropagation(); });
      // Pasting always pastes plain text (no fonts, colours or links).
      node.addEventListener('paste', e => {
        if (!editing) return;
        e.preventDefault();
        let text = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
        if (!node.hasAttribute('data-multiline')) text = text.replace(/\s*\n\s*/g, ' ');
        document.execCommand('insertText', false, text);
      });
      // When leaving a field, tidy its contents to match the saved text.
      node.addEventListener('blur', () => {
        if (!editing) return;
        const value = getPath(data, node.dataset.text);
        node.textContent = value == null ? '' : String(value);
        // The same text may show twice on the board (e.g. a track name): redraw it.
        if (node.closest('#game-root')) setTimeout(renderGame, 0);
      });
    });
  }

  // Clicking an image box in edit mode lets you upload a replacement.
  document.addEventListener('click', async e => {
    const box = editing && e.target.closest('[data-image-box]');
    if (!box) return;
    const name = box.dataset.imageBox;
    const src = await uploadImage();
    if (!src) return;
    data.images = data.images || {};
    data.images[name] = Object.assign({ alt: '' }, data.images[name], { src: src });
    render();
    changed();
  });

  // Ask for an image file and return it shrunk, as a data URL (or null).
  async function uploadImage() {
    const file = await pickFile();
    if (!file) return null;
    try { return await shrinkImage(file, 1600); }
    catch (err) { setStatus(EDITOR_TEXT.statusImageError); return null; }
  }

  function pickFile() {
    return new Promise(resolve => {
      const input = el('input', { type: 'file', accept: 'image/*' });
      input.addEventListener('change', () => resolve(input.files[0] || null));
      input.click();
    });
  }

  // Scale an uploaded photo down (longest side about `max` px) and store it as JPEG.
  function shrinkImage(file, max) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';               // JPEG has no transparency
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Not an image')); };
      img.src = url;
    });
  }

  // Parts of the data that are not listed in the "Other text" window:
  // settings rather than words, and the cards (edited in the Game editor's table).
  const NOT_TEXT_KEYS = ['auth', 'schemaVersion', 'src', 'id', 'type', 'cards', 'raises', 'effect'];

  // List every piece of text in the data that is NOT currently visible on the
  // page (visible text is edited in place). Returns [{ path, value }].
  // New text added to the data later is picked up automatically.
  function hiddenTextFields() {
    const visible = new Set();
    document.querySelectorAll('[data-text]').forEach(n => { if (n.getClientRects().length) visible.add(n.dataset.text); });
    const fields = [];
    (function walk(obj, prefix) {
      Object.keys(obj).forEach(k => {
        if (NOT_TEXT_KEYS.includes(k)) return;
        const path = prefix ? prefix + '.' + k : k;
        const v = obj[k];
        if (typeof v === 'string') { if (!visible.has(path)) fields.push({ path, value: v }); }
        else if (v && typeof v === 'object') walk(v, path);
      });
    })(data, '');
    return fields;
  }

  // "camelCase" -> "Camel case" for labels in the dialog.
  function niceName(part) {
    if (part === 'alt') return 'Description (alt text)';
    const s = part.replace(/([a-z0-9])([A-Z])/g, '$1 $2').toLowerCase();
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  async function editOtherText() {
    const fields = hiddenTextFields();
    const body = [el('p', { class: 'ed-hint' }, EDITOR_TEXT.fnHint), el('p', {}, EDITOR_TEXT.otherTextHelp)];
    const inputs = [];
    let group = null;
    fields.forEach((f, i) => {
      const parts = f.path.split('.');
      if (parts[0] !== group) { group = parts[0]; body.push(el('div', { class: 'group' }, niceName(group))); }
      const id = 'ed-field-' + i;
      body.push(el('label', { for: id }, parts.slice(1).map(niceName).join(' › ') || niceName(parts[0])));
      const box = el('textarea', { id: id, rows: '2' });
      box.value = f.value;
      body.push(box);
      inputs.push([f.path, box]);
    });
    const choice = await showDialog(EDITOR_TEXT.otherTextTitle, body, [
      { label: EDITOR_TEXT.cancel, value: 'cancel' },
      { label: EDITOR_TEXT.apply, value: 'apply', primary: true }
    ]);
    if (choice !== 'apply') return;
    let any = false;
    inputs.forEach(([path, box]) => {
      if (getPath(data, path) !== box.value) { setPath(data, path, box.value); any = true; }
    });
    if (any) { render(); changed(); }
  }

  async function discardChanges() {
    const choice = await showDialog(EDITOR_TEXT.discardTitle, [el('p', {}, EDITOR_TEXT.discardBody)], [
      { label: EDITOR_TEXT.cancel, value: 'cancel' },
      { label: EDITOR_TEXT.discard, value: 'discard', primary: true }
    ]);
    if (choice !== 'discard') return;
    clearTimeout(saveTimer);
    unsaved = false;
    pendingConflict = null;
    if (document.activeElement) document.activeElement.blur();
    data = clone(FILE_DATA);
    await autoSaveStore.clear();
    refreshAll();
    setStatus(EDITOR_TEXT.statusClean);
  }

  // Build a complete new index.html: the original page (as it was before
  // anything was drawn) with only the game-data block replaced.
  function buildFile() {
    const doc = new DOMParser().parseFromString(ORIGINAL_PAGE, 'text/html');
    // "<" is written as < so the data can never close its <script> tag early.
    const json = JSON.stringify(withFileAuth(data), null, 2).replace(/</g, '\\u003c');
    doc.getElementById('game-data').textContent = '\n' + json + '\n';
    return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML + '\n';
  }

  function saveFile() {
    const blob = new Blob([buildFile()], { type: 'text/html' });
    const a = el('a', { href: URL.createObjectURL(blob), download: 'index.html' });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    setStatus(EDITOR_TEXT.statusDownloaded);
  }

  /* -------------------------------------------------------------------
     11. THE GAME EDITOR
     Three tables under the game: tracks, players and rules, and cards.
     Every box is linked to one place in the data by its path, e.g.
     "game.cards.2.title". Typing in a box changes the data straight away.
     ------------------------------------------------------------------- */
  let cardEditor = null;
  const tableInputs = new Map();   // data path -> box, so in-place edits on the board update the table too

  function removeCardEditor() {
    if (cardEditor) { cardEditor.remove(); cardEditor = null; }
    tableInputs.clear();
  }

  // A table with a header row. `rows` is a list of lists of cell contents.
  function editorTable(headers, rows) {
    const wrap = el('div', { class: 'table-wrap' });
    const table = el('table');
    const head = el('tr');
    headers.forEach(h => head.append(el('th', { scope: 'col' }, h)));
    table.append(el('thead'), el('tbody'));
    table.tHead.append(head);
    rows.forEach(cells => {
      const tr = el('tr');
      cells.forEach(c => { const td = el('td'); td.append(c); tr.append(td); });
      table.tBodies[0].append(tr);
    });
    wrap.append(table);
    return wrap;
  }

  // Link a box to a place in the data.
  function bindBox(box, path, label, read) {
    const value = getPath(data, path);
    box.value = value == null ? '' : value;
    box.setAttribute('aria-label', label);
    tableInputs.set(path, box);
    box.addEventListener(box.tagName === 'SELECT' ? 'change' : 'input', () => {
      setPath(data, path, read(box.value));
      changed();
      renderGame();
    });
    return box;
  }
  function textBox(path, label, multiline) {
    return bindBox(el(multiline ? 'textarea' : 'input', multiline ? { rows: '3' } : { type: 'text' }), path, label, v => v);
  }
  function numberBox(path, label, min, max) {
    return bindBox(el('input', { type: 'number', min: String(min), max: String(max), step: '1' }), path, label,
      v => Math.min(max, Math.max(min, int(v))));
  }
  function selectBox(path, label, options) {
    const box = el('select');
    options.forEach(([value, text]) => { const o = el('option', { value: value }, text); box.append(o); });
    return bindBox(box, path, label, v => v);
  }

  function buildCardEditor() {
    removeCardEditor();
    const T = EDITOR_TEXT.game;
    const panel = el('section', { class: 'card-editor' });
    panel.append(el('h2', {}, T.heading), el('p', {}, T.intro), el('p', { class: 'ed-hint' }, EDITOR_TEXT.fnHint));

    // Tracks
    panel.append(el('h3', {}, T.tracksHeading));
    panel.append(editorTable([T.trackCol, T.nameCol, T.lengthCol], TRACKS.map(t => [
      el('span', {}, T.roles[t]),
      textBox('game.tracks.' + t + '.name', T.nameCol),
      numberBox('game.tracks.' + t + '.length', T.lengthCol, 1, 100)
    ])));

    // Players and rules
    panel.append(el('h3', {}, T.rulesHeading));
    panel.append(editorTable([T.settingCol, T.valueCol], [
      [el('span', {}, T.humanName), textBox('game.players.human', T.humanName)],
      [el('span', {}, T.aiName), textBox('game.players.ai', T.aiName)],
      [el('span', {}, T.handSize), numberBox('game.settings.handSize', T.handSize, 1, 10)],
      [el('span', {}, T.marketSize), numberBox('game.settings.marketSize', T.marketSize, 1, 12)],
      [el('span', {}, T.penalty), numberBox('game.settings.penaltyPercent', T.penalty, 0, 100)]
    ]));

    // Cards
    panel.append(el('h3', {}, T.cardsHeading), el('p', {}, T.cardsHelp));
    const effectOptions = EFFECTS.map(e => [e, fill(T.effects[e], { track: EFFECT_TRACK[e] ? trackName(EFFECT_TRACK[e]) : '' })]);
    const raiseOptions = [['', T.nothing]].concat(DANGERS.map(d => [d, trackName(d)]));
    const cards = game().cards;
    panel.append(editorTable(
      [T.title, T.ability, T.effect, T.amount, T.flavor, zoneName('space'), zoneName('pr'), zoneName('invest'),
       T.raises, T.raiseAmount, T.cost, T.startCount, T.marketCount, ''],
      cards.map((c, i) => {
        const p = 'game.cards.' + i + '.';
        return [
          textBox(p + 'title', T.title, true),
          textBox(p + 'ability', T.ability, true),
          selectBox(p + 'effect', T.effect, effectOptions),
          numberBox(p + 'effectAmount', T.amount, 0, 20),
          textBox(p + 'flavor', T.flavor, true),
          numberBox(p + 'space', zoneName('space'), -20, 20),      // minus values lower things
          numberBox(p + 'pr', zoneName('pr'), -20, 20),
          numberBox(p + 'invest', zoneName('invest'), -20, 20),
          selectBox(p + 'raises', T.raises, raiseOptions),
          numberBox(p + 'raiseAmount', T.raiseAmount, -20, 20),
          numberBox(p + 'cost', T.cost, 0, 50),
          numberBox(p + 'startCount', T.startCount, 0, 20),
          numberBox(p + 'marketCount', T.marketCount, 0, 20),
          rowTools(i, cards.length)
        ];
      })));
    const add = el('button', { type: 'button', class: 'primary' }, T.addCard);
    add.addEventListener('click', addCard);
    panel.append(add);

    document.querySelector('main').appendChild(panel);
    cardEditor = panel;
  }

  // ↑ ↓ ✕ buttons for one card row.
  function rowTools(i, count) {
    const T = EDITOR_TEXT.game;
    const tools = el('div', { class: 'row-tools' });
    [['↑', T.moveUp, () => moveCard(i, -1), i === 0],
     ['↓', T.moveDown, () => moveCard(i, 1), i === count - 1],
     ['✕', T.remove, () => deleteCard(i), false]].forEach(([symbol, title, action, disabled]) => {
      const b = el('button', { type: 'button', title: title, 'aria-label': title }, symbol);
      b.disabled = disabled;
      b.addEventListener('click', action);
      tools.append(b);
    });
    return tools;
  }

  function cardsChanged() {
    buildCardEditor();
    changed();
    renderGame();
  }

  function addCard() {
    game().cards.push({
      id: newId('c'), title: '[Card title]', ability: '[Ability]', flavor: '[Historical flavor text]',
      space: 1, pr: 0, invest: 0, raises: '', raiseAmount: 0, effect: 'none', effectAmount: 0,
      cost: 3, startCount: 0, marketCount: 2
    });
    cardsChanged();
    const box = tableInputs.get('game.cards.' + (game().cards.length - 1) + '.title');
    if (box) { box.focus(); box.select(); }
  }

  function moveCard(i, step) {
    const cards = game().cards, j = i + step;
    if (j < 0 || j >= cards.length) return;
    [cards[i], cards[j]] = [cards[j], cards[i]];
    cardsChanged();
  }

  async function deleteCard(i) {
    const T = EDITOR_TEXT.game;
    const choice = await showDialog(T.removeTitle, [el('p', {}, T.removeBody)], [
      { label: EDITOR_TEXT.cancel, value: 'cancel' },
      { label: T.remove, value: 'delete', primary: true }
    ]);
    if (choice !== 'delete') return;
    game().cards.splice(i, 1);
    cardsChanged();
  }

  /* -------------------------------------------------------------------
     12. GETTING EVERYTHING GOING
     ------------------------------------------------------------------- */

  // Three ways into edit mode: the footer link, Ctrl+Shift+E, or #edit in the address.
  document.getElementById('edit-link').addEventListener('click', e => { e.preventDefault(); startEditing(); });
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.shiftKey && (e.key === 'E' || e.key === 'e')) { e.preventDefault(); startEditing(); }
  });
  window.addEventListener('hashchange', () => { if (location.hash === '#edit') startEditing(); });

  render();
  loadAutoSave().then(() => {
    updateLocalNote();
    if (location.hash === '#edit') startEditing();
  });
})();
</script></body></html>
