    if (g.dependants.length) {
      sheet.append(txt('h3', 'ui.ledgerDependants'));
      g.dependants.forEach((d, di) => {
        const st = depState(d);

  // If the content changed in the editor, make sure the game being played still fits it.
  function checkRun() {
    const g = data.game;
    if (!run || run.round >= g.rounds.length) { run = newRun(); return; }
    if ((run.phase === 'work' || run.phase === 'ledger') && !run.r) run.phase = 'intro';
    if (run.phase === 'end' && !byId(g.endings, run.ending)) { const e = pickEnding(true); run.ending = e ? e.id : null; }
  }

  function render() {
    screen = newScreen();
    drawnNarrow = NARROW.matches;
    checkRun();
    updateLocalNote();
    const views = { intro: introView, work: workView, ledger: ledgerView, end: endView };
    $('#app').replaceChildren((views[run.phase] || startView)());
    document.querySelectorAll('.desk').forEach(fitCards);

    // The footer (after the screen, so its footnotes number last)
    document.querySelectorAll('.site-footer [data-text], .site-footer [data-label]').forEach(node => {
      const value = getPath(data, node.dataset.text || node.dataset.label);
      if (node.hidden) node.textContent = stripNotes(value);
      else if (editing && node.dataset.text) { if (node !== document.activeElement) node.textContent = value == null ? '' : String(value); }
      else node.replaceChildren(withNotes(value, screen));
    });

  // Switching between phone and computer layouts redraws the desk.
  // (Both events, as some browsers only send one of them.)
  let drawnNarrow = NARROW.matches;
  function layoutChanged() {
    if (!run || NARROW.matches === drawnNarrow) return;

    render();

  /* -------------------------------------------------------------------
     7. BROWSER STORAGE
     Every storage call is wrapped in try/catch: if the browser blocks
     storage, the game still plays and the editor still works (it just
     can't auto-save). The player's progress is never stored.
     ------------------------------------------------------------------- */

  // "Unlocked" lasts for this browser tab only (sessionStorage).
  const unlockStore = {
    key: 'unlocked:' + PAGE_KEY,
    isUnlocked() { try { return sessionStorage.getItem(this.key) === FILE_DATA.auth.hash; } catch (e) { return false; } },
    remember() { try { sessionStorage.setItem(this.key, FILE_DATA.auth.hash); } catch (e) { /* storage blocked */ } }
  };

  // Auto-saves live in IndexedDB, one per page path.
  const autoSaveStore = (function () {
    const DB_NAME = 'student-game-autosave';
    const STORE = 'autosave';
    let dbPromise = null;

    function openDb() {
      if (!dbPromise) {
        dbPromise = new Promise(resolve => {
          try {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = () => req.result.createObjectStore(STORE);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
            req.onblocked = () => resolve(null);
          } catch (e) { resolve(null); }
        });
      }
      return dbPromise;
    }

    // Run one request; resolves with its result, or `fallback` if anything fails.
    async function request(mode, makeRequest, fallback) {
      const db = await openDb();
      if (!db) return fallback;
      return new Promise(resolve => {
        try {
          const req = makeRequest(db.transaction(STORE, mode).objectStore(STORE));
          req.onsuccess = () => resolve(mode === 'readonly' ? (req.result || null) : true);
          req.onerror = () => resolve(fallback);
        } catch (e) { resolve(fallback); }
      });
    }

    return {
      get: () => request('readonly', s => s.get(PAGE_KEY), null),
      put: value => request('readwrite', s => s.put(value, PAGE_KEY), false),
      clear: () => request('readwrite', s => s.delete(PAGE_KEY), false),
      works: async () => !!(await openDb())
    };
  })();

  let saveTimer = null;
  let unsaved = false;        // true when there are changes not yet auto-saved
  let pendingConflict = null; // an auto-save made for a different version of the file

  // Call after every change: auto-saves about half a second later.
  function changed() {
    unsaved = true;
    setStatus(EDITOR_TEXT.statusSaving);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(autoSaveNow, 500);
  }

  async function autoSaveNow() {
    clearTimeout(saveTimer);
    saveTimer = null;
    if (!unsaved) return;
    unsaved = false;
    updateLocalNote();
    if (sameAsFile(data)) {            // back to the uploaded version: nothing to keep
      await autoSaveStore.clear();
      setStatus(EDITOR_TEXT.statusClean);
      return;
    }
    const ok = await autoSaveStore.put({ fingerprint: FILE_FINGERPRINT, savedAt: Date.now(), data: withoutAuth(data) });
    const time = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    setStatus(ok ? fill(EDITOR_TEXT.statusSaved, { time }) : EDITOR_TEXT.statusNoStorage);
  }

  // Use an auto-save's data (the password check always comes from the file).
  function useSaved(saved) {
    data = withDefaults(withFileAuth(saved.data));
    run = null;                        // start the game again with the loaded content
    render();
    if (editing) buildGameEditor();
  }

  // On page load: bring back auto-saved changes, even outside edit mode.
  async function loadAutoSave() {
    const saved = await autoSaveStore.get();
    if (!saved || !saved.data) return;
    withDefaults(saved.data);
    if (sameAsFile(saved.data)) {
      await autoSaveStore.clear();     // the uploaded file already has these changes
    } else if (saved.fingerprint === FILE_FINGERPRINT) {
      useSaved(saved);                 // same file as when they were saved: load them
    } else {
      pendingConflict = saved;         // the file has changed since: ask when edit mode opens
      if (editing) await resolveConflict();
    }
  }

  // Save straight away if the page is closed or hidden.
  window.addEventListener('pagehide', autoSaveNow);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') autoSaveNow(); });

  /* -------------------------------------------------------------------
     8. THE EDITOR
     ------------------------------------------------------------------- */
  let editBar = null;
  let statusEl = null;
  function setStatus(message) { if (statusEl) statusEl.textContent = message; }

  // An editor pop-up. `buttons` is a list of { label, value, primary }.
  // Resolves with the value of the button pressed, or null for Escape.
  // It resolves straight from its own buttons and the Escape key, and only
  // uses the dialog's "close" event as a backup (it doesn't always fire in
  // background tabs).
  function showDialog(title, bodyNodes, buttons, onSubmit) {
    return new Promise(resolve => {
      const dlg = el('dialog', { class: 'ed-ui ed-dialog' });
      const form = el('form');
      let finished = false;

      function finish(value) {
        if (finished) return;
        finished = true;
        try { if (dlg.open) dlg.close(); } catch (e) { /* already closed */ }
        dlg.remove();
        resolve(value);
      }

      const heading = el('h2', { tabindex: '-1' }, title);
      form.append(heading, ...bodyNodes);
      const row = el('div', { class: 'ed-buttons' });
      buttons.forEach(b => {
        const button = el('button', { type: b.primary ? 'submit' : 'button', class: 'ed-btn' + (b.primary ? ' ed-primary' : '') }, b.label);
        if (!b.primary) button.addEventListener('click', () => finish(b.value));
        row.append(button);
      });
      form.append(row);
      // The primary button (or Enter) submits; onSubmit can return false to keep the dialog open.
      form.addEventListener('submit', e => {
        e.preventDefault();
        if (onSubmit && onSubmit() === false) return;
        const primary = buttons.find(b => b.primary);
        finish(primary ? primary.value : null);
      });
      dlg.addEventListener('cancel', e => { e.preventDefault(); finish(null); });  // Escape key
      dlg.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(null); } });
      dlg.addEventListener('close', () => finish(null));                         // backup only
      dlg.append(form);
      document.body.append(dlg);
      dlg.showModal();
      // Start at the top: focus the heading, not the last button (long dialogs like the help).
      heading.focus({ preventScroll: true });
      dlg.scrollTop = 0;
    });
  }

  /* --- "How to edit" instructions for students ---

    <h3>2. Editing text on the page</h3>

      <li>For text that isn't on the screen right now (headings, button words, messages),
        click <b>Other text…</b> in the dark bar, change the boxes, then click <b>Apply</b>.</li>
      <li>Words in {curly brackets}, like <code>{n}</code> or <code>{case}</code>, are filled in by the game.
        Leave them as they are.</li>
    </ol>

    <h3>3. How the game works</h3>
    <p>The player works a <b>post</b> for a series of <b>rounds</b> (called <b data-fill="game.labels.round"></b>).
      Each round has a budget of <b>time units</b>, and every action costs some: calling the next <b>case</b>,
      each inspect try, each follow-up and each verdict. When the time runs out, the round is over.</p>
    <ol>
      <li>A case comes with <b>records</b> (cards on the desk). On a computer the player drags them around; on a
        phone they tap one to open it.</li>
      <li>The player presses <b data-fill="ui.inspectStart"></b> and taps two details that disagree: two records,
        a record and the case, a record and the date, or a record and the <b>rulebook</b>. A right pair flags a
        <b>discrepancy</b> and shows its <b>follow-ups</b>.</li>
      <li>The player stamps a <b>verdict</b>. A right verdict earns its pay; a wrong one earns a <b>citation</b>.
        The first few citations each round are warnings; after that each one costs a penalty.</li>
      <li>Some cases bring an <b>event</b> (a plea, a bribe, a request, an order). The player's choice changes money,
        citations, faction standing and flags.</li>
      <li>At the end of the round the <b>ledger</b> adds up the pay, takes off penalties and <b>expenses</b>, and offers
        <b>upgrades</b>. Unpaid needs hurt the <b>dependants</b>. Then the <b>endings</b> are checked, in order.</li>
    </ol>

    <h3>4. The Game editor</h3>
    <p>Scroll down to the blue <b>Game editor</b> box under the game. Click a section name to open it.</p>
    <ol>
      <li><b>Words for your setting:</b> the player's role, the post, what a case, a record and the rulebook are
        called, the name of a round, the time unit, the money and the currency.</li>
      <li><b>Time, pay and citations:</b> the starting savings, time in a round, what each action costs, how many
        citations are warnings, the penalty, and the right verdict when nothing is wrong and when something is.</li>
      <li><b>Verdicts:</b> each stamp's name, pay and colour, and effects that happen whenever it is used.
        <b>Add verdict</b> adds one (for example a fine, or a referral).</li>
      <li><b>What a case looks like:</b> the details every case has (a name, an address…), each with an icon and a
        list of values that generated cases pick from.</li>
      <li><b>Value lists:</b> lists of valid and invalid values, such as the issuers whose seals are good.</li>
      <li><b>Record types:</b> each kind of record, the rounds it is in use, and its fields. A field can copy a case
        detail, be an expiry day, a number, a value from a list, or one of a few options.</li>
      <li><b>Rulebook:</b> its pages and rules. Each rule is in force <b>from</b> one round <b>until</b> another, so the
        rulebook grows. To change a rule, end the old one and start a new one.</li>
      <li><b>Discrepancy types:</b> the mistakes the game looks for. Pick a <b>Kind</b>; the blue hint tells you which
        two details the player must tap. Kinds that need a rule only work while that rule is in force. Add
        <b>Follow-ups</b> with a time cost and a scripted response.</li>
      <li><b>Rounds:</b> the date text and day number, intro, time and seed, and the cases. <b>Generated cases</b>
        says how many, how many have mistakes, and which kinds. <b>Hand-written cases</b> let you type every record
        yourself; the editor shows which discrepancies the game finds in each one. <b>Play this round</b> starts it.</li>
      <li><b>Events:</b> the text and choices. Each choice has effects, and can make a verdict the right one
        (for example an order from a superior).</li>
      <li><b>Factions and flags, Dependants, Expenses, Upgrades:</b> what the choices change, who depends on the
        player, what each round costs, and what can be bought.</li>
      <li><b>Endings:</b> checked in order after every round; the first one whose conditions are all true wins.
        <b>Show this ending</b> shows it straight away.</li>
    </ol>
    <ul>
      <li>While you edit, you can play the game as a test. <b>Restart test run</b> starts it again.</li>
      <li>You can also click outlined words inside the game and type. To press a game button while editing,
        click its edge, outside the outlined words.</li>
      <li>The same seed always makes the same generated cases, so a round plays the same way every time you test it.
        Change the seed to get different cases.</li>
    </ul>

    <h3>5. Re-skinning the game for your setting</h3>
    <p>Nothing in the game assumes a place or a time. For example, to make the player a
      <b>factory inspector in the 1900s</b>:</p>
    <ol>
      <li>In <b>Words for your setting</b>, type <code>Factory inspector</code> for the role, <code>Factory</code> for a
        case, <code>Report</code> for the rulebook, <code>Day</code> for a round and <code>hours</code> for the time unit.</li>
      <li>In <b>What a case looks like</b>, use details such as the owner, the street and the trade.</li>
      <li>In <b>Record types</b>, make a <code>Work permit</code> and a <code>Fire certificate</code>, with fields that copy
        the owner and the street, and an expiry day.</li>
      <li>In <b>Verdicts</b>, rename the stamps <code>Pass</code> and <code>Close</code>, and add <code>Fine</code>.</li>
      <li>Write rules, discrepancy types and events that match your research, then cite them with footnotes.</li>
    </ol>

    <h3>6. Adding footnotes</h3>
    <p>You can add a footnote to <b>any</b> text in the game.</p>
    <ol>
      <li>Click right after the sentence that needs a source.</li>
      <li>Type two curly brackets, the letters <code>fn</code>, a colon, your citation, and two closing curly brackets:
        <code class="ed-example">A sentence that needs a source.{{fn: Author, Title, Year, page}}</code></li>
      <li>When you play the game, a small number appears there instead.</li>
      <li>A <b data-fill="ui.footnotesButton"></b> button appears in the top corner of that screen. Click it,
        or click the small number, to see all the citations.</li>
    </ol>
    <ul>
      <li>In edit mode you'll see the <code>{{fn: ...}}</code> code. That's normal. It turns into a number when you click <b>Done</b>.</li>
      <li>A web address that starts with <code>https://</code> or <code>http://</code> becomes a clickable link.</li>
      <li>Every footnote needs <code>{{</code> at the start and <code>}}</code> at the end, or it won't work.</li>
    </ul>

    <h3>7. Saving your work</h3>
    <ol>
      <li>Your work saves automatically, but only in this browser on this computer.</li>
      <li>When you're finished, click <b>Save file</b>. A file called <b>index.html</b> downloads.</li>
      <li><b>Turn in that index.html file</b> the way your teacher tells you. That's the only way your work
        gets onto the real website.</li>
      <li>Click <b>Done</b> to leave edit mode.</li>
    </ol>

    <h3>8. Tips</h3>
    <ul>
      <li>Replace everything in <b>[square brackets]</b> with your own research.</li>
      <li>Cite your sources with footnotes.</li>
      <li>Play every round after you change it, to check the cases and rules still make sense.</li>
      <li>If you make a mistake you can't fix, ask your teacher before you click <b>Discard changes</b>.
        It erases everything back to the last uploaded version.</li>
    </ul>`;

  function showHelp() {
    const content = el('div', { class: 'ed-help' });
    content.innerHTML = HELP_HTML;   // fixed text written above, never student text
    // Current wording from the game data, inserted as plain text.
    content.querySelectorAll('[data-fill]').forEach(b => { b.textContent = stripNotes(fill(getPath(data, b.dataset.fill), labels())); });
    showDialog(EDITOR_TEXT.helpTitle, [content], [{ label: EDITOR_TEXT.close, value: 'close', primary: true }]);
  }

  // Ask for the password. Resolves true if it's right.
  async function askPassword() {
    const input = el('input', { type: 'password', id: 'ed-password', autocomplete: 'off' });
    const error = el('p', { class: 'ed-error', role: 'alert' });
    const label = el('label', { for: 'ed-password' }, EDITOR_TEXT.passwordLabel);
    const help = el('button', { type: 'button', class: 'ed-link' }, EDITOR_TEXT.howToEditLink);
    help.addEventListener('click', showHelp);
    let ok = false;
    const shown = showDialog(EDITOR_TEXT.passwordTitle, [label, input, error, help], [
      { label: EDITOR_TEXT.cancel, value: 'cancel' },
      { label: EDITOR_TEXT.unlock, value: 'unlock', primary: true }
    ], () => {
      ok = sha256(FILE_DATA.auth.salt + ':' + input.value) === FILE_DATA.auth.hash;
      if (!ok) { error.textContent = EDITOR_TEXT.passwordWrong; input.select(); }
      return ok;
    });
    input.focus();
    await shown;
    return ok;
  }

  // Ask whether to keep auto-saved changes made to a different version of the file.
  async function resolveConflict() {
    const saved = pendingConflict;
    if (!saved) return;
    pendingConflict = null;
    const time = new Date(saved.savedAt).toLocaleString();
    const choice = await showDialog(EDITOR_TEXT.conflictTitle, [el('p', {}, fill(EDITOR_TEXT.conflictBody, { time }))], [
      { label: EDITOR_TEXT.useUploaded, value: 'uploaded' },
      { label: EDITOR_TEXT.keepSaved, value: 'keep', primary: true }
    ]);
    if (choice === 'keep') {
      useSaved(saved);
      changed();                       // re-save, now linked to the current file
    } else if (choice === 'uploaded') {
      await autoSaveStore.clear();
      setStatus(EDITOR_TEXT.statusClean);
    } else {
      pendingConflict = saved;         // closed without choosing: ask again next time
    }
  }

  let asking = false;                  // true while the password window is open

  async function startEditing() {
    if (editing || asking) return;
    if (!unlockStore.isUnlocked()) {
      asking = true;
      const ok = await askPassword();
      asking = false;
      clearEditHash();
      if (!ok) return;
      unlockStore.remember();
    }
    clearEditHash();
    editing = true;
    document.body.classList.add('is-editing');
    buildEditBar();
    render();
    buildGameEditor();
    const canSave = await autoSaveStore.works();
    setStatus(!canSave ? EDITOR_TEXT.statusNoStorage : sameAsFile(data) ? EDITOR_TEXT.statusClean : EDITOR_TEXT.statusHasChanges);
    if (pendingConflict) await resolveConflict();
  }

  async function stopEditing() {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    await autoSaveNow();
    editing = false;
    document.body.classList.remove('is-editing');
    document.querySelectorAll('[data-text]').forEach(n => { n.removeAttribute('contenteditable'); n.removeAttribute('spellcheck'); });
    document.querySelectorAll('.ed-ui').forEach(n => n.remove());
    editBar = statusEl = gameEditorEl = null;
    panelInputs.clear();
    render();                          // footnotes render again
  }

  function clearEditHash() {
    if (location.hash === '#edit') {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* not allowed here */ }
    }
  }

  function buildEditBar() {
    editBar = el('div', { class: 'ed-ui edit-bar', role: 'region', 'aria-label': 'Editor' });
    statusEl = el('span', { class: 'ed-status', 'aria-live': 'polite' });
    editBar.append(statusEl);
    [
      [EDITOR_TEXT.howToEdit, showHelp],
      [EDITOR_TEXT.otherText, editOtherText],
      [EDITOR_TEXT.discard, discardChanges],
      [EDITOR_TEXT.saveFile, saveFile, true],
      [EDITOR_TEXT.done, stopEditing]
    ].forEach(([label, action, primary]) => {
      const b = el('button', { type: 'button', class: 'ed-btn' + (primary ? ' ed-primary' : '') }, label);
      b.addEventListener('click', action);
      editBar.append(b);
    });
    document.body.append(editBar);
  }

  // Can this browser do "plain text only" editing? (Most can.)
  const PLAIN_ONLY = (function () {
    try { const d = document.createElement('div'); d.contentEditable = 'plaintext-only'; return d.contentEditable === 'plaintext-only'; }
    catch (e) { return false; }
  })();

  // Turn on click-and-type editing for every data-text element.
  // Safe to call again after redrawing (listeners are only added once).
  function makeEditable() {
    document.querySelectorAll('[data-text]').forEach(node => {
      node.setAttribute('contenteditable', PLAIN_ONLY ? 'plaintext-only' : 'true');
      node.setAttribute('spellcheck', 'true');
      if (node._editBound) return;
      node._editBound = true;

      node.addEventListener('input', () => {
        if (!editing) return;
        let value = node.innerText.replace(/ /g, ' ');
        if (!node.hasAttribute('data-multiline')) value = value.replace(/\s*\n\s*/g, ' ');
        const path = node.dataset.text;
        setPath(data, path, value);
        // Keep the matching Game editor box, and any other copy on the page, up to date.
        const twin = panelInputs.get(path);
        if (twin) twin.value = value;
        document.querySelectorAll('[data-text]').forEach(n => { if (n !== node && n.dataset.text === path) n.textContent = value; });
        changed();
      });
      // One-line text: Enter finishes editing instead of adding a line.
      node.addEventListener('keydown', e => {
        if (editing && e.key === 'Enter' && !node.hasAttribute('data-multiline')) { e.preventDefault(); node.blur(); }
      });
      // Pasting always pastes plain text (no fonts, colours or links).
      node.addEventListener('paste', e => {
        if (!editing) return;
        e.preventDefault();
        let text = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
        if (!node.hasAttribute('data-multiline')) text = text.replace(/\s*\n\s*/g, ' ');
        document.execCommand('insertText', false, text);
      });
      // When leaving a box, tidy it to match the saved text.
      node.addEventListener('blur', () => {
        if (!editing) return;
        const value = getPath(data, node.dataset.text);
        node.textContent = value == null ? '' : String(value);
      });
    });
  }

  // Parts of the data that are not text.
  const NOT_TEXT_KEYS = ['auth', 'schemaVersion', 'id'];

  // Every piece of text in the data that is NOT on screen right now (text on
  // screen is edited in place). The game's own content is left out: all of it
  // is always in the Game editor panel.
  function hiddenTextFields() {
    const visible = new Set();
    document.querySelectorAll('[data-text]').forEach(n => { if (n.getClientRects().length) visible.add(n.dataset.text); });
    const fields = [];
    (function walk(obj, prefix) {
      Object.keys(obj).forEach(k => {
        if (NOT_TEXT_KEYS.includes(k) || (!prefix && k === 'game')) return;
        const path = prefix ? prefix + '.' + k : k;
        const v = obj[k];
        if (typeof v === 'string') { if (!visible.has(path)) fields.push({ path, value: v }); }
        else if (v && typeof v === 'object') walk(v, path);
      });
    })(data, '');
    return fields;
  }

  // A label for a box: from EDITOR_TEXT.fields, or made from the key ("footnotesBack" -> "Footnotes back").
  function fieldName(path) {
    if (EDITOR_TEXT.fields[path]) return EDITOR_TEXT.fields[path];
    return path.split('.').slice(1).map(part => {
      const s = part.replace(/([a-z0-9])([A-Z])/g, '$1 $2').toLowerCase();
      return s.charAt(0).toUpperCase() + s.slice(1);
    }).join(' › ') || path;
  }

  async function editOtherText() {
    const fields = hiddenTextFields();
    const body = [el('p', { class: 'ed-hint' }, EDITOR_TEXT.fnHint), el('p', {}, fields.length ? EDITOR_TEXT.otherTextHelp : EDITOR_TEXT.otherTextNone)];
    const inputs = [];
    let group = null;
    fields.forEach((f, i) => {
      const top = f.path.split('.')[0];
      if (top !== group) { group = top; body.push(el('div', { class: 'ed-group' }, EDITOR_TEXT.groups[top] || fieldName('x.' + top))); }
      const id = 'ed-field-' + i;
      body.push(el('label', { for: id }, fieldName(f.path)));
      const box = el('textarea', { id: id, rows: f.value.length > 60 || f.value.includes('\n') ? '3' : '1' });
      box.value = f.value;
      body.push(box);
      inputs.push([f.path, box]);
    });
    const choice = await showDialog(EDITOR_TEXT.otherTextTitle, body, [
      { label: EDITOR_TEXT.cancel, value: 'cancel' },
      { label: EDITOR_TEXT.apply, value: 'apply', primary: true }
    ]);
    if (choice !== 'apply') return;
    let any = false;
    inputs.forEach(([path, box]) => {
      if (getPath(data, path) !== box.value) { setPath(data, path, box.value); any = true; }
    });
    if (any) { render(); changed(); }
  }

  async function discardChanges() {
    const choice = await showDialog(EDITOR_TEXT.discardTitle, [el('p', {}, EDITOR_TEXT.discardBody)], [
      { label: EDITOR_TEXT.cancel, value: 'cancel' },
      { label: EDITOR_TEXT.discard, value: 'discard', primary: true }
    ]);
    if (choice !== 'discard') return;
    clearTimeout(saveTimer);
    unsaved = false;
    pendingConflict = null;
    data = clone(FILE_DATA);
    await autoSaveStore.clear();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    run = null;
    render();
    buildGameEditor();
    setStatus(EDITOR_TEXT.statusDiscarded);
  }

  // Build a complete new index.html: the original page (copied before
  // anything was drawn) with only the game-data block replaced.
  function buildFile() {
    const doc = new DOMParser().parseFromString(ORIGINAL_PAGE, 'text/html');
    // "<" is written as < so the data can never close its <script> tag early.
    const json = JSON.stringify(withFileAuth(data), null, 2).replace(/</g, '\\u003c');
    doc.getElementById('game-data').textContent = '\n' + json + '\n';
    return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML + '\n';
  }

  function saveFile() {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const blob = new Blob([buildFile()], { type: 'text/html' });
    const a = el('a', { href: URL.createObjectURL(blob), download: 'index.html' });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    setStatus(EDITOR_TEXT.statusDownloaded);
  }

  /* -------------------------------------------------------------------
     8b. THE GAME EDITOR
     A panel under the game (edit mode only) with a box for every part of
     data.game. Every box writes straight into the data, then the game is
     redrawn and the change is auto-saved. Buttons that change the shape
     of the game (add, delete, a different kind) rebuild the whole panel.
     ------------------------------------------------------------------- */
  const GT = EDITOR_TEXT.game;
  let gameEditorEl = null;
  const openParts = new Set();         // which sections are open (kept across rebuilds)
  const panelInputs = new Map();       // data path -> editor box, to mirror in-place edits
  let fieldCount = 0;
  let renderTimer = null;

  // Redraw the game shortly after typing stops in the panel.
  function renderSoon() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 200);
  }

  // A labelled text box tied to a path in the data.
  function textField(label, path, multiline) {
    const id = 'ge-field-' + (++fieldCount);
    const box = el(multiline ? 'textarea' : 'input', { id: id });
    if (!multiline) box.type = 'text';
    const value = getPath(data, path);
    box.value = value == null ? '' : String(value);
    box.addEventListener('input', () => { setPath(data, path, box.value); renderSoon(); changed(); });
    panelInputs.set(path, box);
    const wrap = el('div');
    wrap.append(el('label', { for: id }, label), box);
    return wrap;
  }

  // A box for a list of values, one per line. `get` and `set` read and write the list.
  function listField(label, get, set) {
    const id = 'ge-field-' + (++fieldCount);
    const box = el('textarea', { id: id });
    box.value = get().join('\n');
    box.addEventListener('input', () => { set(lines(box.value)); renderSoon(); changed(); });
    const wrap = el('div');
    wrap.append(el('label', { for: id }, label), box);
    return wrap;
  }

  // A labelled number box. `get` and `set` read and write the number.
  function numberField(label, get, set, min, max) {
    const id = 'ge-field-' + (++fieldCount);
    const box = el('input', { id: id, type: 'number', step: '1' });
    if (min != null) box.min = String(min);
    if (max != null) box.max = String(max);
    box.value = String(get());
    box.addEventListener('input', () => { set(Math.round(num(box.value))); renderSoon(); changed(); });
    const wrap = el('div');
    wrap.append(el('label', { for: id }, label), box);
    return wrap;
  }

  // A tick box. Changing it rebuilds the panel, as it can show or hide boxes.
  function checkField(label, get, set) {
    const box = el('input', { type: 'checkbox' });
    box.checked = !!get();
    box.addEventListener('change', () => { set(box.checked); reshaped(); });
    const wrap = el('label', { class: 'ge-check' });
    wrap.append(box, label);
    return wrap;
  }

  // Several tick boxes that make a list of the ticked values. `options` is a list of [value, label].
  function checkList(label, options, get, set) {
    const wrap = el('div');
    const row = el('div', { class: 'ge-checks' });
    options.forEach(([value, text]) => {
      const box = el('input', { type: 'checkbox' });
      box.checked = get().includes(value);
      box.addEventListener('change', () => {
        const now = get().filter(v => v !== value);
        if (box.checked) now.push(value);
        set(now);
        renderSoon();
        changed();
      });
      const item = el('label', { class: 'ge-check' });
      item.append(box, text);
      row.append(item);
    });
    wrap.append(el('label', {}, label), row);
    return wrap;
  }

  // A drop-down list. `options` is a list of [value, label]. With `reshape`,
  // choosing rebuilds the panel (for choices that show different boxes).
  function selectField(label, options, get, set, reshape) {
    const id = 'ge-field-' + (++fieldCount);
    const box = el('select', { id: id });
    options.forEach(([value, text]) => box.append(el('option', { value: value }, text)));
    box.value = get();
    if (box.selectedIndex < 0 && options.length) box.selectedIndex = 0;
    box.addEventListener('change', () => { set(box.value); if (reshape) reshaped(); else { renderSoon(); changed(); } });
    const wrap = el('div');
    wrap.append(el('label', { for: id }, label), box);
    return wrap;
  }

  function panelButton(label, onClick, cls) {
    const b = el('button', { type: 'button', class: 'ed-btn' + (cls ? ' ' + cls : '') }, label);
    b.addEventListener('click', onClick);
    return b;
  }

  function buttonRow(...buttons) {
    const row = el('div', { class: 'ge-row' });
    row.append(...buttons.filter(Boolean));
    return row;
  }

  function grid(...children) {
    const g = el('div', { class: 'ge-grid' });
    g.append(...children.filter(Boolean));
    return g;
  }

  // A section that opens and closes, and remembers whether it was open.
  function part(key, title, fillIn) {
    const d = el('details');
    if (openParts.has(key)) d.open = true;
    d.addEventListener('toggle', () => { if (d.open) openParts.add(key); else openParts.delete(key); });
    d.append(el('summary', {}, title));
    fillIn(d);
    return d;
  }

  function fieldset(legend, ...children) {
    const fs = el('fieldset');
    fs.append(el('legend', {}, legend), ...children.filter(Boolean));
    return fs;
  }

  // After a change to the shape of the game: save, redraw the game and the panel.
  function reshaped() {
    changed();
    render();
    buildGameEditor();
  }

  function confirmDelete(body) {
    return showDialog(GT.deleteTitle, [el('p', {}, body || GT.deleteBody)], [
      { label: EDITOR_TEXT.cancel, value: 'cancel' },
      { label: GT.deleteButton, value: 'delete', primary: true }
    ]).then(v => v === 'delete');
  }

  // A button that removes item `i` from `list` (after asking). `keep` items always stay.
  function deleteButton(label, list, i, keep, after) {
    if (list.length <= (keep || 0)) return null;
    return panelButton(label, async () => {
      if (!(await confirmDelete())) return;
      list.splice(i, 1);
      if (after) after();
      reshaped();
    }, 'ed-danger');
  }
  // A button that adds an item to `list` and opens its section.
  function addButton(label, list, make, openKey) {
    return panelButton(label, () => {
      const item = make(list.length + 1);
      list.push(item);
      if (openKey) openParts.add(openKey + item.id);
      reshaped();
    });
  }

  // "In force from round … until round …" boxes.
  function fromUntil(x) {
    return grid(numberField(GT.from, () => x.from, v => { x.from = Math.max(1, v); }, 1),
      numberField(GT.until, () => x.until, v => { x.until = Math.max(0, v); }, 0));
  }

  function verdictOptions() { return data.game.verdicts.map(v => [v.id, stripNotes(v.name)]); }
  function named(list, key) { return list.map(x => [x.id, stripNotes(x[key || 'name']).slice(0, 70)]); }

  function blankEffects() { return { money: 0, citations: 0, factions: {}, flags: {} }; }

  // Number boxes (and true/false lists) for what an effect changes.
  function effectsFields(x) {
    const g = data.game;
    const boxes = [numberField(GT.fxMoney, () => num(x.money), v => { x.money = v; }), numberField(GT.fxCitations, () => num(x.citations), v => { x.citations = v; })];
    g.factions.forEach(f => boxes.push(numberField(stripNotes(f.name), () => num(x.factions[f.id]), v => { x.factions[f.id] = v; })));
    g.flags.forEach(f => boxes.push(selectField(stripNotes(f.name), [['', GT.noChange], ['on', GT.flagOn], ['off', GT.flagOff]], () => x.flags[f.id] || '', v => { x.flags[f.id] = v; })));
    const wrap = el('div');
    wrap.append(el('label', {}, GT.effects), grid(...boxes));
    return wrap;
  }

  // Start a test game on round `i` and scroll up to it.
  function testRound(i) {
    run = newRun();
    run.round = i;
    startRound();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function buildGameEditor() {
    if (!editing) return;
    const scrollY = window.scrollY;
    const g = data.game;
    panelInputs.clear();
    const panel = el('section', { class: 'ed-ui game-editor', 'aria-label': GT.heading });
    panel.append(el('h2', {}, GT.heading), el('p', {}, GT.intro), el('p', { class: 'ed-hint' }, EDITOR_TEXT.fnHint),
      buttonRow(panelButton(GT.showStart, toStart), panelButton(GT.restartTest, () => {
        if (!run || run.phase === 'start') toStart(); else testRound(run.round);
      })));

    // Words for your setting
    panel.append(part('labels', GT.labels, d => {
      d.append(el('p', {}, GT.labelsHelp), grid(...Object.keys(g.labels).map(k => textField(GT.labelNames[k] || k, 'game.labels.' + k))));
    }));

    // Time, pay and citations
    panel.append(part('settings', GT.settings, d => {
      d.append(grid(
        numberField(GT.startMoney, () => g.startMoney, v => { g.startMoney = v; }),
        numberField(GT.perRound, () => g.time.perRound, v => { g.time.perRound = Math.max(1, v); }, 1),
        numberField(GT.costCall, () => g.time.call, v => { g.time.call = Math.max(0, v); }, 0),
        numberField(GT.costInspect, () => g.time.inspect, v => { g.time.inspect = Math.max(0, v); }, 0),
        numberField(GT.costVerdict, () => g.time.verdict, v => { g.time.verdict = Math.max(0, v); }, 0),
        numberField(GT.warnings, () => g.scoring.warnings, v => { g.scoring.warnings = Math.max(0, v); }, 0),
        numberField(GT.penalty, () => g.scoring.penalty, v => { g.scoring.penalty = v; })),
      grid(selectField(GT.cleanVerdict, verdictOptions(), () => g.cleanVerdict, v => { g.cleanVerdict = v; }),
        selectField(GT.issueVerdict, verdictOptions(), () => g.issueVerdict, v => { g.issueVerdict = v; })));
    }));

    // Verdicts
    panel.append(part('verdicts', GT.verdicts, d => {
      d.append(el('p', {}, GT.verdictsHelp));
      g.verdicts.forEach((v, i) => {
        const vp = 'game.verdicts.' + i;
        d.append(fieldset(fill(GT.verdict, { n: i + 1 }) + ': ' + stripNotes(v.name),
          grid(textField(GT.name, vp + '.name'), numberField(GT.pay, () => v.pay, x => { v.pay = x; }),
            selectField(GT.tone, TONES.map(t => [t, GT.toneNames[t]]), () => v.tone, x => { v.tone = x; })),
          effectsFields(v.effects), buttonRow(deleteButton(GT.deleteVerdict, g.verdicts, i, 1))));
      });
      d.append(buttonRow(addButton(GT.addVerdict, g.verdicts, n => ({ id: newId('v'), name: '[Verdict ' + n + ']', pay: 5, tone: 'neutral', effects: blankEffects() }))));
    }));

    // What a case looks like
    panel.append(part('attributes', GT.attributes, d => {
      d.append(el('p', {}, GT.attributesHelp));
      g.caseAttributes.forEach((a, i) => {
        d.append(fieldset(fill(GT.attribute, { n: i + 1 }) + ': ' + stripNotes(a.label),
          grid(textField(GT.label, 'game.caseAttributes.' + i + '.label'), iconField(a)),
          listField(GT.values, () => a.values, v => { a.values = v; }), buttonRow(deleteButton(GT.deleteAttribute, g.caseAttributes, i, 0))));
      });
      d.append(buttonRow(addButton(GT.addAttribute, g.caseAttributes, n => ({ id: newId('a'), label: '[Detail ' + n + ']', icon: '', values: ['[Value A]', '[Value B]'] }))));
    }));

    // Value lists
    panel.append(part('lists', GT.lists, d => {
      d.append(el('p', {}, GT.listsHelp));
      g.lists.forEach((l, i) => {
        d.append(fieldset(fill(GT.list, { n: i + 1 }) + ': ' + stripNotes(l.name), textField(GT.name, 'game.lists.' + i + '.name'),
          listField(GT.valid, () => l.valid, v => { l.valid = v; }), listField(GT.invalid, () => l.invalid, v => { l.invalid = v; }),
          buttonRow(deleteButton(GT.deleteList, g.lists, i, 0))));
      });
      d.append(buttonRow(addButton(GT.addList, g.lists, n => ({ id: newId('l'), name: '[List ' + n + ']', valid: ['[Valid A]'], invalid: ['[Invalid X]'] }))));
    }));

    // Record types
    panel.append(part('recordTypes', GT.recordTypes, d => {
      d.append(el('p', {}, GT.recordTypesHelp));
      g.recordTypes.forEach((t, i) => d.append(recordTypePart(t, i)));
      d.append(buttonRow(addButton(GT.addRecordType, g.recordTypes, n => ({ id: newId('r'), name: '[Record ' + n + ']', icon: 'document', from: 1, until: 0,
        fields: [{ id: newId('f'), label: '[Name]', kind: 'attr', attr: g.caseAttributes.length ? g.caseAttributes[0].id : '', list: '', min: 0, max: 0, options: [] }] }), 'rt-')));
    }));

    // Rulebook
    panel.append(part('rulebook', GT.rulebook, d => {
      d.append(el('p', {}, GT.rulebookHelp));
      d.append(part('pages', GT.pages, pd => {
        g.rulePages.forEach((pg, i) => pd.append(fieldset(fill(GT.page, { n: i + 1 }), textField(GT.pageTitle, 'game.rulePages.' + i + '.title'),
          buttonRow(deleteButton(GT.deletePage, g.rulePages, i, 1)))));
        pd.append(buttonRow(addButton(GT.addPage, g.rulePages, n => ({ id: newId('p'), title: '[Page ' + n + ']' }))));
      }));
      d.append(part('rules', GT.rules, rd => {
        g.rules.forEach((r, i) => rd.append(fieldset(fill(GT.rule, { n: i + 1 }),
          selectField(GT.rulePage, named(g.rulePages, 'title'), () => r.page, v => { r.page = v; }),
          textField(GT.ruleText, 'game.rules.' + i + '.text', true), fromUntil(r), buttonRow(deleteButton(GT.deleteRule, g.rules, i, 0)))));
        rd.append(buttonRow(addButton(GT.addRule, g.rules, n => ({ id: newId('u'), page: g.rulePages.length ? g.rulePages[0].id : '', text: '[Rule ' + n + ']', from: 1, until: 0 }))));
      }));
    }));

    // Discrepancy types
    panel.append(part('checks', GT.checks, d => {
      d.append(el('p', {}, GT.checksHelp));
      g.checks.forEach((c, i) => d.append(checkPart(c, i)));
      d.append(buttonRow(addButton(GT.addCheck, g.checks, n => ({ id: newId('d'), name: '[Discrepancy ' + n + ']', kind: 'fieldVsCase', record: '', field: '',
        attr: g.caseAttributes.length ? g.caseAttributes[0].id : '', list: '', rule: '', min: 0, max: 0, forbidden: [], verdict: '', explain: '[What is wrong]',
        from: 1, until: 0, followUps: [] }), 'ck-')));
    }));

    // Rounds
    panel.append(part('rounds', GT.rounds, d => {
      d.append(el('p', {}, GT.roundsHelp));
      g.rounds.forEach((R, i) => d.append(roundPart(R, i)));
      d.append(buttonRow(addButton(GT.addRound, g.rounds, n => ({ id: newId('w'), dateText: '[Date of round ' + n + ']', day: n * 3, time: 0, seed: 'round-' + n, cleanVerdict: '',
        intro: '[What changes this round]', generate: { count: 5, errorCases: 2, errorsPerCase: 1, errorTypes: [], descriptions: '[A {case} arrives at your {post}.]' },
        cases: [], events: [] }), 'rd-')));
    }));

    // Events
    panel.append(part('events', GT.events, d => {
      d.append(el('p', {}, GT.eventsHelp));
      g.events.forEach((ev, i) => d.append(eventPart(ev, i)));
      d.append(buttonRow(addButton(GT.addEvent, g.events, n => ({ id: newId('e'), kind: '[Event ' + n + ']', text: '[What happens]',
        choices: [newChoice(1), newChoice(2)] }), 'ev-')));
    }));

    // Factions and flags
    panel.append(part('factions', GT.factions, d => {
      d.append(el('p', {}, GT.factionsHelp));
      g.factions.forEach((f, i) => d.append(fieldset(fill(GT.faction, { n: i + 1 }),
        grid(textField(GT.name, 'game.factions.' + i + '.name'), numberField(GT.start, () => f.start, v => { f.start = v; })),
        buttonRow(deleteButton(GT.deleteFaction, g.factions, i, 0, () => dropCondition('faction:' + f.id))))));
      d.append(buttonRow(addButton(GT.addFaction, g.factions, n => ({ id: newId('g'), name: '[Faction ' + n + ']', start: 0 }))));
      g.flags.forEach((f, i) => d.append(fieldset(fill(GT.flag, { n: i + 1 }), textField(GT.name, 'game.flags.' + i + '.name'),
        checkField(GT.startTrue, () => f.start, v => { f.start = v; }),
        buttonRow(deleteButton(GT.deleteFlag, g.flags, i, 0, () => dropCondition('flag:' + f.id))))));
      d.append(buttonRow(addButton(GT.addFlag, g.flags, n => ({ id: newId('b'), name: '[Flag ' + n + ']', start: false }))));
    }));

    // Dependants
    panel.append(part('dependants', GT.dependants, d => {
      d.append(el('p', {}, GT.dependantsHelp));
      g.dependants.forEach((p, i) => {
        const dp = 'game.dependants.' + i;
        d.append(part('dep-' + p.id, fill(GT.dependant, { n: i + 1 }) + ': ' + stripNotes(p.name), pd => {
          pd.append(textField(GT.name, dp + '.name'));
          p.needs.forEach((nd, j) => {
            const np = dp + '.needs.' + j;
            pd.append(fieldset(fill(GT.need, { n: j + 1 }) + ': ' + stripNotes(nd.name),
              grid(textField(GT.name, np + '.name'), textField(GT.needStatus, np + '.status'),
                numberField(GT.needLimit, () => nd.limit, v => { nd.limit = Math.max(0, v); }, 0)),
              textField(GT.consequence, np + '.consequence', true), checkField(GT.lost, () => nd.lost, v => { nd.lost = v; }),
              buttonRow(deleteButton(GT.deleteNeed, p.needs, j, 0))));
          });
          pd.append(buttonRow(addButton(GT.addNeed, p.needs, n => ({ id: newId('n'), name: '[Need ' + n + ']', status: '[Status when unmet]', limit: 2,
            consequence: '[What happens to {name}]', lost: false })), deleteButton(GT.deleteDependant, g.dependants, i, 0)));
        }));
      });
      d.append(buttonRow(addButton(GT.addDependant, g.dependants, n => ({ id: newId('h'), name: '[Dependant ' + n + ']',
        needs: [{ id: 'n1', name: '[Food]', status: '[Hungry]', limit: 2, consequence: '[What happens to {name}]', lost: true }] }), 'dep-')));
    }));

    // Expenses
    panel.append(part('expenses', GT.expenses, d => {
      d.append(el('p', {}, GT.expensesHelp));
      const needs = [];
      g.dependants.forEach(p => p.needs.forEach(nd => needs.push([p.id + '.' + nd.id, stripNotes(p.name) + ' — ' + stripNotes(nd.name)])));
      g.expenses.forEach((x, i) => d.append(fieldset(fill(GT.expense, { n: i + 1 }) + ': ' + stripNotes(x.name),
        grid(textField(GT.name, 'game.expenses.' + i + '.name'), numberField(GT.cost, () => x.cost, v => { x.cost = v; })),
        checkField(GT.mandatory, () => x.mandatory, v => { x.mandatory = v; }),
        needs.length ? checkList(GT.covers, needs, () => x.covers, v => { x.covers = v; }) : null,
        buttonRow(deleteButton(GT.deleteExpense, g.expenses, i, 0)))));
      d.append(buttonRow(addButton(GT.addExpense, g.expenses, n => ({ id: newId('x'), name: '[Expense ' + n + ']', cost: 5, mandatory: false, covers: [] }))));
    }));

    // Upgrades
    panel.append(part('upgrades', GT.upgrades, d => {
      d.append(el('p', {}, GT.upgradesHelp));
      g.upgrades.forEach((u, i) => {
        const up = 'game.upgrades.' + i;
        d.append(fieldset(fill(GT.upgrade, { n: i + 1 }) + ': ' + stripNotes(u.name), textField(GT.name, up + '.name'), textField(GT.description, up + '.description'),
          grid(numberField(GT.cost, () => u.cost, v => { u.cost = v; }),
            selectField(GT.kind, UPGRADE_KINDS.map(k => [k, GT.upgradeKinds[k]]), () => u.kind, v => { u.kind = v; }, true),
            u.kind === 'cheaper' ? selectField(GT.action, ACTIONS.map(a => [a, GT.actionNames[a]]), () => u.action, v => { u.action = v; }) : null,
            numberField(GT.amount, () => u.amount, v => { u.amount = v; })),
          buttonRow(deleteButton(GT.deleteUpgrade, g.upgrades, i, 0))));
      });
      d.append(buttonRow(addButton(GT.addUpgrade, g.upgrades, n => ({ id: newId('m'), name: '[Upgrade ' + n + ']', description: '[What it does]', cost: 20, kind: 'time', action: 'call', amount: 1 }))));
    }));

    // Endings
    panel.append(part('endings', GT.endings, d => {
      d.append(el('p', {}, GT.endingsHelp));
      g.endings.forEach((e, i) => d.append(endingPart(e, i)));
      d.append(buttonRow(addButton(GT.addEnding, g.endings, n => ({ id: newId('z'), title: '[Ending ' + n + ' title]', verdict: '[Ending ' + n + ' label]',
        text: '[Ending ' + n + ' text]', tone: 'mixed', when: 'final', conditions: [] }), 'end-')));
    }));

    if (gameEditorEl) gameEditorEl.replaceWith(panel); else $('.site-footer').before(panel);
    gameEditorEl = panel;
    window.scrollTo(0, scrollY);
  }

  function iconField(x) {
    return selectField(GT.icon, [['', GT.noIcon]].concat(Object.keys(ICONS).map(k => [k, k])), () => x.icon || '', v => { x.icon = v; });
  }

  // Remove every ending condition that checks a faction or flag that is gone.
  function dropCondition(what) {
    data.game.endings.forEach(e => { e.conditions = e.conditions.filter(c => c.what !== what); });
  }

  // One record type's section: its name, the rounds it is in use, and its fields.
  function recordTypePart(t, i) {
    const g = data.game;
    const tp = 'game.recordTypes.' + i;
    return part('rt-' + t.id, fill(GT.recordType, { n: i + 1 }) + ': ' + stripNotes(t.name), d => {
      d.append(grid(textField(GT.name, tp + '.name'), iconField(t)), fromUntil(t));
      t.fields.forEach((f, j) => {
        const fp = tp + '.fields.' + j;
        const fs = fieldset(fill(GT.field, { n: j + 1 }) + ': ' + stripNotes(f.label),
          grid(textField(GT.label, fp + '.label'), selectField(GT.kind, FIELD_KINDS.map(k => [k, GT.fieldKinds[k]]), () => f.kind, v => { f.kind = v; }, true)));
        if (f.kind === 'attr') fs.append(selectField(GT.copies, named(g.caseAttributes, 'label'), () => f.attr, v => { f.attr = v; }));
        if (f.kind === 'list') fs.append(selectField(GT.useList, named(g.lists), () => f.list, v => { f.list = v; }));
        if (f.kind === 'number' || f.kind === 'expiry') {
          fs.append(grid(numberField(f.kind === 'expiry' ? GT.expiryMin : GT.min, () => f.min, v => { f.min = v; }),
            numberField(f.kind === 'expiry' ? GT.expiryMax : GT.max, () => f.max, v => { f.max = v; })));
        }
        if (f.kind === 'text') fs.append(listField(GT.options, () => f.options, v => { f.options = v; }));
        fs.append(buttonRow(deleteButton(GT.deleteField, t.fields, j, 0)));
        d.append(fs);
      });
      d.append(buttonRow(addButton(GT.addField, t.fields, n => ({ id: newId('f'), label: '[Field ' + n + ']', kind: 'text', attr: '', list: '', min: 1, max: 10, options: ['[Option A]'] })),
        deleteButton(GT.deleteRecordType, g.recordTypes, i, 0)));
    });
  }

  // One discrepancy type's section. The boxes shown depend on its kind.
  function checkPart(c, i) {
    const g = data.game;
    const cp = 'game.checks.' + i;
    return part('ck-' + c.id, fill(GT.check, { n: i + 1 }) + ': ' + stripNotes(c.name), d => {
      d.append(textField(GT.name, cp + '.name'),
        selectField(GT.kind, CHECK_KINDS.map(k => [k, GT.checkKinds[k]]), () => c.kind, v => { c.kind = v; }, true),
        el('p', { class: 'ed-hint' }, GT.pairHints[c.kind]));
      if (c.kind === 'fieldVsField' || c.kind === 'fieldVsCase') {
        d.append(selectField(GT.caseDetail, named(g.caseAttributes, 'label'), () => c.attr, v => { c.attr = v; }));
      } else {
        const t = byId(g.recordTypes, c.record);
        const row = grid(selectField(GT.record, [['', GT.none]].concat(named(g.recordTypes)), () => c.record, v => { c.record = v; }, true));
        if (c.kind !== 'missingRecord') row.append(selectField(GT.recordField, [['', GT.none]].concat(named(t ? t.fields : [], 'label')), () => c.field, v => { c.field = v; }));
        d.append(row);
      }
      if (c.kind === 'outOfRange') d.append(grid(numberField(GT.min, () => c.min, v => { c.min = v; }), numberField(GT.max, () => c.max, v => { c.max = v; })));
      if (c.kind === 'badList') d.append(selectField(GT.useList, [['', GT.none]].concat(named(g.lists)), () => c.list, v => { c.list = v; }));
      if (c.kind === 'breaksRule') d.append(listField(GT.forbidden, () => c.forbidden, v => { c.forbidden = v; }));
      if (RULE_KINDS.includes(c.kind)) d.append(selectField(GT.pairedRule, [['', GT.none]].concat(named(g.rules, 'text')), () => c.rule, v => { c.rule = v; }));
      d.append(selectField(GT.checkVerdict, [['', GT.useDefault]].concat(verdictOptions()), () => c.verdict || '', v => { c.verdict = v; }),
        textField(GT.explain, cp + '.explain', true), fromUntil(c));
      d.append(part('fu-' + c.id, GT.followUps, fd => {
        c.followUps.forEach((fu, j) => {
          const fp = cp + '.followUps.' + j;
          fd.append(fieldset(fill(GT.followUp, { n: j + 1 }), grid(textField(GT.name, fp + '.name'), numberField(GT.followUpCost, () => fu.cost, v => { fu.cost = Math.max(0, v); }, 0)),
            textField(GT.response, fp + '.response', true), buttonRow(deleteButton(GT.deleteFollowUp, c.followUps, j, 0))));
        });
        fd.append(buttonRow(addButton(GT.addFollowUp, c.followUps, n => ({ id: newId('q'), name: '[Follow-up ' + n + ']', cost: 1, response: '[The scripted response]' }))));
      }));
      d.append(buttonRow(deleteButton(GT.deleteCheck, g.checks, i, 0)));
    });
  }

  // A plain list of what is in force in round n, to help plan the rounds.
  function inForceSummary(n) {
    const names = [].concat(recordsInUse(n).map(t => stripNotes(t.name)), checksInForce(n).map(c => stripNotes(c.name)));
    return GT.inForce + ': ' + (names.length ? names.join(', ') : GT.inForceNone) + '.';
  }

  // One round's section: date, intro, time, seed, generated and hand-written cases.
  function roundPart(R, i) {
    const g = data.game;
    const rp = 'game.rounds.' + i;
    return part('rd-' + R.id, fill(GT.round, { n: i + 1 }) + ': ' + stripNotes(R.dateText), d => {
      d.append(textField(GT.dateText, rp + '.dateText'),
        grid(numberField(GT.day, () => R.day, v => { R.day = v; }), numberField(GT.roundTime, () => R.time, v => { R.time = Math.max(0, v); }, 0),
          textField(GT.seed, rp + '.seed'), selectField(GT.roundClean, [['', GT.useDefault]].concat(verdictOptions()), () => R.cleanVerdict || '', v => { R.cleanVerdict = v; })),
        textField(GT.roundIntro, rp + '.intro', true), el('p', {}, inForceSummary(i + 1)));
      const G = R.generate;
      d.append(fieldset(GT.generate,
        grid(numberField(GT.count, () => G.count, v => { G.count = Math.max(0, Math.min(50, v)); }, 0, 50),
          numberField(GT.errorCases, () => G.errorCases, v => { G.errorCases = Math.max(0, v); }, 0),
          numberField(GT.errorsPerCase, () => G.errorsPerCase, v => { G.errorsPerCase = Math.max(1, v); }, 1)),
        checkList(GT.errorTypes, named(g.checks), () => G.errorTypes, v => { G.errorTypes = v; }),
        textField(GT.descriptions, rp + '.generate.descriptions', true)));
      d.append(part('hc-' + R.id, GT.handCases, cd => {
        R.cases.forEach((c, j) => cd.append(casePart(R, i, c, j)));
        cd.append(buttonRow(addButton(GT.addCase, R.cases, n => ({ id: newId('c'), description: '[Hand-written case ' + n + ']', attrs: {}, records: [], event: '', correct: '' }), 'case-')));
      }));
      const placed = fieldset(GT.placed, el('p', {}, GT.placedHelp));
      R.events.forEach((p, k) => {
        const row = el('div', { class: 'ge-cond' });
        row.append(selectField(GT.caseEvent, named(g.events, 'kind'), () => p.event, v => { p.event = v; }),
          numberField(GT.onCase, () => p.at, v => { p.at = Math.max(1, v); }, 1), el('div'),
          panelButton(GT.remove, () => { R.events.splice(k, 1); reshaped(); }, 'ed-danger'));
        placed.append(row);
      });
      if (g.events.length) placed.append(buttonRow(panelButton(GT.addPlaced, () => { R.events.push({ event: g.events[0].id, at: 1 }); reshaped(); })));
      d.append(placed, buttonRow(panelButton(GT.playRound, () => testRound(i)), deleteButton(GT.deleteRound, g.rounds, i, 1)));
    });
  }

  // One hand-written case: its description, details, records, event and answer.
  function casePart(R, i, c, j) {
    const g = data.game;
    const cp = 'game.rounds.' + i + '.cases.' + j;
    return part('case-' + c.id, fill(GT.handCase, { n: j + 1 }), d => {
      d.append(textField(GT.caseDescription, cp + '.description', true),
        grid(...g.caseAttributes.map(a => textField(stripNotes(a.label), cp + '.attrs.' + a.id))),
        grid(selectField(GT.caseEvent, [['', GT.none]].concat(named(g.events, 'kind')), () => c.event || '', v => { c.event = v; }),
          selectField(GT.caseCorrect, [['', GT.automatic]].concat(verdictOptions()), () => c.correct || '', v => { c.correct = v; })));
      c.records.forEach((rec, k) => {
        const t = byId(g.recordTypes, rec.type);
        const fs = fieldset(fill(GT.caseRecord, { n: k + 1 }),
          selectField(GT.record, named(g.recordTypes), () => rec.type, v => { rec.type = v; }, true));
        if (t) fs.append(grid(...t.fields.map(f => textField(stripNotes(f.label) + (f.kind === 'expiry' ? ' ' + GT.dayNumber : ''), cp + '.records.' + k + '.values.' + f.id))));
        fs.append(buttonRow(deleteButton(GT.deleteRecord, c.records, k, 0)));
        d.append(fs);
      });
      const issues = findIssues(c, i).map(is => stripNotes((byId(g.checks, is.check) || {}).name));
      d.append(buttonRow(g.recordTypes.length && panelButton(GT.addRecord, () => { c.records.push({ type: g.recordTypes[0].id, values: {} }); reshaped(); })),
        el('p', { class: 'ed-hint' }, issues.length ? GT.found + issues.join(', ') : GT.foundNone),
        buttonRow(deleteButton(GT.deleteCase, R.cases, j, 0)));
    });
  }

  function newChoice(n) { return { id: newId('k'), label: '[Choice ' + n + ']', result: '[What happens]', effects: blankEffects(), correctVerdict: '' }; }

  // One event's section: its text and choices.
  function eventPart(ev, i) {
    const ep = 'game.events.' + i;
    return part('ev-' + ev.id, fill(GT.event, { n: i + 1 }) + ': ' + stripNotes(ev.kind), d => {
      d.append(textField(GT.eventKind, ep + '.kind'), textField(GT.eventText, ep + '.text', true));
      ev.choices.forEach((ch, j) => {
        const chp = ep + '.choices.' + j;
        d.append(fieldset(fill(GT.choice, { n: j + 1 }), textField(GT.choiceLabel, chp + '.label'), textField(GT.choiceResult, chp + '.result', true),
          effectsFields(ch.effects),
          selectField(GT.choiceVerdict, [['', GT.noChange]].concat(verdictOptions()), () => ch.correctVerdict || '', v => { ch.correctVerdict = v; }),
          buttonRow(deleteButton(GT.deleteChoice, ev.choices, j, 1))));
      });
      d.append(buttonRow(addButton(GT.addChoice, ev.choices, newChoice), deleteButton(GT.deleteEvent, data.game.events, i, 0)));
    });
  }

  // One ending's section: its words, when it is checked, and its conditions.
  function endingPart(e, i) {
    const g = data.game;
    const ep = 'game.endings.' + i;
    return part('end-' + e.id, fill(GT.ending, { n: i + 1 }) + ': ' + stripNotes(e.title), d => {
      d.append(textField(GT.title, ep + '.title'), textField(GT.endingVerdict, ep + '.verdict'), textField(GT.text, ep + '.text', true),
        grid(selectField(GT.endingTone, ENDING_TONES.map(t => [t, GT.endingTones[t]]), () => e.tone, v => { e.tone = v; }),
          selectField(GT.when, [['any', GT.whenNames.any], ['final', GT.whenNames.final]], () => e.when, v => { e.when = v; })));
      const what = Object.keys(GT.whatNames).map(k => [k, GT.whatNames[k]])
        .concat(g.factions.map(f => ['faction:' + f.id, GT.factionWord + ' ' + stripNotes(f.name)]))
        .concat(g.flags.map(f => ['flag:' + f.id, GT.flagWord + ': ' + stripNotes(f.name)]));
      const fs = fieldset(GT.conditions);
      if (!e.conditions.length) fs.append(el('p', {}, GT.noConditions));
      e.conditions.forEach((c, k) => {
        const row = el('div', { class: 'ge-cond' });
        row.append(selectField(GT.what, what, () => c.what, v => { c.what = v; }),
          selectField(GT.op, OPS.map(o => [o, GT.opNames[o]]), () => c.op, v => { c.op = v; }),
          numberField(GT.value, () => c.value, v => { c.value = v; }),
          panelButton(GT.remove, () => { e.conditions.splice(k, 1); reshaped(); }, 'ed-danger'));
        fs.append(row);
      });
      fs.append(buttonRow(panelButton(GT.addCondition, () => { e.conditions.push({ what: 'money', op: 'lt', value: 0 }); reshaped(); })));
      d.append(fs, buttonRow(
        panelButton(GT.showEnding, () => { if (!run) run = newRun(); run.phase = 'end'; run.ending = e.id; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }),
        i > 0 && panelButton(GT.moveUp, () => { g.endings.splice(i - 1, 0, g.endings.splice(i, 1)[0]); reshaped(); }),
        deleteButton(GT.deleteEnding, g.endings, i, 1)));
    });
  }

  /* -------------------------------------------------------------------
     9. GETTING EVERYTHING GOING
     ------------------------------------------------------------------- */
  render();

  // Three ways into edit mode: the footer link, Ctrl+Shift+E, or #edit in the address.
  $('#edit-link').addEventListener('click', e => { e.preventDefault(); startEditing(); });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'e') { e.preventDefault(); startEditing(); }
  });
  window.addEventListener('hashchange', () => { if (location.hash === '#edit') startEditing(); });

  loadAutoSave().finally(() => { if (location.hash === '#edit') startEditing(); });
})();
</script>
</body>
</html>
