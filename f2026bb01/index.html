<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papers Please Redux</title>
<style>
/* =====================================================================
   STYLES
   An inspection-desk game. To restyle the page, change the colours and
   fonts in :root below. Only fonts already on the computer are used.
   ===================================================================== */
:root {
  --ink:        #23211c;    /* dark text, borders */
  --wall:       #2c3532;    /* page background behind everything */
  --paper:      #f3ecd9;    /* panels */
  --paper-dark: #e2d7bb;    /* darker panels, empty bars, card headings */
  --card:       #fbf8ee;    /* records on the desk */
  --desk:       #6a523a;    /* the desk */
  --desk-dark:  #463628;    /* the desk's edge */
  --accent:     #8a3b1e;    /* headings, hover */
  --steel:      #555d63;    /* quieter text */
  --green:      #2f6b2f;    /* good */
  --red:        #9b2222;    /* bad */
  --amber:      #8c6410;    /* in between */
  --select:     #1f5fbf;    /* a detail picked in inspect mode */
  --highlight:  #fbe6b4;    /* the highlighted footnote */
  --font-head:  Georgia, "Times New Roman", serif;
  --font-body:  Georgia, "Times New Roman", serif;
  --font-ui:    system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-rec:   ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;

  /* Editor colours (only seen in edit mode) */
  --edit-outline: #2a6edc;
  --edit-bar: #1d2330;
  --edit-bar-text: #eef1f6;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--wall);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  overflow-wrap: break-word;
}
.ml { white-space: pre-line; }
.muted { color: var(--steel); font-style: italic; font-size: 0.92rem; margin: 0.3rem 0; }
.icon { width: 1.25em; height: 1.25em; flex: none; vertical-align: -0.25em; }

/* ----- Screens (start, round intro, post, ledger, ending) ----- */
.screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 16px 4rem; }
.sheet { background: var(--paper); border: 2px solid var(--ink); width: 100%; max-width: 760px; padding: 1.6rem 1.4rem 1.8rem; box-shadow: 6px 8px 0 rgba(0,0,0,.35); }
.sheet + .sheet { margin-top: 1.2rem; }
.masthead { text-align: center; border-bottom: 3px double var(--ink); padding-bottom: 0.8rem; margin-bottom: 1rem; }
.masthead-top { font: 600 0.72rem/1.3 var(--font-ui); letter-spacing: 0.22em; text-transform: uppercase; color: var(--steel); }
.masthead h1 { margin: 0.3rem 0; font-family: var(--font-head); font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.05; }
.masthead-sub { font-style: italic; color: var(--steel); }
.intro-text { font-size: 1.05rem; line-height: 1.65; }
.how-to-play { background: var(--paper-dark); border: 1px solid var(--ink); padding: 1rem 1.2rem; margin: 1.2rem 0; }
.how-to-play h3 { margin: 0 0 0.5rem; font: 700 0.85rem/1.3 var(--font-ui); letter-spacing: 0.12em; text-transform: uppercase; }
.how-to-play ul { margin: 0; padding-left: 1.2em; display: grid; gap: 0.25rem; font-size: 0.95rem; line-height: 1.5; }
.htp-edit { font-size: 0.95rem; line-height: 1.5; }
.sheet h2 { font-family: var(--font-head); font-size: 1.7rem; margin: 0 0 0.4rem; }
.sheet h3 { font: 700 0.82rem/1.3 var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; margin: 1.2rem 0 0.4rem; color: var(--accent); }
.sheet ul.plain { margin: 0; padding-left: 1.2em; display: grid; gap: 0.3rem; line-height: 1.5; }
.date-line { font: 600 0.85rem/1.4 var(--font-ui); color: var(--steel); letter-spacing: 0.05em; }

/* ----- Buttons ----- */
.btn-primary {
  display: inline-block; cursor: pointer; text-align: center;
  background: var(--ink); color: var(--paper); border: none;
  font: 700 0.95rem/1.2 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase;
  padding: 0.75rem 1.2rem; transition: background 0.15s;
}
.btn-primary:hover, .btn-primary:focus-visible { background: var(--accent); outline: none; }
.btn-primary.full { display: block; width: 100%; margin-top: 1rem; }
.btn-primary.is-disabled { opacity: 0.4; cursor: default; }
.btn-secondary {
  display: inline-block; cursor: pointer; border: 1.5px solid var(--ink); color: var(--ink); background: transparent;
  font: 700 0.82rem/1.2 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; padding: 0.55rem 0.9rem;
}
.btn-secondary:hover, .btn-secondary:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
.btn-secondary.on { background: var(--select); border-color: var(--select); color: #fff; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 0.6rem; }

/* ----- Status bar along the top of the post ----- */
.status-bar {
  width: 100%; max-width: 1100px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  background: var(--paper); border: 2px solid var(--ink); padding: 8px 10px; margin-bottom: 14px;
  font: 600 0.85rem/1.3 var(--font-ui);
}
.chip { padding: 4px 8px; border: 1px solid rgba(35,33,28,.35); background: var(--card); }
.chip.title { font-family: var(--font-head); font-size: 1.05rem; border: none; background: none; padding-left: 0; }
.time-wrap { flex: 1 1 200px; min-width: 0; }
.time-bar { height: 8px; background: var(--paper-dark); border: 1px solid rgba(35,33,28,.35); margin-top: 3px; }
.time-bar div { height: 100%; background: var(--green); transition: width .3s; }
.time-bar div.low { background: var(--red); }
.sound-btn { margin-left: auto; }

/* ----- The post: two columns on a computer, one on a phone ----- */
.post { width: 100%; max-width: 1100px; display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 14px; align-items: start; }
.post-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (max-width: 760px) {
  .post { display: flex; flex-direction: column; }
  .post-col { display: contents; }
  .o-case { order: 1; } .o-event { order: 2; } .o-desk { order: 3; } .o-tools { order: 4; }
  .o-verdict { order: 5; } .o-book { order: 6; } .o-log { order: 7; }
}
.panel { background: var(--paper); border: 1.5px solid var(--ink); padding: 0.9rem 1rem; width: 100%; }
.panel-title { font: 700 0.75rem/1.3 var(--font-ui); letter-spacing: 0.18em; text-transform: uppercase; border-bottom: 1px solid var(--ink); padding-bottom: 0.35rem; margin-bottom: 0.7rem; }

/* The case */
.case-head { font-family: var(--font-head); font-size: 1.25rem; font-weight: 700; margin-bottom: 0.4rem; }
.case-desc { margin: 0 0 0.6rem; line-height: 1.55; font-size: 0.97rem; }
.attr-row { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-top: 1px dotted rgba(35,33,28,.35); font-size: 0.95rem; }
.attr-label { color: var(--steel); flex: 0 0 auto; }
.attr-value { margin-left: auto; font-weight: 700; text-align: right; font-family: var(--font-rec); }

/* A scripted event (plea, bribe, request, instruction) */
.event-panel { border-color: var(--accent); border-width: 2px; }
.event-kind { display: inline-block; background: var(--accent); color: var(--paper); font: 700 0.7rem/1.3 var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; padding: 0.15rem 0.5rem; margin-bottom: 0.5rem; }
.event-text { line-height: 1.6; margin-bottom: 0.6rem; }
.choice-btn { display: block; width: 100%; text-align: left; cursor: pointer; background: var(--card); border: 1.5px solid var(--ink); padding: 0.6rem 0.8rem; margin-top: 0.5rem; font-size: 0.95rem; }
.choice-btn:hover, .choice-btn:focus-visible { background: var(--paper-dark); outline: none; }
.event-result { font-style: italic; line-height: 1.55; border-left: 3px solid var(--accent); padding-left: 0.6rem; }

/* Inspect mode: details that can be tapped */
.inspecting .detail { cursor: crosshair; outline: 1px dashed rgba(31,95,191,.6); outline-offset: -1px; }
.inspecting .detail:hover { background: rgba(31,95,191,.08); }
.detail.selected { background: rgba(31,95,191,.2) !important; outline: 2px solid var(--select) !important; }
.detail.flagged { background: rgba(155,34,34,.12); box-shadow: inset 3px 0 0 var(--red); }
.message { margin-top: 0.6rem; padding: 0.5rem 0.7rem; border-left: 4px solid var(--steel); background: var(--card); font-size: 0.93rem; }
.message.good { border-color: var(--green); }
.message.bad { border-color: var(--red); }
.flag-item { border-top: 1px dashed rgba(35,33,28,.35); padding: 0.5rem 0; }
.flag-name { font-weight: 700; color: var(--red); }
.flag-explain { font-size: 0.9rem; line-height: 1.5; margin: 0.2rem 0; }
.followup-response { font-size: 0.9rem; font-style: italic; border-left: 3px solid var(--steel); padding-left: 0.5rem; margin: 0.3rem 0; }

/* Verdict stamps */
.verdicts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stamp {
  cursor: pointer; text-align: center; padding: 0.7rem 0.5rem; border: 3px solid currentColor; background: var(--card);
  font: 800 0.95rem/1.2 var(--font-ui); letter-spacing: 0.1em; text-transform: uppercase; transform: rotate(-1deg);
}
.stamp.good { color: var(--green); } .stamp.bad { color: var(--red); } .stamp.neutral { color: var(--amber); }
.stamp:hover, .stamp:focus-visible { background: currentColor; outline: none; }
.stamp:hover > *, .stamp:focus-visible > * { color: var(--card); }
.stamp.is-disabled { opacity: 0.35; cursor: default; }

/* The desk and the records on it */
.desk {
  position: relative; height: 470px; overflow: hidden; border: 4px solid var(--desk-dark); border-radius: 4px;
  background: repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 38px), linear-gradient(160deg, #75593f, var(--desk));
}
.rec-card { position: absolute; width: 250px; max-width: calc(100% - 8px); background: var(--card); border: 1px solid var(--ink); box-shadow: 3px 4px 0 rgba(0,0,0,.35); font: 13px/1.35 var(--font-rec); }
.rec-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--paper-dark); border-bottom: 1px solid var(--ink); font-weight: 700; cursor: grab; touch-action: none; user-select: none; }
.rec-head:active { cursor: grabbing; }
.rec-row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 8px; border-bottom: 1px dotted rgba(35,33,28,.3); }
.rec-row:last-child { border-bottom: none; }
.rec-label { color: var(--steel); }
.rec-value { font-weight: 700; text-align: right; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; padding: 8px; background: var(--desk); border: 4px solid var(--desk-dark); }
.rec-tile { display: flex; align-items: center; gap: 6px; cursor: pointer; background: var(--card); border: 1px solid var(--ink); padding: 0.7rem 0.6rem; font: 700 13px/1.3 var(--font-rec); }
.rec-sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; }
.rec-sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 80vh; overflow-y: auto; z-index: 41; background: var(--paper); border-top: 3px solid var(--ink); padding: 16px; }
.rec-sheet .rec-card { position: static; width: 100%; max-width: none; font-size: 15px; }
.rec-sheet .rec-row { padding: 9px 10px; }
.rec-sheet .rec-head { cursor: default; }

/* The rulebook */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 0.6rem; }
.tab { cursor: pointer; padding: 0.35rem 0.7rem; border: 1px solid var(--ink); background: var(--card); font: 600 0.82rem/1.3 var(--font-ui); }
.tab.on { background: var(--ink); color: var(--paper); }
.rules { list-style: none; margin: 0; padding: 0; }
.rule { padding: 0.5rem 0.4rem; border-top: 1px dotted rgba(35,33,28,.35); line-height: 1.5; font-size: 0.95rem; }
.badge { display: inline-block; margin-left: 6px; background: var(--amber); color: #fff; font: 700 0.65rem/1.4 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; padding: 0 5px; vertical-align: 1px; }

/* Record of the round */
.log { max-height: 200px; overflow-y: auto; font-size: 0.88rem; line-height: 1.5; }
.log div { padding: 3px 0; border-bottom: 1px dashed rgba(35,33,28,.2); }
.log .good { color: var(--green); } .log .bad { color: var(--red); }

/* ----- The ledger ----- */
.ledger-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dotted rgba(35,33,28,.35); align-items: center; }
.ledger-row.total { font-weight: 700; font-size: 1.1rem; border-bottom: 3px double var(--ink); }
.ledger-row .amount { font-family: var(--font-rec); font-weight: 700; white-space: nowrap; }
.ledger-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.ledger-row input { width: 18px; height: 18px; flex: none; }
.money-up { color: var(--green); } .money-down { color: var(--red); }
.dep-row { padding: 6px 0; border-bottom: 1px dotted rgba(35,33,28,.35); }
.dep-status { font-size: 0.9rem; color: var(--steel); }
.dep-status .bad { color: var(--red); font-weight: 700; }

/* ----- Ending screen ----- */
.ending-card { text-align: center; }
.ending-stamp { font: 600 0.75rem/1.3 var(--font-ui); letter-spacing: 0.2em; text-transform: uppercase; color: var(--steel); margin-bottom: 0.5rem; }
.ending-title { font-family: var(--font-head); font-size: 2.1rem; font-weight: 700; line-height: 1.1; margin-bottom: 0.8rem; }
.ending-verdict { display: inline-block; padding: 0.3rem 1rem; font: 700 0.8rem/1.3 var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 1.2rem; }
.ending-verdict.win { background: var(--green); color: var(--paper); }
.ending-verdict.mixed { background: var(--amber); color: var(--paper); }
.ending-verdict.lose { background: var(--red); color: var(--paper); }
.ending-body { line-height: 1.7; text-align: left; margin-bottom: 1.2rem; }
.ending-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.5rem 1rem; text-align: left; font-size: 0.9rem; border-top: 1px solid rgba(35,33,28,.3); border-bottom: 1px solid rgba(35,33,28,.3); padding: 0.8rem 0; }
.ending-stats span { color: var(--steel); font-style: italic; }

/* ----- Footer ----- */
.site-footer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; max-width: 1100px; margin: 0 auto; padding: 16px 16px 40px; color: #b3bbb6; font: 14px/1.4 var(--font-ui); }
.site-footer p { margin: 0; }
.author { flex: 1 1 auto; }
.local-note { flex-basis: 100%; color: #e0b860; }
.edit-link { color: #b3bbb6; opacity: .4; text-decoration: none; }
.edit-link:hover, .edit-link:focus-visible { opacity: 1; text-decoration: underline; }

/* ----- Footnotes ----- */
.fn-ref { font: 700 .65em/0 var(--font-ui); color: var(--accent); padding: 0 1px; cursor: pointer; }
.fn-ref:hover { text-decoration: underline; }
[role="button"] .fn-ref, a .fn-ref, .event-kind .fn-ref, .ending-verdict .fn-ref, .tab.on .fn-ref { color: inherit; }
.notes-fab {
  position: fixed; top: 12px; right: 12px; z-index: 50; font: 600 13px/1 var(--font-ui); cursor: pointer;
  padding: 8px 14px; border-radius: 6px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); box-shadow: 0 2px 10px rgba(0,0,0,.25);
}
.notes-fab:hover, .notes-fab:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
.notes-dialog { border: none; border-radius: 4px; padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--paper); color: var(--ink); box-shadow: 0 12px 48px rgba(0,0,0,.5); }
.notes-dialog::backdrop { background: rgba(20, 20, 18, .6); }
.notes-inner { display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
.notes-inner h2 { margin: 0; padding: 16px 20px; font: 700 1.3rem/1.2 var(--font-head); border-bottom: 1px solid var(--ink); }
.notes-list { margin: 0; padding: 16px 20px 16px 2.6em; overflow-y: auto; font-size: 16px; line-height: 1.5; }
.notes-list li { margin: 0 0 .6em; padding: 4px 8px; white-space: pre-line; overflow-wrap: anywhere; }
.notes-list li.current { background: var(--highlight); }
.notes-list a { color: var(--accent); }
.notes-actions { padding: 12px 20px 16px; border-top: 1px solid var(--ink); text-align: right; }

/* =====================================================================
   EDITOR STYLES (only seen after entering the password)
   ===================================================================== */
body.is-editing { padding-bottom: 120px; }
body.is-editing [data-text] { outline: 1px dotted var(--edit-outline); outline-offset: 3px; cursor: text; min-height: 1em; min-width: 1em; }
body.is-editing [data-text]:focus { outline: 2px solid var(--edit-outline); background: rgba(42,110,220,.08); }

.ed-ui, .ed-ui * { font: 14px/1.4 var(--font-ui); box-sizing: border-box; }
.edit-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; background: var(--edit-bar); color: var(--edit-bar-text); box-shadow: 0 -2px 12px rgba(0,0,0,.25); }
.edit-bar .ed-status { flex: 1 1 220px; color: #b7c0cf; font-size: 13px; }
.ed-btn { appearance: none; border: 1px solid #c9ced8; background: #fff; color: #1d2330; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.ed-btn:hover { background: #eef2f9; }
.ed-btn.ed-primary { background: var(--edit-outline); border-color: var(--edit-outline); color: #fff; }
.edit-bar .ed-btn { border-color: #3a4357; background: #2a3242; color: var(--edit-bar-text); }
.edit-bar .ed-btn:hover { background: #343e52; }
.edit-bar .ed-btn.ed-primary { background: var(--edit-outline); border-color: var(--edit-outline); }

.ed-dialog { border: none; border-radius: 10px; padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); color: #1d2330; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.ed-dialog::backdrop { background: rgba(15,20,30,.5); }
.ed-dialog form { padding: 20px; display: grid; gap: 10px; }
.ed-dialog h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; outline: none; }
.ed-dialog p { margin: 0; color: #4c5566; }
.ed-dialog label { font-weight: 600; margin-top: 4px; }
.ed-dialog input, .ed-dialog textarea { width: 100%; padding: 7px 9px; border: 1px solid #c9ced8; border-radius: 6px; background: #fff; color: #1d2330; }
.ed-dialog textarea { resize: vertical; min-height: 2.6em; }
.ed-dialog .ed-group { margin-top: 10px; padding-top: 8px; border-top: 1px solid #e1e4ea; font-weight: 700; color: #1d2330; }
.ed-dialog .ed-hint { color: #1d2330; background: #eef4ff; border-left: 3px solid var(--edit-outline); padding: 6px 10px; }
.ed-dialog .ed-error { color: #b42318; }
.ed-dialog .ed-error:empty { display: none; }
.ed-dialog .ed-buttons { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.ed-link { justify-self: start; border: 0; background: none; padding: 4px 0; color: var(--edit-outline); text-decoration: underline; cursor: pointer; }

/* The Game editor panel (under the game, edit mode only) */
.game-editor { max-width: 1100px; margin: 24px auto; padding: 16px; background: #fff; color: #1d2330; border: 2px solid var(--edit-outline); border-radius: 8px; }
@media (max-width: 1132px) { .game-editor { margin: 24px 16px; } }
.game-editor h2 { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
.game-editor p { margin: 4px 0; color: #4c5566; }
.game-editor .ed-hint { color: #1d2330; background: #eef4ff; border-left: 3px solid var(--edit-outline); padding: 6px 10px; }
.game-editor details { border: 1px solid #e1e4ea; border-radius: 6px; margin: 8px 0; padding: 0 12px; background: #fafbfd; }
.game-editor details[open] { padding-bottom: 12px; }
.game-editor summary { cursor: pointer; padding: 9px 0; font-weight: 700; }
.game-editor details details { background: #fff; }
.game-editor details details details { background: #fafbfd; }
.game-editor fieldset { border: 1px solid #e1e4ea; border-radius: 6px; margin: 10px 0 0; padding: 8px 10px 10px; min-width: 0; }
.game-editor legend { font-weight: 700; padding: 0 4px; }
.game-editor label { display: block; font-weight: 600; margin-top: 8px; }
.game-editor label.ge-check { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.game-editor input[type=text], .game-editor input[type=number], .game-editor textarea, .game-editor select { width: 100%; padding: 6px 8px; border: 1px solid #c9ced8; border-radius: 6px; background: #fff; color: #1d2330; }
.game-editor textarea { resize: vertical; min-height: 4.2em; }
.game-editor .ge-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.game-editor .ge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 10px; align-items: end; }
.game-editor .ge-cond { display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 0 8px; align-items: end; }
.game-editor .ge-checks { display: flex; flex-wrap: wrap; gap: 2px 16px; }
.game-editor .ed-btn.ed-danger { color: #b42318; border-color: #e7b4ae; }
@media (max-width: 520px) { .game-editor .ge-cond { grid-template-columns: 1fr; } }

.ed-help h3 { margin: 12px 0 4px; font-size: 15px; font-weight: 700; }
.ed-help ol, .ed-help ul { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; }
.ed-help li { color: #2c3443; }
.ed-help b { font-weight: 700; }

<!-- =====================================================================
     PAGE SHELL
     The words are NOT written here. The script below draws the start
     screen, the round screens, the ledger and the ending screen into #app
     from the game data. The footer is filled in the same way:
       data-text="page.author"  text that is edited by clicking on it
       data-label="ui.editLink" text that is edited in the "Other text…" window
     ===================================================================== -->
<button type="button" class="notes-fab" id="notes-btn" hidden></button>

<div id="app"></div>

<footer class="site-footer">
  <p class="author" data-text="page.author"></p>
  <a href="#edit" class="edit-link" id="edit-link" data-label="ui.editLink"></a>
  <p class="local-note" id="local-note" data-label="ui.localChangesNote" hidden></p>
</footer>

<!-- The footnotes pop-up. Opens on top of whatever screen the player is on. -->
<dialog class="notes-dialog" id="notes-dialog">
  <div class="notes-inner">
    <h2 id="notes-title"></h2>
    <ol class="notes-list" id="notes-list"></ol>
    <div class="notes-actions"><button type="button" class="btn-primary" id="notes-back" autofocus></button></div>
  </div>
</dialog>

<!-- =====================================================================
     GAME DATA: every word the player sees lives here.

     How it is organized:
       schemaVersion  A number. It goes up if the layout of this data changes.
       auth           The editor password check: a random "salt" and a
                      scrambled "hash". The real password is NOT stored anywhere.
       page           The title, introduction, "How to play" list (one rule
                      per line) and author line.
       ui             Headings, buttons and messages, including the footnote
                      wording and the browser tab title. Words in {curly
                      brackets} are filled in by the game: {n}, {total},
                      {cost}, {amount} and so on, and also every word in
                      game.labels, e.g. {case}, {round}, {time}, {rulebook}.
       game           The game itself, edited in the editor's "Game editor":
         labels       the words for your setting: the player's role, the
                      post, what a case is called, what records and the
                      rulebook are called, what a round is called ("Day"),
                      the time unit, the money, the currency symbol, and
                      how a day number is written ("dayFormat")
         startMoney   savings at the start of the game
         time         perRound: time units in a round (a round can set its
                      own); call, inspect, verdict: what each action costs
         scoring      warnings: citations each round that cost nothing;
                      penalty: what each citation after that costs
         cleanVerdict, issueVerdict   the right verdict (by id) for a case
                      with nothing wrong, and for a case with a discrepancy
                      (a discrepancy type can name its own instead)
         verdicts     the stamps: name, pay for a correct use, tone (good,
                      bad, neutral) and effects every time it is used
         caseAttributes  what every case has (e.g. a name or address): a
                      label, an icon from the built-in set, and the values
                      that generated cases pick from
         lists        lists of valid and invalid values (e.g. issuers)
         recordTypes  the kinds of record: name, icon, the rounds it is in
                      use ("from", "until"; 0 means no end) and its fields.
                      A field's "kind" is attr (copies a case attribute),
                      expiry (a day number), number (min to max), list (from
                      a value list) or text (one of its "options")
         rulePages, rules   the rulebook: pages, and rules on them, each in
                      force from one round until another
         checks       the discrepancy types: a name, a kind (fieldVsField,
                      fieldVsCase, expired, outOfRange, missingRecord,
                      badList, breaksRule), what it looks at (record, field,
                      attr, list, min, max, forbidden), the rule it pairs with,
                      its verdict, an explanation, the rounds it is in use,
                      and its follow-ups (name, time cost, scripted response)
         rounds       one per round: date text, day number, intro, time,
                      seed (the same seed always makes the same cases),
                      cleanVerdict, generate (count, errorCases,
                      errorsPerCase, errorTypes, descriptions), hand-written
                      "cases" (description, attrs, records, event, correct)
                      and "events" placed on case numbers
         events       pleas, bribes, requests and orders: a kind, the text,
                      and choices (label, result, effects, correctVerdict)
         factions, flags  the standing and true/false values that choices change
         dependants   names and needs (status when unmet, rounds unmet before
                      the consequence, and whether they are then lost)
         expenses     name, cost, mandatory, and the needs it covers
                      ("dependantId.needId")
         upgrades     name, description, cost, kind (time, cheaper, warning,
                      pay), action (for "cheaper") and amount
         endings      checked in order after every round; the first one whose
                      conditions are all true wins. "when" is any (after any
                      round) or final (only after the last round)
       Effects are { "money": 0, "citations": 0, "factions": { id: n },
       "flags": { id: "on" or "off" } }.

     Footnotes: in ANY text, type {{fn: your citation}} right where the note
     belongs, e.g.  A sentence that needs a source.{{fn: Author, Title, Year, page}}

     You don't need to edit this by hand: click the faint "Edit" link at the
     bottom of the page, make changes, then click "Save file".
     ===================================================================== -->

  // Fill in any missing keys from DEFAULTS, without changing keys that exist.
  // (Lists, like the rounds, are only filled in if they are missing completely.)
  function withDefaults(d) {
    (function fill(target, defaults) {
      Object.keys(defaults).forEach(k => {
        const def = defaults[k];
        if (!(k in target)) target[k] = clone(def);
        else if (def && typeof def === 'object' && !Array.isArray(def) && target[k] && typeof target[k] === 'object') fill(target[k], def);
      });
    })(d, DEFAULTS);
    const g = d.game;
    const list = (o, k) => { if (!Array.isArray(o[k])) o[k] = []; return o[k]; };
    const effects = x => Object.assign({ money: 0, citations: 0, factions: {}, flags: {} }, x);
    ['verdicts', 'caseAttributes', 'lists', 'recordTypes', 'rulePages', 'rules', 'checks', 'rounds', 'events',
      'factions', 'flags', 'dependants', 'expenses', 'upgrades', 'endings'].forEach(k => list(g, k));
    if (!g.verdicts.length) g.verdicts = clone(DEFAULTS.game.verdicts);
    if (!g.rounds.length) g.rounds = clone(DEFAULTS.game.rounds);
    g.verdicts.forEach(v => { v.effects = effects(v.effects); if (!TONES.includes(v.tone)) v.tone = 'neutral'; });
    g.caseAttributes.forEach(a => list(a, 'values'));
    g.lists.forEach(l => { list(l, 'valid'); list(l, 'invalid'); });
    g.recordTypes.forEach(t => list(t, 'fields').forEach(f => { list(f, 'options'); if (!FIELD_KINDS.includes(f.kind)) f.kind = 'text'; }));
    g.checks.forEach(c => { list(c, 'forbidden'); list(c, 'followUps'); if (!CHECK_KINDS.includes(c.kind)) c.kind = 'fieldVsCase'; });
    g.rounds.forEach(r => {
      r.generate = Object.assign({ count: 0, errorCases: 0, errorsPerCase: 1, errorTypes: [], descriptions: '' }, r.generate);
      list(r.generate, 'errorTypes');
      list(r, 'cases').forEach(c => { c.attrs = c.attrs || {}; list(c, 'records').forEach(rec => { rec.values = rec.values || {}; }); });
      list(r, 'events');
    });
    g.events.forEach(e => list(e, 'choices').forEach(ch => { ch.effects = effects(ch.effects); }));
    g.dependants.forEach(p => list(p, 'needs'));
    g.expenses.forEach(x => list(x, 'covers'));
    g.endings.forEach(e => { list(e, 'conditions'); if (!ENDING_TONES.includes(e.tone)) e.tone = 'mixed'; if (e.when !== 'final') e.when = 'any'; });
    return d;
  }

  /* -------------------------------------------------------------------
     3. SMALL HELPERS
     ------------------------------------------------------------------- */
  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
  const $ = sel => document.querySelector(sel);

  // Read or write a value using a dotted path such as "page.title".
  function getPath(obj, path) {
    return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
  }
  function setPath(obj, path, value) {
    const keys = path.split('.');
    const last = keys.pop();
    const target = keys.reduce((o, k) => (o[k] = o[k] || {}), obj);
    target[last] = value;
  }

  // The data without the password check (auto-saves never store it).
  function withoutAuth(d) { const c = clone(d); delete c.auth; return c; }
  // True if some data is the same as the uploaded file's data.
  function sameAsFile(d) { return JSON.stringify(withoutAuth(d)) === JSON.stringify(withoutAuth(FILE_DATA)); }
  // Put the file's own password check back in (it never comes from an auto-save).
  function withFileAuth(d) {
    const out = { schemaVersion: d.schemaVersion, auth: clone(FILE_DATA.auth) };
    Object.keys(d).forEach(k => { if (k !== 'auth' && k !== 'schemaVersion') out[k] = d[k]; });
    return out;
  }

  // Make an element. `attrs` is an object of attributes; `text` is set as textContent.
  function el(tag, attrs, text) {
    const e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(k => e.setAttribute(k, attrs[k]));
    if (text != null) e.textContent = text;
    return e;
  }

  // A short random id for new items, e.g. "e4k2x9".
  function newId(prefix) { return prefix + Math.random().toString(36).slice(2, 8); }

  // Fill in {words} in a piece of text, e.g. fill('At {time}', { time: '3:00' }).
  function fill(text, values) {
    return String(text == null ? '' : text).replace(/\{(\w+)\}/g, (m, k) => (k in values ? values[k] : m));
  }

  function num(v) { return Number(v) || 0; }
  function lines(text) { return String(text == null ? '' : text).split('\n').map(s => s.trim()).filter(Boolean); }
  // Two values are the same if they match apart from capitals and spaces at the ends.
  function same(a, b) { return String(a == null ? '' : a).trim().toLowerCase() === String(b == null ? '' : b).trim().toLowerCase(); }
  function byId(list, id) { return list.find(x => x.id === id) || null; }

  // The built-in icons: simple line drawings on a 24 × 24 grid, drawn as inline SVG.
  const ICONS = {
    person: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6',
    building: 'M4 21V5l8-3 8 3v16zM9 21v-5h6v5M8 8h2M14 8h2M8 12h2M14 12h2',
    house: 'M3 11l9-8 9 8M5 10v11h14V10M10 21v-6h4v6',

    document: 'M6 2h9l5 5v15H6zM15 2v5h5M9 12h8M9 16h8',
    seal: 'M12 3a6 6 0 1 0 0 12 6 6 0 0 0 0-12zM8.5 14L7 21l5-2 5 2-1.5-7',
    star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z',
    scale: 'M12 3v18M7 21h10M4 7h16M4 7l-2.5 6h5zM20 7l-2.5 6h5z',
    coin: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v10M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.6 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5',
    clock: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 3',
    ship: 'M3 16l2 5h14l2-5zM6 16V9h12v7M12 9V3'
  };
  function icon(name) {
    if (!ICONS[name]) return null;
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    [['viewBox', '0 0 24 24'], ['class', 'icon'], ['aria-hidden', 'true'], ['fill', 'none'], ['stroke', 'currentColor'],
      ['stroke-width', '1.6'], ['stroke-linecap', 'round'], ['stroke-linejoin', 'round']].forEach(([k, v]) => svg.setAttribute(k, v));
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', ICONS[name]);
    svg.append(path);
    return svg;
  }

  // Seeded random numbers: the same seed always gives the same numbers, so
  // a round's generated cases are the same every time it is played.
  function seededRandom(seed) {
    let h = parseInt(sha256(String(seed)).slice(0, 8), 16) | 0;
    return function () {
      h = (h + 0x6D2B79F5) | 0;
      let t = Math.imul(h ^ (h >>> 15), 1 | h);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* -------------------------------------------------------------------
     4. SHA-256
     Written out in plain JavaScript (not crypto.subtle) so it works however
     the page is opened: from disk (file://), plain http, or https.
     Used for the password check, file fingerprints and the case seeds.
     ------------------------------------------------------------------- */
  function sha256(text) {
    const K = [];
    const H = [];
    // The constants are the fractional parts of the square and cube roots of the first primes.
    for (let n = 2, found = 0; found < 64; n++) {
      let prime = true;
      for (let d = 2; d * d <= n; d++) if (n % d === 0) { prime = false; break; }
      if (!prime) continue;
      if (found < 8) H[found] = (Math.pow(n, 1 / 2) * 2 ** 32) | 0;
      K[found++] = (Math.pow(n, 1 / 3) * 2 ** 32) | 0;
    }
    const bytes = Array.from(new TextEncoder().encode(text));
    const bitLen = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? Math.floor(bitLen / 2 ** 32 / 2 ** ((i - 4) * 8)) & 0xff : (bitLen >>> (i * 8)) & 0xff);
    const rot = (x, n) => (x >>> n) | (x << (32 - n));
    const W = new Array(64);
    for (let off = 0; off < bytes.length; off += 64) {
      for (let i = 0; i < 16; i++) W[i] = (bytes[off + i * 4] << 24) | (bytes[off + i * 4 + 1] << 16) | (bytes[off + i * 4 + 2] << 8) | bytes[off + i * 4 + 3];
      for (let i = 16; i < 64; i++) {
        const s0 = rot(W[i - 15], 7) ^ rot(W[i - 15], 18) ^ (W[i - 15] >>> 3);
        const s1 = rot(W[i - 2], 17) ^ rot(W[i - 2], 19) ^ (W[i - 2] >>> 10);
        W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
      }
      let [a, b, c, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        const t1 = (h + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
        const t2 = ((rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      [a, b, c, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) | 0; });
    }
    return H.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
  }

  // A fingerprint of the uploaded file's content, stored with every auto-save.
  const FILE_FINGERPRINT = sha256(JSON.stringify(withoutAuth(FILE_DATA)));

  /* -------------------------------------------------------------------
     5. FOOTNOTES
     In ANY text, {{fn: citation}} becomes a small superscript number, and
     the citation is added to the footnote list of the "screen" it is on.
     A screen is whatever the player sees at one time: the start screen,
     a round's first screen, the post (redrawn after every action), the
     ledger or the ending, plus the footer.
     The footnotes button in the top corner opens the current screen's list;
     clicking a number in body text opens it with that note highlighted.
     ------------------------------------------------------------------- */
  const NOTE_RE = /\{\{\s*fn\s*:\s*([\s\S]*?)\s*\}\}/gi;
  const SCREEN_OF = new WeakMap();   // footnote number element -> its screen

  function newScreen() { return { notes: [] }; }

  // Text as page content, with each {{fn: ...}} swapped for a numbered marker.
  // Built from text nodes only: student text is never inserted as HTML.
  function withNotes(text, screen) {
    const frag = document.createDocumentFragment();
    const str = String(text == null ? '' : text);
    let last = 0;
    for (const m of str.matchAll(NOTE_RE)) {
      frag.append(str.slice(last, m.index));
      screen.notes.push(m[1]);
      const n = screen.notes.length;
      const sup = el('sup', { class: 'fn-ref', 'data-note': n, title: 'Footnote ' + n }, String(n));
      SCREEN_OF.set(sup, screen);
      frag.append(sup);
      last = m.index + m[0].length;
    }
    frag.append(str.slice(last));
    return frag;
  }

  // Where markup can't appear (tab title, labels, the record of the round): remove the markers.
  function stripNotes(text) { return String(text == null ? '' : text).replace(NOTE_RE, '').replace(/\s{2,}/g, ' ').trim(); }

  // A citation, with web addresses turned into links that open in a new tab.
  function citation(text) {
    const frag = document.createDocumentFragment();
    String(text).split(/(https?:\/\/[^\s<>"]+)/).forEach((part, i) => {
      if (i % 2 === 0) { frag.append(part); return; }
      frag.append(el('a', { href: part, target: '_blank', rel: 'noopener noreferrer' }, part));
    });
    return frag;
  }

  // Show "Footnotes (n)" on a screen's button, or hide it if there are none.
  function updateNotesButton(button, screen) {
    const count = screen.notes.length;
    if (!count || editing) { button.hidden = true; return; }
    // The button's own label may contain a footnote too; it joins the same list.
    button.replaceChildren(withNotes(data.ui.footnotesButton, screen), ' (' + screen.notes.length + ')');
    button.setAttribute('aria-label', stripNotes(data.ui.footnotesButton) + ' (' + screen.notes.length + ')');
    button.onclick = () => openNotes(screen);
    button.hidden = false;
  }

  // Open the footnotes pop-up for a screen, optionally highlighting one note.
  function openNotes(screen, highlight) {
    // The pop-up's own heading and button can hold footnotes as well; they
    // are numbered after the screen's notes, on a copy of its list.
    const shown = { notes: screen.notes.slice() };
    $('#notes-title').replaceChildren(withNotes(data.ui.footnotesTitle, shown));
    $('#notes-back').replaceChildren(withNotes(data.ui.footnotesBack, shown));
    const list = $('#notes-list');
    list.replaceChildren(...shown.notes.map((n, i) => {
      const li = el('li', { id: 'note-' + (i + 1) });
      li.append(citation(n));
      if (i + 1 === Number(highlight)) li.className = 'current';
      return li;
    }));
    const dlg = $('#notes-dialog');
    if (!dlg.open) dlg.showModal();
    const cur = list.querySelector('.current');
    if (cur) cur.scrollIntoView({ block: 'center' });
    else list.scrollTop = 0;
  }
  $('#notes-back').addEventListener('click', () => $('#notes-dialog').close());

  // Clicking a footnote number in body text opens its list with that note
  // highlighted. Numbers inside buttons and links don't, so they still work.
  document.addEventListener('click', e => {
    const ref = e.target.closest && e.target.closest('.fn-ref');
    if (!ref || editing || ref.closest('button, a, [role="button"], summary, .inspecting .detail')) return;
    const screen = SCREEN_OF.get(ref);
    if (screen) openNotes(screen, ref.dataset.note);
  });

  /* -------------------------------------------------------------------
     6. DRAWING THE PAGE AND THE GAME
     The player works a post for a series of rounds. Each round has a
     budget of time units, and every action costs some. The player calls
     cases one at a time, checks each case's records against each other,
     the case, the date and the rulebook, flags discrepancies in inspect
     mode, and stamps a verdict. Right verdicts earn pay; wrong ones earn
     citations. At the end of the round the ledger pays the expenses and
     looks after the dependants, and the endings are checked in order.
     ------------------------------------------------------------------- */
  let run = null;            // the game being played (in memory only, never saved)
  let screen = newScreen();  // footnotes on the screen being shown
  let soundOn = false;       // sound is off until the player turns it on
  let audio = null;
  const NARROW = window.matchMedia('(max-width: 640px)');   // a phone: records open full-width
  const MULTILINE = /\.(text|intro|body|description|howToPlay|explain|response|result|consequence)$/;

  // The words for the setting, ready to fill in: { case: '[Case]', round: '[Day]', ... }
  function labels() {
    const out = {};
    Object.keys(data.game.labels).forEach(k => { out[k] = stripNotes(data.game.labels[k]); });
    return out;
  }

  // A piece of text from the data at `path` (e.g. "page.title").
  // In edit mode it shows the raw text and can be edited in place;
  // otherwise its {words} are filled in and its footnotes become numbers.
  function txt(tag, path, cls, values) {
    const multiline = MULTILINE.test(path);
    const classes = [cls, multiline ? 'ml' : ''].filter(Boolean).join(' ');
    const node = el(tag, classes ? { class: classes } : {});
    const value = getPath(data, path);
    if (editing) {
      node.dataset.text = path;
      if (multiline) node.setAttribute('data-multiline', '');
      node.textContent = value == null ? '' : String(value);
    } else {
      node.append(withNotes(fill(value, Object.assign(labels(), values || {})), screen));
    }
    return node;
  }

  // Text copied into the game being played (a case's description and its
  // values). It isn't edited in place, but its footnotes still become numbers.
  function runText(text) {
    const filled = fill(text, labels());
    return editing ? document.createTextNode(filled) : withNotes(filled, screen);
  }

  // A game button. It is a <div role="button"> so its words can be edited in
  // place in edit mode; click the edge of the button (outside the outlined
  // words) to press it while editing.
  function gameButton(contents, onClick, cls) {
    const b = el('div', { class: cls, role: 'button', tabindex: '0' });
    b.append(...contents.filter(Boolean));
    b.addEventListener('click', e => {
      if (editing && e.target.closest('[data-text]')) return;
      onClick();
    });
    b.addEventListener('keydown', e => {
      if (e.target === b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); onClick(); }
    });
    return b;
  }

  function panel(titlePath, cls, values) {
    const p = el('div', { class: 'panel' + (cls ? ' ' + cls : '') });
    p.append(txt('div', titlePath, 'panel-title', values));
    return p;
  }

  // Money as text, e.g. "$12" or "−$5"; signedMoney adds a "+".
  function fmtMoney(v) {
    const n = Math.round(num(v));
    return (n < 0 ? '−' : '') + labels().currency + Math.abs(n).toLocaleString('en-US');
  }
  function signedMoney(v) { return (Math.round(num(v)) >= 0 ? '+' : '') + fmtMoney(v); }
  function dayText(n) { return fill(labels().dayFormat, { n: n }); }

  // ----- Rounds, and what is in force in each -----
  function round() { return data.game.rounds[run.round]; }
  function roundNo() { return run.round + 1; }
  function inForce(x, n) {
    const until = num(x.until);
    return n >= Math.max(1, num(x.from)) && (!until || n <= until);
  }
  function rulesInForce(n) { return data.game.rules.filter(r => inForce(r, n)); }
  // A discrepancy type that pairs with a rule only counts while its rule is in force.
  function checksInForce(n) {
    return data.game.checks.filter(c => inForce(c, n) && (!RULE_KINDS.includes(c.kind) || rulesInForce(n).some(r => r.id === c.rule)));
  }
  function recordsInUse(n) { return data.game.recordTypes.filter(t => inForce(t, n)); }

  // ----- Upgrades, time and pay -----
  function upgradeTotal(kind, action) {
    return data.game.upgrades.filter(u => run.upgrades.includes(u.id) && u.kind === kind && (kind !== 'cheaper' || u.action === action))
      .reduce((sum, u) => sum + num(u.amount), 0);
  }
  function cost(action) { return Math.max(0, num(data.game.time[action]) - upgradeTotal('cheaper', action)); }
  function timeBudget() {
    const own = num(round().time);
    return Math.max(1, (own > 0 ? own : num(data.game.time.perRound)) + upgradeTotal('time'));
  }
  function timeLeft() { return timeBudget() - run.r.used; }
  function warnings() { return Math.max(0, num(data.game.scoring.warnings) + upgradeTotal('warning')); }
  function payFor(v) { return num(v.pay) + upgradeTotal('pay'); }

  // ----- Discrepancies -----
  // Every discrepancy in a case. Each one lists the pairs of details that
  // show it; tapping either detail of any pair, then the other, flags it.
  // Details are named:
  //   f:<record number>:<field id>  a line on a record    a:<detail id>  a case detail
  //   r:<rule id>  a rule in the rulebook                  date  today's date
  //   case  the case itself (its heading)
  function findIssues(c, ri) {
    const g = data.game;
    const n = ri + 1;
    const day = num(g.rounds[ri].day);
    const recs = c.records.map((rec, i) => ({ rec: rec, i: i, type: byId(g.recordTypes, rec.type) })).filter(x => x.type);
    const issues = [];
    checksInForce(n).forEach(ch => {
      const pairs = [];
      if (ch.kind === 'fieldVsCase' || ch.kind === 'fieldVsField') {
        const found = [];
        recs.forEach(x => x.type.fields.forEach(f => {
          if (f.kind === 'attr' && f.attr === ch.attr) found.push({ key: 'f:' + x.i + ':' + f.id, value: x.rec.values[f.id] });
        }));
        if (ch.kind === 'fieldVsCase') found.forEach(l => { if (!same(l.value, c.attrs[ch.attr])) pairs.push([l.key, 'a:' + ch.attr]); });
        else found.forEach((l, i) => found.slice(i + 1).forEach(m => { if (!same(l.value, m.value)) pairs.push([l.key, m.key]); }));
      } else if (ch.kind === 'missingRecord') {
        if (byId(g.recordTypes, ch.record) && !recs.some(x => x.type.id === ch.record)) pairs.push(['r:' + ch.rule, 'case']);
      } else {
        recs.filter(x => x.type.id === ch.record && x.type.fields.some(f => f.id === ch.field)).forEach(x => {
          const v = x.rec.values[ch.field];
          const blank = String(v == null ? '' : v).trim() === '';
          let bad = false;
          if (ch.kind === 'expired') bad = !blank && num(v) < day;
          if (ch.kind === 'outOfRange') bad = !blank && (num(v) < num(ch.min) || num(v) > num(ch.max));
          if (ch.kind === 'badList') { const list = byId(g.lists, ch.list); bad = !!list && !list.valid.some(ok => same(ok, v)); }
          if (ch.kind === 'breaksRule') bad = ch.forbidden.some(no => same(no, v));
          if (bad) pairs.push(['f:' + x.i + ':' + ch.field, ch.kind === 'expired' ? 'date' : 'r:' + ch.rule]);
        });
      }
      if (pairs.length) issues.push({ check: ch.id, pairs: pairs });
    });
    return issues;
  }

  // The right verdict for a case: an event choice can set it, then a
  // hand-written case's own answer, then the first discrepancy's verdict,
  // then the verdict for a case with nothing wrong.
  function rightVerdict(c, cs, ri) {
    const g = data.game;
    const ok = id => !!(id && byId(g.verdicts, id));
    if (cs && ok(cs.override)) return cs.override;
    if (ok(c.correct)) return c.correct;
    const issues = findIssues(c, ri);
    if (issues.length) {
      const ch = byId(g.checks, issues[0].check);
      if (ch && ok(ch.verdict)) return ch.verdict;
      return ok(g.issueVerdict) ? g.issueVerdict : g.verdicts[g.verdicts.length - 1].id;
    }
    if (ok(g.rounds[ri].cleanVerdict)) return g.rounds[ri].cleanVerdict;
    return ok(g.cleanVerdict) ? g.cleanVerdict : g.verdicts[0].id;
  }

  // ----- Making a round's cases -----
  // Hand-written cases come first, then generated ones. Generated cases use
  // the round's seed, so they are the same every time the round is played.
  function buildCases(ri) {
    const g = data.game;
    const R = g.rounds[ri];
    const n = ri + 1;
    const day = num(R.day);
    const rnd = seededRandom((R.seed || '') + ':' + n);
    const pick = list => (list.length ? list[Math.floor(rnd() * list.length)] : '');
    const between = (a, b) => { const lo = Math.min(num(a), num(b)); const hi = Math.max(num(a), num(b)); return lo + Math.floor(rnd() * (hi - lo + 1)); };

    function fieldValue(f, c) {
      if (f.kind === 'attr') return c.attrs[f.attr] || '';
      if (f.kind === 'expiry') return String(day + between(f.min || 1, f.max || 1));
      if (f.kind === 'number') return String(between(f.min, f.max));
      if (f.kind === 'list') { const list = byId(g.lists, f.list); return list ? pick(list.valid) : ''; }
      return pick(f.options);
    }
    function record(t, c) {
      const values = {};
      t.fields.forEach(f => { values[f.id] = fieldValue(f, c); });
      return { type: t.id, values: values };
    }
    function cleanCase() {
      const c = { description: pick(lines(R.generate.descriptions)), attrs: {}, records: [], event: '', correct: '' };
      g.caseAttributes.forEach(a => { c.attrs[a.id] = pick(a.values); });
      recordsInUse(n).forEach(t => c.records.push(record(t, c)));
      return c;
    }
    // Put one mistake of a discrepancy type into a case.
    function addError(c, ch) {
      if (ch.kind === 'missingRecord') { c.records = c.records.filter(rec => rec.type !== ch.record); return; }
      if (ch.kind === 'fieldVsCase' || ch.kind === 'fieldVsField') {
        const spots = [];
        c.records.forEach(rec => {
          const t = byId(g.recordTypes, rec.type);
          if (t) t.fields.forEach(f => { if (f.kind === 'attr' && f.attr === ch.attr) spots.push([rec, f.id]); });
        });
        const spot = pick(spots);
        if (!spot) return;
        const a = byId(g.caseAttributes, ch.attr);
        const others = (a ? a.values : []).filter(v => !same(v, spot[0].values[spot[1]]));
        spot[0].values[spot[1]] = others.length ? pick(others) : spot[0].values[spot[1]] + '?';
        return;
      }
      const t = byId(g.recordTypes, ch.record);
      if (!t || !t.fields.some(f => f.id === ch.field)) return;
      let rec = c.records.find(x => x.type === ch.record);
      if (!rec) { rec = record(t, c); c.records.push(rec); }
      if (ch.kind === 'expired') rec.values[ch.field] = String(day - between(1, 5));
      if (ch.kind === 'outOfRange') rec.values[ch.field] = String(rnd() < 0.5 ? num(ch.min) - between(1, 3) : num(ch.max) + between(1, 5));
      if (ch.kind === 'badList') { const list = byId(g.lists, ch.list); if (list && list.invalid.length) rec.values[ch.field] = pick(list.invalid); }
      if (ch.kind === 'breaksRule' && ch.forbidden.length) rec.values[ch.field] = pick(ch.forbidden);
    }

    const cases = R.cases.map(hc => clone({ description: hc.description, attrs: hc.attrs, records: hc.records, event: hc.event || '', correct: hc.correct || '' }));
    const count = Math.max(0, Math.min(50, num(R.generate.count)));
    const kinds = checksInForce(n).filter(ch => !R.generate.errorTypes.length || R.generate.errorTypes.includes(ch.id));
    const order = [];
    for (let i = 0; i < count; i++) order.push(i);
    for (let i = count - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    const withErrors = new Set(order.slice(0, Math.max(0, num(R.generate.errorCases))));
    for (let k = 0; k < count; k++) {
      // Try a few times for a case with nothing wrong by accident.
      let c = cleanCase();
      for (let t = 0; t < 30 && findIssues(c, ri).length; t++) c = cleanCase();
      if (withErrors.has(k) && kinds.length) {
        for (let e = 0; e < Math.max(1, num(R.generate.errorsPerCase)); e++) addError(c, pick(kinds));
      }
      cases.push(c);
    }
    R.events.forEach(p => {
      const c = cases[num(p.at) - 1];
      if (c && !c.event && byId(g.events, p.event)) c.event = p.event;
    });
    return cases;
  }

  // ----- The game being played -----
  function newRun() {
    const g = data.game;
    const factions = {};
    g.factions.forEach(f => { factions[f.id] = num(f.start); });
    const flags = {};
    g.flags.forEach(f => { flags[f.id] = !!f.start; });
    return {
      phase: 'start', round: 0, money: num(g.startMoney), citations: 0, factions: factions, flags: flags,
      deps: {}, upgrades: [], roundsDone: 0, homeNews: [], r: null, ledger: null, ending: null, timeUp: false
    };
  }

  function depState(d) {
    if (!run.deps[d.id]) run.deps[d.id] = { lost: false, unmet: {} };
    return run.deps[d.id];
  }
  function aliveCount() { return data.game.dependants.filter(d => !depState(d).lost).length; }

  function curCase() { return run.r && run.r.cur != null ? run.r.cases[run.r.cur] || null : null; }

  function top() { window.scrollTo(0, 0); }

  function beginGame() { run = newRun(); run.phase = 'intro'; render(); top(); }
  function toStart() { run = newRun(); render(); top(); }

  function startRound() {
    run.phase = 'work';
    run.timeUp = false;
    run.r = {
      cases: buildCases(run.round), next: 0, cur: null, cs: null, used: 0, earned: 0, extra: 0, citations: 0,
      log: [], inspect: false, sel: null, msg: null, desk: {}, z: [], open: null, page: 0
    };
    render();
    top();
  }

  // Money, citations, faction standing and flags from a verdict or a choice.
  function applyEffects(x) {
    x = x || {};
    if (run.r) {
      run.r.extra += num(x.money);
      run.r.citations = Math.max(0, run.r.citations + num(x.citations));
    }
    data.game.factions.forEach(f => { run.factions[f.id] = num(run.factions[f.id]) + num(x.factions && x.factions[f.id]); });
    data.game.flags.forEach(f => {
      const v = x.flags && x.flags[f.id];
      if (v === 'on') run.flags[f.id] = true;
      if (v === 'off') run.flags[f.id] = false;
    });
  }

  function spend(n) { run.r.used += Math.max(0, num(n)); }
  // After every action that costs time: the round ends when the time runs out.
  function afterAction() { if (timeLeft() <= 0) endRound(true); else render(); }

  function callNext() {
    const r = run.r;
    if (r.cur != null || r.next >= r.cases.length) return;
    spend(cost('call'));
    r.cur = r.next++;
    r.cs = { flagged: [], asked: [], choice: null, override: '' };
    r.sel = null; r.msg = null; r.desk = {}; r.z = []; r.open = null;
    afterAction();
  }

  function chooseEvent(k) {
    const c = curCase();
    const ev = c && byId(data.game.events, c.event);
    const ch = ev && ev.choices[k];
    if (!ch || run.r.cs.choice != null) return;
    run.r.cs.choice = k;
    applyEffects(ch.effects);
    if (ch.correctVerdict && byId(data.game.verdicts, ch.correctVerdict)) run.r.cs.override = ch.correctVerdict;
    render();
  }

  function toggleInspect() {
    run.r.inspect = !run.r.inspect;
    run.r.sel = null;
    render();
  }

  // Inspect mode: the first tap picks a detail, the second tests the pair.
  function pickDetail(key) {
    const r = run.r;
    const c = curCase();
    if (!r.inspect || !c) return;
    if (!r.sel) { r.sel = key; r.msg = null; render(); return; }
    if (r.sel === key) { r.sel = null; render(); return; }
    const pair = [r.sel, key].sort().join('|');
    r.sel = null;
    spend(cost('inspect'));
    const hit = findIssues(c, run.round).find(is => is.pairs.some(p => p.slice().sort().join('|') === pair));
    if (hit && !r.cs.flagged.some(f => f.check === hit.check)) {
      r.cs.flagged.push({ check: hit.check, pair: pair.split('|') });
      r.msg = { key: 'flagFound', values: { name: stripNotes((byId(data.game.checks, hit.check) || {}).name) }, tone: 'good' };
      beep('flag');
    } else if (hit) {
      r.msg = { key: 'flagAlready', tone: '' };
    } else {
      r.msg = { key: 'flagNone', tone: 'bad' };
      beep('bad');
    }
    afterAction();
  }

  function followUp(checkId, fuId) {
    const r = run.r;
    const ch = byId(data.game.checks, checkId);
    const fu = ch && byId(ch.followUps, fuId);
    const key = checkId + ':' + fuId;
    if (!fu || r.cs.asked.includes(key)) return;
    spend(fu.cost);
    r.cs.asked.push(key);
    afterAction();
  }

  function decide(vid) {
    const r = run.r;
    const c = curCase();
    const v = byId(data.game.verdicts, vid);
    if (!c || !v) return;
    if (byId(data.game.events, c.event) && r.cs.choice == null) { r.msg = { key: 'eventAnswerFirst', tone: 'bad' }; render(); return; }
    spend(cost('verdict'));
    const right = rightVerdict(c, r.cs, run.round) === vid;
    const values = { n: r.cur + 1, verdict: stripNotes(v.name) };
    if (right) {
      const pay = payFor(v);
      r.earned += pay;
      r.log.push({ key: 'logCorrect', values: values, tone: 'good' });
      r.msg = { key: 'verdictRight', values: { pay: fmtMoney(pay) }, tone: 'good' };
      beep('stamp');
    } else {
      r.citations++;
      r.log.push({ key: 'logWrong', values: values, tone: 'bad' });
      r.msg = { key: 'verdictWrong', tone: 'bad' };
      beep('bad');
    }
    applyEffects(v.effects);
    r.cur = null; r.cs = null; r.sel = null; r.inspect = false; r.open = null;
    afterAction();
  }

  function endRound(timeUp) {
    const r = run.r;
    if (r.cur != null) r.log.push({ key: 'logUnfinished', values: { n: r.cur + 1 }, tone: 'bad' });
    r.cur = null; r.cs = null; r.inspect = false;
    run.timeUp = !!timeUp;
    run.phase = 'ledger';
    const chosen = {};
    data.game.expenses.forEach(x => { chosen[x.id] = true; });
    run.ledger = { chosen: chosen, buy: {} };
    render();
    top();
  }

  // ----- The ledger -----
  function ledgerSums() {
    const g = data.game;
    const r = run.r;
    const L = run.ledger;
    const free = warnings();
    const penalties = Math.max(0, r.citations - free) * num(g.scoring.penalty);
    const expenses = g.expenses.filter(x => x.mandatory || L.chosen[x.id]).reduce((sum, x) => sum + num(x.cost), 0);
    const upgrades = g.upgrades.filter(u => L.buy[u.id] && !run.upgrades.includes(u.id)).reduce((sum, u) => sum + num(u.cost), 0);
    return { free: free, penalties: penalties, total: run.money + r.earned + r.extra - penalties - expenses - upgrades };
  }

  function payAndGoHome() {
    const g = data.game;
    const L = run.ledger;
    run.money = ledgerSums().total;
    run.citations += run.r.citations;
    g.upgrades.forEach(u => { if (L.buy[u.id] && !run.upgrades.includes(u.id)) run.upgrades.push(u.id); });
    // Needs covered by the expenses that were paid.
    const covered = new Set();
    g.expenses.forEach(x => { if (x.mandatory || L.chosen[x.id]) x.covers.forEach(k => covered.add(k)); });
    run.homeNews = [];
    g.dependants.forEach((d, di) => {
      const st = depState(d);
      if (st.lost) return;
      d.needs.forEach((nd, ni) => {
        if (covered.has(d.id + '.' + nd.id)) { st.unmet[nd.id] = 0; return; }
        st.unmet[nd.id] = num(st.unmet[nd.id]) + 1;
        if (num(nd.limit) > 0 && st.unmet[nd.id] === num(nd.limit)) {
          run.homeNews.push({ path: 'game.dependants.' + di + '.needs.' + ni + '.consequence', values: { name: stripNotes(d.name) } });
          if (nd.lost) st.lost = true;
        }
      });
    });
    run.roundsDone++;
    const ending = pickEnding(run.round >= g.rounds.length - 1);
    if (ending) { run.phase = 'end'; run.ending = ending.id; }
    else { run.round++; run.phase = 'intro'; }
    render();
    top();
  }

  // ----- Endings -----
  function varValue(what) {
    if (what === 'rounds') return run.roundsDone;
    if (what === 'money') return run.money;
    if (what === 'dependants') return aliveCount();
    if (what === 'citations') return run.citations;
    if (what.startsWith('faction:')) return num(run.factions[what.slice(8)]);
    if (what.startsWith('flag:')) return run.flags[what.slice(5)] ? 1 : 0;
    return 0;
  }
  function conditionTrue(c) {
    const v = varValue(c.what);
    const x = num(c.value);
    return c.op === 'ge' ? v >= x : c.op === 'le' ? v <= x : c.op === 'gt' ? v > x : c.op === 'lt' ? v < x : v === x;
  }
  // Endings are checked in order and the first match wins. After the last
  // round, if nothing matches, the last "final" ending is used.
  function pickEnding(last) {
    const all = data.game.endings;
    const hit = all.find(e => (e.when !== 'final' || last) && e.conditions.every(conditionTrue));
    if (hit || !last) return hit || null;
    const finals = all.filter(e => e.when === 'final');
    return finals[finals.length - 1] || all[all.length - 1] || null;
  }

  // ----- Sound (made by the browser, off until the player turns it on) -----
  function beep(kind) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator();
      const gain = audio.createGain();
      const now = audio.currentTime;
      o.type = kind === 'stamp' ? 'square' : 'sine';
      o.frequency.value = { stamp: 160, flag: 880, bad: 150, on: 520 }[kind] || 440;
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      o.connect(gain).connect(audio.destination);
      o.start(now);
      o.stop(now + 0.23);
    } catch (e) { /* no sound in this browser */ }
  }
  function toggleSound() { soundOn = !soundOn; beep('on'); render(); }

  // ----- The start screen -----
  function startView() {
    const view = el('div', { class: 'screen start' });
    const sheet = el('div', { class: 'sheet' });
    const head = el('div', { class: 'masthead' });
    head.append(txt('div', 'page.mastheadTop', 'masthead-top'), txt('h1', 'page.title'), txt('div', 'page.subtitle', 'masthead-sub'));
    const how = el('div', { class: 'how-to-play' });
    how.append(txt('h3', 'page.howToPlayHeading'));
    if (editing) {
      how.append(txt('div', 'page.howToPlay', 'htp-edit'));
    } else {
      const list = el('ul');
      lines(data.page.howToPlay).forEach(line => {
        const li = el('li');
        li.append(withNotes(fill(line, labels()), screen));
        list.append(li);
      });
      how.append(list);
    }
    sheet.append(head, txt('p', 'page.intro', 'intro-text'), how, gameButton([txt('span', 'ui.begin')], beginGame, 'btn-primary full'));
    view.append(sheet);
    return view;
  }

  // The date of the round being played, e.g. "[Date] · [day] 4".
  function dateNode(cls) {
    const R = round();
    return txt('span', 'ui.dateChip', cls, { date: stripNotes(fill(R.dateText, labels())), day: dayText(num(R.day)) });
  }

  // ----- A round's first screen: date, intro, news from home, rule changes -----
  function introView() {
    const g = data.game;
    const n = roundNo();
    const rp = 'game.rounds.' + run.round;
    const view = el('div', { class: 'screen intro' });
    const sheet = el('div', { class: 'sheet' });
    sheet.append(txt('h2', 'ui.roundOf', null, { n: n, total: g.rounds.length }), dateNode('date-line'), txt('p', rp + '.intro', 'intro-text'));

    function list(headingPath, items) {
      if (!items.length) return;
      const ul = el('ul', { class: 'plain' });
      items.forEach(([path, values]) => ul.append(txt('li', path, null, values)));
      sheet.append(txt('h3', headingPath), ul);
    }
    list('ui.homeNews', run.homeNews.map(h => [h.path, h.values]));
    list('ui.newRules', g.rules.map((r, k) => [r, k]).filter(([r]) => inForce(r, n) && Math.max(1, num(r.from)) === n).map(([, k]) => ['game.rules.' + k + '.text']));
    list('ui.endedRules', g.rules.map((r, k) => [r, k]).filter(([r]) => n > 1 && num(r.until) === n - 1).map(([, k]) => ['game.rules.' + k + '.text']));
    list('ui.newRecords', g.recordTypes.map((t, k) => [t, k]).filter(([t]) => inForce(t, n) && Math.max(1, num(t.from)) === n).map(([, k]) => ['game.recordTypes.' + k + '.name']));
    sheet.append(gameButton([txt('span', 'ui.startRound')], startRound, 'btn-primary full'));
    view.append(sheet);
    return view;
  }

  // ----- The post -----
  // A detail the player can tap in inspect mode (see findIssues for the names).
  function detail(tag, key, cls) {
    const r = run.r;
    const node = el(tag, { class: 'detail' + (cls ? ' ' + cls : ''), 'data-detail': key });
    if (r.sel === key) node.classList.add('selected');
    if (r.cs && r.cs.flagged.some(f => f.pair.includes(key))) node.classList.add('flagged');
    if (r.inspect) { node.setAttribute('role', 'button'); node.setAttribute('tabindex', '0'); }
    node.addEventListener('click', e => {
      if (!r.inspect || (editing && e.target.closest('[data-text]'))) return;
      e.stopPropagation();
      pickDetail(key);
    });
    node.addEventListener('keydown', e => {
      if (r.inspect && e.target === node && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pickDetail(key); }
    });
    return node;
  }

  function statusBar() {
    const r = run.r;
    const total = timeBudget();
    const left = Math.max(0, total - r.used);
    const bar = el('div', { class: 'status-bar' });
    const date = detail('span', 'date', 'chip');
    date.append(dateNode());
    const time = el('div', { class: 'chip time-wrap' });
    const track = el('div', { class: 'time-bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(total), 'aria-valuenow': String(left) });
    const fillBar = el('div', { class: left <= total / 4 ? 'low' : '' });
    fillBar.style.width = (100 * left / total) + '%';
    track.append(fillBar);
    time.append(txt('div', 'ui.timeLeft', null, { left: left, total: total }), track);
    bar.append(txt('span', 'ui.roundTitle', 'chip title', { n: roundNo() }), date, time,
      txt('span', 'ui.moneyChip', 'chip', { amount: fmtMoney(run.money) }),
      txt('span', 'ui.earnedChip', 'chip', { amount: fmtMoney(r.earned) }),
      txt('span', 'ui.citationsChip', 'chip', { n: r.citations, free: warnings() }),
      txt('span', 'ui.queueChip', 'chip', { n: r.cases.length - r.next }),
      gameButton([txt('span', soundOn ? 'ui.soundOn' : 'ui.soundOff')], toggleSound, 'btn-secondary sound-btn'));
    return bar;
  }

  function message() {
    const m = run.r.msg;
    return m ? txt('div', 'ui.' + m.key, 'message ' + (m.tone || ''), m.values) : null;
  }

  function casePanel(c) {
    const r = run.r;
    const p = panel('ui.casePanel', 'o-case');
    if (!c) {
      const m = message();
      if (m) p.append(m);
      if (r.next < r.cases.length) {
        p.append(txt('p', 'ui.noCase', 'muted'),
          gameButton([txt('span', 'ui.callNext'), ' ', txt('span', 'ui.costTag', null, { cost: cost('call') })], callNext, 'btn-primary full'));
      } else {
        p.append(txt('p', 'ui.queueEmpty', 'muted'), gameButton([txt('span', 'ui.closePost')], () => endRound(false), 'btn-primary full'));
      }
      return p;
    }
    const head = detail('div', 'case', 'case-head');
    head.append(txt('span', 'ui.caseHeading', null, { n: r.cur + 1, total: r.cases.length }));
    const desc = el('p', { class: 'case-desc ml' });
    desc.append(runText(c.description));
    p.append(head, desc);
    data.game.caseAttributes.forEach((a, i) => {
      const row = detail('div', 'a:' + a.id, 'attr-row');
      const value = el('span', { class: 'attr-value' });
      value.append(runText(c.attrs[a.id] || '—'));
      row.append(icon(a.icon) || '', txt('span', 'game.caseAttributes.' + i + '.label', 'attr-label'), value);
      p.append(row);
    });
    return p;
  }

  function eventPanel(c) {
    const g = data.game;
    const ei = g.events.findIndex(e => e.id === c.event);
    const ev = g.events[ei];
    const ep = 'game.events.' + ei;
    const p = el('div', { class: 'panel event-panel o-event' });
    p.append(txt('span', ep + '.kind', 'event-kind'), txt('div', ep + '.text', 'event-text'));
    const k = run.r.cs.choice;
    if (k == null || !ev.choices[k]) {
      ev.choices.forEach((ch, j) => p.append(gameButton([txt('span', ep + '.choices.' + j + '.label')], () => chooseEvent(j), 'choice-btn')));
    } else {
      p.append(txt('div', ep + '.choices.' + k + '.result', 'event-result'));
    }
    return p;
  }

  function toolsPanel() {
    const g = data.game;
    const r = run.r;
    const p = panel('ui.toolsPanel', 'o-tools');
    p.append(gameButton([txt('span', r.inspect ? 'ui.inspectStop' : 'ui.inspectStart')], toggleInspect, 'btn-secondary' + (r.inspect ? ' on' : '')));
    if (r.inspect) p.append(txt('p', r.sel ? 'ui.selectedOne' : 'ui.inspectHint', 'muted', { cost: cost('inspect') }));
    const m = message();
    if (m) p.append(m);
    if (!r.cs.flagged.length) p.append(txt('p', 'ui.flagsEmpty', 'muted'));
    r.cs.flagged.forEach(f => {
      const ci = g.checks.findIndex(x => x.id === f.check);
      if (ci < 0) return;
      const ch = g.checks[ci];
      const cp = 'game.checks.' + ci;
      const item = el('div', { class: 'flag-item' });
      item.append(txt('div', cp + '.name', 'flag-name'), txt('div', cp + '.explain', 'flag-explain'));
      const row = el('div', { class: 'btn-row' });
      ch.followUps.forEach((fu, j) => {
        if (r.cs.asked.includes(ch.id + ':' + fu.id)) item.append(txt('div', cp + '.followUps.' + j + '.response', 'followup-response'));
        else row.append(gameButton([txt('span', cp + '.followUps.' + j + '.name'), ' ', txt('span', 'ui.costTag', null, { cost: num(fu.cost) })], () => followUp(ch.id, fu.id), 'btn-secondary'));
      });
      if (row.children.length) item.append(txt('div', 'ui.followUpsLabel', 'muted'), row);

    return p;
  }

  function verdictPanel(c) {

  function logPanel() {

  // One record as a card: its type's name, then one tappable line per field.
  function recordCard(c, i) {
    const g = data.game;
    const rec = c.records[i];
    const ti = g.recordTypes.findIndex(t => t.id === rec.type);
    if (ti < 0) return null;
    const t = g.recordTypes[ti];
    const tp = 'game.recordTypes.' + ti;
    const card = el('div', { class: 'rec-card' });
    const head = el('div', { class: 'rec-head' });
    head.append(icon(t.icon) || '', txt('span', tp + '.name'));
    card.append(head);
    t.fields.forEach((f, j) => {
      const raw = rec.values[f.id];
      const blank = raw == null || String(raw).trim() === '';
      const value = el('span', { class: 'rec-value' });
      value.append(blank ? '—' : f.kind === 'expiry' ? dayText(raw) : runText(String(raw)));
      const row = detail('div', 'f:' + i + ':' + f.id, 'rec-row');
      row.append(txt('span', tp + '.fields.' + j + '.label', 'rec-label'), value);
      card.append(row);
    });
    return { card: card, head: head };
  }

  // On a computer the records are cards the player drags around the desk
  // (pointer events, no library). On a phone they are tiles that open full-width.
  function deskPanel(c) {
    const g = data.game;
    const r = run.r;
    const p = panel('ui.deskPanel', 'o-desk');
    if (!c || !c.records.length) { p.append(txt('p', 'ui.deskEmpty', 'muted')); return p; }
    if (NARROW.matches) {
      const tiles = el('div', { class: 'tiles' });
      c.records.forEach((rec, i) => {
        const ti = g.recordTypes.findIndex(t => t.id === rec.type);
        if (ti < 0) return;
        const tile = gameButton([icon(g.recordTypes[ti].icon), txt('span', 'game.recordTypes.' + ti + '.name')], () => { r.open = i; render(); }, 'rec-tile');
        if ((r.sel || '').startsWith('f:' + i + ':')) tile.classList.add('detail', 'selected');
        tiles.append(tile);
      });
      p.append(txt('p', 'ui.deskTapHint', 'muted'), tiles);
      const made = r.open != null && c.records[r.open] ? recordCard(c, r.open) : null;
      if (made) {
        const close = () => { r.open = null; render(); };
        const back = el('div', { class: 'rec-sheet-back' });
        back.addEventListener('click', close);
        const sheet = el('div', { class: 'rec-sheet', role: 'dialog', 'aria-modal': 'true' });
        sheet.append(made.card, gameButton([txt('span', 'ui.closeCard')], close, 'btn-primary full'));
        p.append(back, sheet);
      }
      return p;
    }
    const desk = el('div', { class: 'desk' });
    c.records.forEach((rec, i) => {
      const made = recordCard(c, i);
      if (!made) return;
      const pos = r.desk[i] || { x: 10 + i * 36, y: 10 + i * 48 };
      made.card.style.left = pos.x + 'px';
      made.card.style.top = pos.y + 'px';
      made.card.dataset.index = String(i);
      dragWith(made.card, made.head, i, desk);
      made.card.addEventListener('pointerdown', () => toFront(desk, i));
      desk.append(made.card);
    });
    stackCards(desk);
    p.append(desk);
    return p;
  }

  // The last card touched is on top.
  function toFront(desk, i) {
    run.r.z = run.r.z.filter(x => x !== i).concat(i);
    stackCards(desk);
  }
  function stackCards(desk) {
    desk.querySelectorAll('.rec-card').forEach(card => { card.style.zIndex = String(2 + run.r.z.indexOf(Number(card.dataset.index))); });
  }

  // Drag a card by its heading, keeping it on the desk.
  function dragWith(card, head, i, desk) {
    head.addEventListener('pointerdown', e => {
      if (e.button !== 0 || (editing && e.target.closest('[data-text]'))) return;
      e.preventDefault();
      try { head.setPointerCapture(e.pointerId); } catch (err) { /* not a live pointer */ }
      const sx = e.clientX;
      const sy = e.clientY;
      const ox = card.offsetLeft;
      const oy = card.offsetTop;
      const move = ev => {
        const x = Math.max(0, Math.min(desk.clientWidth - card.offsetWidth, ox + ev.clientX - sx));
        const y = Math.max(0, Math.min(desk.clientHeight - 40, oy + ev.clientY - sy));
        card.style.left = x + 'px';
        card.style.top = y + 'px';
        run.r.desk[i] = { x: x, y: y };
      };
      const up = () => {
        head.removeEventListener('pointermove', move);
        head.removeEventListener('pointerup', up);
        head.removeEventListener('pointercancel', up);
      };
      head.addEventListener('pointermove', move);
      head.addEventListener('pointerup', up);
      head.addEventListener('pointercancel', up);
    });
  }

  // Keep every card on the desk if the desk is narrower than where it was put.
  function fitCards(desk) {
    desk.querySelectorAll('.rec-card').forEach(card => {
      const x = Math.max(0, Math.min(card.offsetLeft, desk.clientWidth - card.offsetWidth));
      const y = Math.max(0, Math.min(card.offsetTop, desk.clientHeight - 40));
      card.style.left = x + 'px';
      card.style.top = y + 'px';
    });
  }

  function rulebookPanel() {

    const r = run.r;

    const p = panel('ui.rulebookPanel', 'o-book');
    const pages = g.rulePages.map((pg, i) => ({ i: i, rules: g.rules.map((rule, k) => ({ rule: rule, k: k })).filter(x => x.rule.page === pg.id && inForce(x.rule, n)) }))
      .filter(x => x.rules.length);
    if (!pages.length) { p.append(txt('p', 'ui.rulebookEmpty', 'muted')); return p; }
    const cur = Math.min(r.page, pages.length - 1);
    const tabs = el('div', { class: 'tabs', role: 'tablist' });
    pages.forEach((x, j) => tabs.append(gameButton([txt('span', 'game.rulePages.' + x.i + '.title')], () => { r.page = j; render(); }, 'tab' + (j === cur ? ' on' : ''))));
    const list = el('ul', { class: 'rules' });
    pages[cur].rules.forEach(x => {
      const li = detail('li', 'r:' + x.rule.id, 'rule');
      li.append(txt('span', 'game.rules.' + x.k + '.text'));
      if (Math.max(1, num(x.rule.from)) === n && n > 1) li.append(txt('span', 'ui.newBadge', 'badge'));
      list.append(li);

  function workView() {
    const r = run.r;
    const c = curCase();
    const view = el('div', { class: 'screen work' + (r.inspect ? ' inspecting' : '') });
    const post = el('div', { class: 'post' });

  // ----- The ledger at the end of a round -----
  function ledgerView() {
    const g = data.game;
    const r = run.r;
    const L = run.ledger;
    const s = ledgerSums();
    const view = el('div', { class: 'screen ledger' });
    const sheet = el('div', { class: 'sheet' });
    sheet.append(txt('h2', 'ui.ledgerTitle', null, { n: roundNo() }));
    if (run.timeUp) sheet.append(txt('p', 'ui.timeUp', 'muted'));

    function row(label, amount, cls) {
      const d = el('div', { class: 'ledger-row' + (cls ? ' ' + cls : '') });
      d.append(label);
      if (amount != null) d.append(el('span', { class: 'amount ' + (amount.cls || '') }, amount.text));
      return d;
    }
    const plus = v => ({ text: signedMoney(v), cls: v > 0 ? 'money-up' : v < 0 ? 'money-down' : '' });
    const minus = v => plus(-num(v));
    // A tick box (a real <label> outside edit mode, so its words toggle it).
    function tick(checked, disabled, onChange, ...words) {
      const wrap = el(editing ? 'div' : 'label');
      const box = el('input', { type: 'checkbox' });
      box.checked = checked;
      box.disabled = disabled;
      box.addEventListener('change', () => onChange(box.checked));

      label.append(...words);
      wrap.append(box, label);

    }

    sheet.append(row(txt('span', 'ui.ledgerBrought'), { text: fmtMoney(run.money) }),
      row(txt('span', 'ui.ledgerPay'), plus(r.earned)),
      row(txt('span', 'ui.ledgerOther'), plus(r.extra)),
      row(txt('span', 'ui.ledgerCitations', null, { n: r.citations, free: s.free })),
      row(txt('span', 'ui.ledgerPenalties'), minus(s.penalties)));

    if (g.expenses.length) {
      sheet.append(txt('h3', 'ui.ledgerExpenses'));

        sheet.append(row(tick(x.mandatory || !!L.chosen[x.id], !!x.mandatory, v => { L.chosen[x.id] = v; render(); }, ...words),
          x.mandatory || L.chosen[x.id] ? minus(x.cost) : { text: fmtMoney(0) }));
      });

    if (g.upgrades.length) {
      sheet.append(txt('h3', 'ui.ledgerUpgrades'));
      g.upgrades.forEach((u, i) => {
        const up = 'game.upgrades.' + i;

        words[0].append(txt('span', up + '.name'));
        if (run.upgrades.includes(u.id)) {
          const owned = el('div');
          owned.append(...words, ' (', txt('span', 'ui.ledgerOwned'), ')');
          sheet.append(row(owned));
        } else {
          sheet.append(row(tick(!!L.buy[u.id], false, v => { L.buy[u.id] = v; render(); }, ...words), L.buy[u.id] ? minus(u.cost) : { text: fmtMoney(u.cost) }));
        }
      });
