<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Great Depression</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* =====================================================================
   STYLES
   A newspaper-style strategy game. To restyle the page, change the
   colours and fonts in :root below.
   ===================================================================== */
:root {
  --ink:        #1a1208;    /* dark text, dark backgrounds, borders */
  --paper:      #f5edd8;    /* panels */
  --paper-dark: #e8dcc0;    /* darker panels, empty bars */
  --paper-mid:  #ede0c4;    /* decision buttons */
  --rust:       #8b2c1a;    /* datelines, button hover */
  --gold:       #9a7c2e;    /* ornaments */
  --steel:      #4a5568;    /* quieter text */
  --green:      #276221;    /* good */
  --red:        #8b1c1c;    /* bad */
  --amber:      #92610f;    /* in between */
  --highlight:  #fbe6b4;    /* the highlighted footnote */
  --font-head:  'Playfair Display', Georgia, serif;
  --font-body:  'EB Garamond', Georgia, serif;
  --font-ui:    system-ui, -apple-system, "Segoe UI", sans-serif;

  /* Editor colours (only seen in edit mode) */
  --edit-outline: #2a6edc;
  --edit-bar: #1d2330;
  --edit-bar-text: #eef1f6;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  overflow-wrap: break-word;
}
img { max-width: 100%; }
.ml { white-space: pre-line; }

/* ----- Screens (start, game, ending) ----- */
.screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem 4rem;
}
.screen.start, .screen.game {
  background:
    repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(26,18,8,0.04) 28px, rgba(26,18,8,0.04) 29px),
    linear-gradient(160deg, #f7eeda 0%, #ede0c4 60%, #e2d4aa 100%);
}
.screen.ending { justify-content: center; background: var(--ink); padding: 3rem 1rem; }

/* ----- Masthead ----- */
.masthead {
  text-align: center;
  border-top: 4px double var(--ink);
  border-bottom: 4px double var(--ink);
  padding: 0.8rem 2rem;
  margin-bottom: 0.5rem;
  width: 100%;
  max-width: 900px;
  position: relative;
}
.masthead::before, .masthead::after {
  content: '✦'; position: absolute; top: 50%; transform: translateY(-50%);
  font-size: 1.2rem; color: var(--gold);
}
.masthead::before { left: 0.8rem; }
.masthead::after  { right: 0.8rem; }
.masthead-top { font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--steel); margin-bottom: 0.2rem; }
.masthead h1 { margin: 0; font-family: var(--font-head); font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 900; line-height: 1.05; letter-spacing: -0.01em; }
.masthead-sub { font-family: var(--font-head); font-style: italic; font-size: 1rem; color: var(--steel); margin-top: 0.15rem; }
.masthead-rule { height: 1px; background: var(--ink); margin: 0.5rem 0; }

/* ----- Start screen ----- */
.start-body { width: 100%; max-width: 860px; }
.start-intro { text-align: center; max-width: 640px; margin: 1.5rem auto 2rem; font-size: 1.05rem; line-height: 1.7; }
.industry-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
.industry-card {
  background: var(--paper); border: 2px solid var(--ink);
  padding: 1.6rem 1.4rem 1.8rem; position: relative;
  transition: transform 0.15s, box-shadow 0.15s;
}
.industry-card:hover { transform: translateY(-3px); box-shadow: 4px 6px 0 var(--ink); }
body.is-editing .industry-card:hover { transform: none; box-shadow: none; }
.industry-card .card-icon { font-size: 2.2rem; margin-bottom: 0.5rem; display: block; }
.industry-card h2 { font-family: var(--font-head); font-size: 1.5rem; font-weight: 700; margin: 0 0 0.3rem; border-bottom: 1px solid var(--ink); padding-bottom: 0.3rem; }
.industry-card .card-era { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--steel); margin-bottom: 0.7rem; display: block; }
.industry-card p { margin: 0; font-size: 0.97rem; line-height: 1.6; color: #2a1e0a; }
.card-btn {
  display: inline-block; margin-top: 1.2rem; cursor: pointer;
  background: var(--ink); color: var(--paper);
  font-family: var(--font-head); font-size: 0.88rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 0.55rem 1.2rem; transition: background 0.15s;
}
.card-btn:hover, .card-btn:focus-visible { background: var(--rust); outline: none; }

.how-to-play { background: var(--paper-dark); border: 1px solid var(--ink); padding: 1.2rem 1.6rem; margin-bottom: 2rem; width: 100%; }
.how-to-play h3 { font-family: var(--font-head); font-weight: 700; margin: 0 0 0.6rem; text-align: center; letter-spacing: 0.05em; text-transform: uppercase; font-size: 0.88rem; }
.how-to-play ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem 1.5rem; font-size: 0.9rem; line-height: 1.5; }
@media (max-width: 560px) { .how-to-play ul { grid-template-columns: 1fr; } }
.how-to-play li::before { content: '— '; color: var(--gold); }
.htp-edit { font-size: 0.9rem; line-height: 1.5; }

/* ----- Game screen ----- */
.game-header { text-align: center; width: 100%; max-width: 1000px; margin-bottom: 1rem; }
.game-header h1 { margin: 0; font-family: var(--font-head); font-size: clamp(1.5rem, 4vw, 2.4rem); font-weight: 900; line-height: 1.1; }
.game-header .subtitle { font-style: italic; font-size: 0.95rem; color: var(--steel); }
.industry-label {
  display: inline-block; background: var(--ink); color: var(--paper);
  font-family: var(--font-head); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
  padding: 0.25rem 0.9rem; margin-bottom: 0.4rem;
}
.game-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 1.2rem; width: 100%; max-width: 1000px; align-items: start; }
@media (max-width: 720px) { .game-layout { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--paper); border: 1.5px solid var(--ink); padding: 1rem 1.1rem; margin-bottom: 1rem; }
.panel-title {
  font-family: var(--font-head); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
  border-bottom: 1px solid var(--ink); padding-bottom: 0.35rem; margin-bottom: 0.8rem;
}

/* Stats */
.stat-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; font-size: 0.88rem; }
.stat-label { font-style: italic; color: #3a2c10; flex: 1; min-width: 0; }
.stat-bar-wrap { flex: 0 0 90px; height: 10px; background: var(--paper-dark); border: 1px solid rgba(26,18,8,0.25); margin: 0 0.5rem; }
.stat-bar { height: 100%; transition: width 0.4s ease; }
.stat-val { font-family: var(--font-head); font-weight: 700; font-size: 0.82rem; min-width: 28px; text-align: right; }
.bar-good { background: var(--green); }
.bar-mid  { background: var(--amber); }
.bar-bad  { background: var(--red); }

/* Money */
.cash-display { font-family: var(--font-head); font-size: 1.4rem; font-weight: 700; text-align: center; padding: 0.5rem 0 0.2rem; border-bottom: 1px dashed rgba(26,18,8,0.3); margin-bottom: 0.7rem; }
.cash-label { font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; color: var(--steel); margin-bottom: 0.8rem; display: block; }
.cash-delta { font-size: 0.82rem; font-style: italic; text-align: center; color: var(--steel); margin-bottom: 0.8rem; }

/* Timeline */
.timeline-display { text-align: center; padding: 0.4rem 0; }
.year-display { font-family: var(--font-head); font-size: 2rem; font-weight: 900; line-height: 1; }
.turn-display { font-size: 0.78rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--steel); margin-top: 0.1rem; }
.turn-pips { display: flex; gap: 4px; justify-content: center; margin-top: 0.5rem; flex-wrap: wrap; }
.pip { width: 10px; height: 10px; border: 1.5px solid var(--ink); background: var(--paper-dark); border-radius: 50%; }
.pip.done { background: var(--ink); }

/* Events */
.news-dateline { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--rust); margin-bottom: 0.3rem; font-style: italic; }
.news-headline { font-family: var(--font-head); font-size: 1.2rem; font-weight: 700; line-height: 1.25; margin-bottom: 0.6rem; }
.news-body { font-size: 0.93rem; line-height: 1.65; color: #2a1e08; margin-bottom: 0.9rem; }
.event-tag { display: inline-block; background: var(--rust); color: var(--paper); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; padding: 0.15rem 0.5rem; margin-bottom: 0.6rem; }
.event-tag.good   { background: var(--green); }
.event-tag.warn   { background: var(--amber); }
.event-tag.crisis { background: var(--red); }
.event-image-wrap { margin: 0.6rem 0 0.85rem; border: 1.5px solid var(--ink); background: var(--paper-dark); }
.event-image-wrap img { display: block; width: 100%; max-height: 220px; object-fit: cover; object-position: center top; filter: sepia(0.35) contrast(1.05); }
.event-image-caption { font-style: italic; font-size: 0.75rem; line-height: 1.4; color: var(--steel); border-top: 1px solid rgba(26,18,8,0.2); padding: 0.3rem 0.5rem; }
.effects-line { font-size: 0.8rem; font-style: italic; color: var(--steel); }

/* Decisions */
.decisions-prompt { font-family: var(--font-head); font-style: italic; font-size: 0.95rem; margin-bottom: 0.8rem; border-bottom: 1px solid rgba(26,18,8,0.2); padding-bottom: 0.5rem; }
.decision-btn {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: var(--paper-mid); border: 1.5px solid var(--ink);
  padding: 0.75rem 1rem; margin-bottom: 0.6rem;
  font-size: 0.93rem; line-height: 1.5; color: var(--ink);
  transition: background 0.12s, box-shadow 0.12s;
}
.decision-btn:hover, .decision-btn:focus-visible { background: var(--paper-dark); box-shadow: 3px 3px 0 var(--ink); outline: none; }
.decision-btn.selected { background: var(--ink); color: var(--paper); box-shadow: none; }
.decision-btn strong { display: block; font-weight: 700; margin-bottom: 0.15rem; }
.decision-btn .decision-desc { display: block; }
.decision-btn .effect-hint { font-size: 0.8rem; font-style: italic; color: var(--steel); margin-top: 0.2rem; }
.decision-btn.selected .effect-hint { color: #c4b896; }

.action-bar { display: flex; gap: 0.8rem; margin-top: 1rem; flex-wrap: wrap; }
.btn-primary {
  flex: 1; min-width: 140px; text-align: center; cursor: pointer;
  background: var(--ink); color: var(--paper);
  font-family: var(--font-head); font-size: 1rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 0.75rem 1rem; transition: background 0.15s;
}
.btn-primary:hover, .btn-primary:focus-visible { background: var(--rust); outline: none; }
.btn-primary.is-disabled { opacity: 0.4; cursor: default; }
.btn-primary.is-disabled:hover { background: var(--ink); }
.btn-primary.full { display: block; width: 100%; }
.btn-secondary {
  cursor: pointer; border: 1.5px solid var(--ink); color: var(--ink);
  font-family: var(--font-head); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 0.6rem 1rem; transition: background 0.15s, color 0.15s;
}
.btn-secondary:hover, .btn-secondary:focus-visible { background: var(--ink); color: var(--paper); outline: none; }

/* Log */
.log-container { max-height: 240px; overflow-y: auto; }
.log-entry { font-size: 0.85rem; line-height: 1.55; padding: 0.5rem 0; border-bottom: 1px dashed rgba(26,18,8,0.2); color: #2a1e08; }
.log-entry:last-child { border-bottom: none; }
.log-year { font-family: var(--font-head); font-weight: 700; font-size: 0.78rem; color: var(--rust); margin-right: 0.4rem; }
.log-empty { font-style: italic; font-size: 0.88rem; color: var(--steel); }
.log-container::-webkit-scrollbar { width: 5px; }
.log-container::-webkit-scrollbar-track { background: var(--paper-mid); }
.log-container::-webkit-scrollbar-thumb { background: var(--ink); }
.money-up { color: var(--green); }
.money-down { color: var(--red); }

/* Historical notes */
.notes-details { background: var(--paper); border: 1.5px solid var(--ink); margin-bottom: 0.5rem; }
.notes-details summary {
  font-family: var(--font-head); font-size: 0.88rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 0.7rem 1rem; cursor: pointer; user-select: none; list-style: none;
  display: flex; justify-content: space-between; align-items: center;
}
.notes-details summary::-webkit-details-marker { display: none; }
.notes-details summary::after { content: '▸'; transition: transform 0.2s; font-size: 0.85rem; color: var(--steel); }
.notes-details[open] summary::after { transform: rotate(90deg); }
.note-item { border-top: 1px solid rgba(26,18,8,0.15); padding: 0.7rem 1rem; font-size: 0.88rem; line-height: 1.65; }
.note-item strong { font-family: var(--font-head); display: block; margin-bottom: 0.2rem; font-size: 0.9rem; }
.note-item .note-body { display: block; }

/* ----- Ending screen ----- */
.ending-card { background: var(--paper); border: 3px double var(--paper-dark); max-width: 600px; width: 100%; padding: 2.5rem 2rem; text-align: center; }
.ending-stamp { font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--steel); margin-bottom: 0.5rem; }
.ending-title { font-family: var(--font-head); font-size: 2.2rem; font-weight: 900; line-height: 1.1; margin-bottom: 0.8rem; }
.ending-verdict { display: inline-block; padding: 0.3rem 1rem; font-family: var(--font-head); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 1.2rem; }
.ending-verdict.win   { background: var(--green); color: var(--paper); }
.ending-verdict.mixed { background: var(--amber); color: var(--ink); }
.ending-verdict.lose  { background: var(--red); color: var(--paper); }
.ending-body { font-size: 1rem; line-height: 1.7; margin-bottom: 1.5rem; text-align: left; }
.ending-stats-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1rem; text-align: left; font-size: 0.88rem;
  border-top: 1px solid rgba(26,18,8,0.3); border-bottom: 1px solid rgba(26,18,8,0.3);
  padding: 0.8rem 0; margin-bottom: 1.4rem;
}
.ending-stats-grid span { color: var(--steel); font-style: italic; }

/* ----- Footer ----- */
.site-footer {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  max-width: 1000px; margin: 0 auto; padding: 16px 16px 40px;
  color: #b9ad90; font: 14px/1.4 var(--font-ui);
}
.site-footer p { margin: 0; }
.author { flex: 1 1 auto; }
.local-note { flex-basis: 100%; color: #e0b860; }
.edit-link { color: #b9ad90; opacity: .4; text-decoration: none; }
.edit-link:hover, .edit-link:focus-visible { opacity: 1; text-decoration: underline; }

/* ----- Footnotes ----- */
.fn-ref { font: 700 .65em/0 var(--font-ui); color: var(--rust); padding: 0 1px; cursor: pointer; }
.fn-ref:hover { text-decoration: underline; }
[role="button"] .fn-ref, a .fn-ref, .industry-label .fn-ref, .event-tag .fn-ref, .ending-verdict .fn-ref { color: inherit; }
.notes-fab {
  position: fixed; top: 12px; right: 12px; z-index: 50;
  font: 600 13px/1 var(--font-ui); cursor: pointer;
  padding: 8px 14px; border-radius: 6px; border: 1px solid var(--ink);
  background: var(--paper); color: var(--ink); box-shadow: 0 2px 10px rgba(0,0,0,.25);
}
.notes-fab:hover, .notes-fab:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
.notes-dialog {
  border: none; border-radius: 4px; padding: 0;
  width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  background: var(--paper); color: var(--ink); box-shadow: 0 12px 48px rgba(0,0,0,.5);
}
.notes-dialog::backdrop { background: rgba(26, 18, 8, .6); }
.notes-inner { display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
.notes-inner h2 { margin: 0; padding: 16px 20px; font: 700 1.3rem/1.2 var(--font-head); border-bottom: 1px solid var(--ink); }
.notes-list { margin: 0; padding: 16px 20px 16px 2.6em; overflow-y: auto; font-size: 16px; line-height: 1.5; }
.notes-list li { margin: 0 0 .6em; padding: 4px 8px; white-space: pre-line; overflow-wrap: anywhere; }
.notes-list li.current { background: var(--highlight); }
.notes-list a { color: var(--rust); }
.notes-actions { padding: 12px 20px 16px; border-top: 1px solid var(--ink); text-align: right; }
.notes-actions .btn-primary { display: inline-block; flex: none; border: none; }

/* =====================================================================
   EDITOR STYLES (only seen after entering the password)
   ===================================================================== */
body.is-editing { padding-bottom: 120px; }
body.is-editing [data-text] { outline: 1px dotted var(--edit-outline); outline-offset: 3px; cursor: text; min-height: 1em; min-width: 1em; }
body.is-editing [data-text]:focus { outline: 2px solid var(--edit-outline); background: rgba(42,110,220,.08); }

.ed-ui, .ed-ui * { font: 14px/1.4 var(--font-ui); box-sizing: border-box; }
.edit-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 10px 16px; background: var(--edit-bar); color: var(--edit-bar-text);
  box-shadow: 0 -2px 12px rgba(0,0,0,.25);
}
.edit-bar .ed-status { flex: 1 1 220px; color: #b7c0cf; font-size: 13px; }
.ed-btn { appearance: none; border: 1px solid #c9ced8; background: #fff; color: #1d2330; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.ed-btn:hover { background: #eef2f9; }
.ed-btn.ed-primary { background: var(--edit-outline); border-color: var(--edit-outline); color: #fff; }
.edit-bar .ed-btn { border-color: #3a4357; background: #2a3242; color: var(--edit-bar-text); }
.edit-bar .ed-btn:hover { background: #343e52; }
.edit-bar .ed-btn.ed-primary { background: var(--edit-outline); border-color: var(--edit-outline); }

.ed-dialog { border: none; border-radius: 10px; padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); color: #1d2330; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.ed-dialog::backdrop { background: rgba(15,20,30,.5); }
.ed-dialog form { padding: 20px; display: grid; gap: 10px; }
.ed-dialog h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; outline: none; }
.ed-dialog p { margin: 0; color: #4c5566; }
.ed-dialog label { font-weight: 600; margin-top: 4px; }
.ed-dialog input, .ed-dialog textarea { width: 100%; padding: 7px 9px; border: 1px solid #c9ced8; border-radius: 6px; background: #fff; color: #1d2330; }
.ed-dialog textarea { resize: vertical; min-height: 2.6em; }
.ed-dialog .ed-group { margin-top: 10px; padding-top: 8px; border-top: 1px solid #e1e4ea; font-weight: 700; color: #1d2330; }
.ed-dialog .ed-hint { color: #1d2330; background: #eef4ff; border-left: 3px solid var(--edit-outline); padding: 6px 10px; }
.ed-dialog .ed-error { color: #b42318; }
.ed-dialog .ed-error:empty { display: none; }
.ed-dialog .ed-buttons { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.ed-link { justify-self: start; border: 0; background: none; padding: 4px 0; color: var(--edit-outline); text-decoration: underline; cursor: pointer; }

/* The Game editor panel (under the game, edit mode only) */
.game-editor { max-width: 1000px; margin: 24px auto; padding: 16px; background: #fff; color: #1d2330; border: 2px solid var(--edit-outline); border-radius: 8px; }
.game-editor h2 { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
.game-editor p { margin: 4px 0; color: #4c5566; }
.game-editor .ed-hint { color: #1d2330; background: #eef4ff; border-left: 3px solid var(--edit-outline); padding: 6px 10px; }
.game-editor details { border: 1px solid #e1e4ea; border-radius: 6px; margin: 8px 0; padding: 0 12px; background: #fafbfd; }
.game-editor details[open] { padding-bottom: 12px; }
.game-editor summary { cursor: pointer; padding: 9px 0; font-weight: 700; }
.game-editor details details { background: #fff; }
.game-editor details details details { background: #fafbfd; }
.game-editor fieldset { border: 1px solid #e1e4ea; border-radius: 6px; margin: 10px 0 0; padding: 8px 10px 10px; min-width: 0; }
.game-editor legend { font-weight: 700; padding: 0 4px; }
.game-editor label { display: block; font-weight: 600; margin-top: 8px; }
.game-editor label.ge-check { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.game-editor input[type=text], .game-editor input[type=number], .game-editor textarea, .game-editor select { width: 100%; padding: 6px 8px; border: 1px solid #c9ced8; border-radius: 6px; background: #fff; color: #1d2330; }
.game-editor textarea { resize: vertical; min-height: 4.2em; }
.game-editor .ge-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }

<script>
/* =====================================================================
   PAGE SCRIPT

   Sections:
     1. Start-up: remember the original page and read the game data
     2. Editor wording (plain English, not game content)
     3. Small helpers
     4. SHA-256 (password check and file fingerprints)
     5. Footnotes
     6. Drawing the page and the game
     7. Browser storage (unlock + auto-save), all wrapped in try/catch
     8. The editor
     9. Getting everything going
   ===================================================================== */
(function () {
  'use strict';

  /* -------------------------------------------------------------------
     1. START-UP
     Copy the page exactly as it was loaded, before anything is drawn.
     "Save file" builds the new file from this copy and only swaps in the
     new game data, so no editor bits or rendered footnotes can leak into it.
     ------------------------------------------------------------------- */
  const ORIGINAL_PAGE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

  const TAGS = ['crisis', 'warn', 'good'];

  // The starting content, and the values merged in when loading, so older
  // saved files that are missing a key still work. Add new defaults here
  // whenever a new key is added to the game data.
  /* DEFAULTS-START */
  const DEFAULTS = (function () {
    const STAT_IDS = ['s1', 's2', 's3', 's4', 's5'];
    function effects() { const fx = { money: 0 }; STAT_IDS.forEach(id => { fx[id] = 0; }); return fx; }
    function ending(name) { return { title: '[' + name + ' title]', verdict: '[' + name + ' verdict]', text: '[' + name + ' text]' }; }
    function path(p) {
      return {
        id: 'p' + p,
        icon: '✦',
        name: '[Path ' + p + ']',
        era: '[Era · years]',
        description: '[Describe who the player is on this path and what they will face.]',
        button: '[Begin as path ' + p + ']',
        label: '[Path ' + p + ' label]',
        decisions: [1, 2, 3, 4].map(d => ({
          id: 'p' + p + 'd' + d, category: '[Category]', label: '[Decision ' + d + ']',
          description: '[What this decision means]', hint: '[Hint about its effects]', effects: effects()
        })),
        events: [1, 2, 3].map(e => ({
          id: 'p' + p + 'e' + e, tag: ['crisis', 'warn', 'good'][e - 1],
          headline: '[Event ' + e + ' headline]', body: '[What happened]',
          image: { src: '', alt: '[Image description]', caption: '[Image caption and credit]' },
          effects: effects(),
          chance: e === 2 ? 100 : 30,
          conditions: e === 2 ? [{ stat: 's3', op: 'below', value: 50 }] : []
        })),
        notes: [1, 2].map(n => ({ id: 'p' + p + 'n' + n, title: '[Historical note ' + n + ' title]', body: '[Historical note text]' }))
      };
    }
    return {
      schemaVersion: 1,
      page: {
        mastheadTop: '[An educational strategy game]',
        title: '[Game title]',
        subtitle: '[Subtitle — years]',
        intro: '[Introduction: who the player is, what they are responsible for, and what pressures they will face.]',
        howToPlayHeading: '[How to play]',
        howToPlay: '[Rule 1]\n[Rule 2]\n[Rule 3]\n[Rule 4]\n[Rule 5]\n[Rule 6]',
        gameSubtitle: '[Game subtitle · years]',
        author: '[Your name and class]'
      },
      ui: {
        browserTabTitle: 'Great Depression',
        editLink: '[Edit]',
        localChangesNote: '[This page is showing changes that aren\'t in the uploaded file yet.]',
        footnotesButton: '[Footnotes]',
        footnotesTitle: '[Footnotes]',
        footnotesBack: '[Back]',

        timelinePanel: '[Timeline]',
        turnCounter: '[Turn {n} of {total}]',
        statsPanel: '[Status]',
        eventsPanel: '[Dispatches]',
        tagCrisis: '[Crisis]',
        tagWarn: '[Developing situation]',
        tagGood: '[Good news]',
        eventDateline: '[{year} — Dispatches]',
        effectsPrefix: '[Immediate effects:]',
        decisionsPanel: '[Decisions]',
        decisionsPrompt: '[Select your course:]',
        advance: '[Advance →]',
        restart: '[Restart]',
        logPanel: '[Record of decisions]',
        logEmpty: '[Nothing recorded yet.]',
        logNoEvent: '[No major event]',
        logChose: '[chose:]',
        notesHeading: '[Historical notes]',
        endingStamp: '[{path} · {year} · Turn {turn} of {total}]',
        backToStart: '[Return to the start]'
      },
      game: {
        startYear: 1929,
        yearStep: 1,
        turns: 10,
        choicesPerTurn: 3,
        eventChance: 65,
        money: {
          show: true,
          name: '[Money]',
          label: '[Money label]',
          prefix: '$',
          start: 10000,
          income: 1000,
          loseBelow: -2000,
          ending: ending('Out of money')
        },
        stats: [
          { id: 's1', name: '[Stat 1]', start: 60, lowerIsBetter: false, canLose: false, loseAt: 0, ending: ending('Stat 1 ending') },
          { id: 's2', name: '[Stat 2]', start: 45, lowerIsBetter: false, canLose: false, loseAt: 0, ending: ending('Stat 2 ending') },
          { id: 's3', name: '[Stat 3]', start: 55, lowerIsBetter: false, canLose: true, loseAt: 8, ending: ending('Stat 3 ending') },
          { id: 's4', name: '[Stat 4]', start: 60, lowerIsBetter: false, canLose: true, loseAt: 8, ending: ending('Stat 4 ending') },
          { id: 's5', name: '[Stat 5]', start: 20, lowerIsBetter: true, canLose: true, loseAt: 90, ending: ending('Stat 5 ending') }
        ],

  /* DEFAULTS-END */

  // Fill in any missing keys from DEFAULTS, without changing keys that exist.
  // (Lists, like the paths, are only filled in if they are missing completely.)
  function withDefaults(d) {
    (function fill(target, defaults) {
      Object.keys(defaults).forEach(k => {
        const def = defaults[k];
        if (!(k in target)) target[k] = clone(def);
        else if (def && typeof def === 'object' && !Array.isArray(def) && target[k] && typeof target[k] === 'object') fill(target[k], def);
      });
    })(d, DEFAULTS);
    const g = d.game;
    if (!Array.isArray(g.stats) || !g.stats.length) g.stats = clone(DEFAULTS.game.stats);
    g.stats.forEach(s => { s.ending = Object.assign({ title: '', verdict: '', text: '' }, s.ending); });
    if (!Array.isArray(g.paths) || !g.paths.length) g.paths = clone(DEFAULTS.game.paths);
    g.paths.forEach(p => {
      ['decisions', 'events', 'notes'].forEach(k => { if (!Array.isArray(p[k])) p[k] = []; });
      p.decisions.forEach(x => { if (!x.effects || typeof x.effects !== 'object') x.effects = {}; });
      p.events.forEach(x => {
        if (!x.effects || typeof x.effects !== 'object') x.effects = {};
        x.image = Object.assign({ src: '', alt: '', caption: '' }, x.image);
        if (!Array.isArray(x.conditions)) x.conditions = [];
        if (!TAGS.includes(x.tag)) x.tag = 'warn';
        if (x.chance == null) x.chance = 100;
      });
    });

  /* -------------------------------------------------------------------
     3. SMALL HELPERS
     ------------------------------------------------------------------- */
  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
  const $ = sel => document.querySelector(sel);

  // Read or write a value using a dotted path such as "page.title".
  function getPath(obj, path) {
    return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
  }
  function setPath(obj, path, value) {
    const keys = path.split('.');
    const last = keys.pop();
    const target = keys.reduce((o, k) => (o[k] = o[k] || {}), obj);
    target[last] = value;
  }

  // The data without the password check (auto-saves never store it).
  function withoutAuth(d) { const c = clone(d); delete c.auth; return c; }
  // True if some data is the same as the uploaded file's data.
  function sameAsFile(d) { return JSON.stringify(withoutAuth(d)) === JSON.stringify(withoutAuth(FILE_DATA)); }
  // Put the file's own password check back in (it never comes from an auto-save).
  function withFileAuth(d) {
    const out = { schemaVersion: d.schemaVersion, auth: clone(FILE_DATA.auth) };
    Object.keys(d).forEach(k => { if (k !== 'auth' && k !== 'schemaVersion') out[k] = d[k]; });
    return out;
  }

  // Make an element. `attrs` is an object of attributes; `text` is set as textContent.
  function el(tag, attrs, text) {
    const e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(k => e.setAttribute(k, attrs[k]));
    if (text != null) e.textContent = text;
    return e;
  }

  // A short random id for new items, e.g. "e4k2x9".
  function newId(prefix) { return prefix + Math.random().toString(36).slice(2, 8); }

  // Fill in {words} in a piece of text, e.g. fill('At {time}', { time: '3:00' }).
  function fill(text, values) {
    return String(text == null ? '' : text).replace(/\{(\w+)\}/g, (m, k) => (k in values ? values[k] : m));
  }

  function clampValue(n) { return Math.min(100, Math.max(0, Math.round(Number(n) || 0))); }

  /* -------------------------------------------------------------------
     4. SHA-256
     Written out in plain JavaScript (not crypto.subtle) so it works however
     the page is opened: from disk (file://), plain http, or https.
     Used for the password check and to fingerprint the file's content.
     ------------------------------------------------------------------- */
  function sha256(text) {
    const K = [];
    const H = [];
    // The constants are the fractional parts of the square and cube roots of the first primes.
    for (let n = 2, found = 0; found < 64; n++) {
      let prime = true;
      for (let d = 2; d * d <= n; d++) if (n % d === 0) { prime = false; break; }
      if (!prime) continue;
      if (found < 8) H[found] = (Math.pow(n, 1 / 2) * 2 ** 32) | 0;
      K[found++] = (Math.pow(n, 1 / 3) * 2 ** 32) | 0;
    }
    const bytes = Array.from(new TextEncoder().encode(text));
    const bitLen = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? Math.floor(bitLen / 2 ** 32 / 2 ** ((i - 4) * 8)) & 0xff : (bitLen >>> (i * 8)) & 0xff);
    const rot = (x, n) => (x >>> n) | (x << (32 - n));
    const W = new Array(64);
    for (let off = 0; off < bytes.length; off += 64) {
      for (let i = 0; i < 16; i++) W[i] = (bytes[off + i * 4] << 24) | (bytes[off + i * 4 + 1] << 16) | (bytes[off + i * 4 + 2] << 8) | bytes[off + i * 4 + 3];
      for (let i = 16; i < 64; i++) {
        const s0 = rot(W[i - 15], 7) ^ rot(W[i - 15], 18) ^ (W[i - 15] >>> 3);
        const s1 = rot(W[i - 2], 17) ^ rot(W[i - 2], 19) ^ (W[i - 2] >>> 10);
        W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
      }
      let [a, b, c, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        const t1 = (h + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
        const t2 = ((rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      [a, b, c, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) | 0; });
    }
    return H.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
  }

  // A fingerprint of the uploaded file's content, stored with every auto-save.
  const FILE_FINGERPRINT = sha256(JSON.stringify(withoutAuth(FILE_DATA)));

  /* -------------------------------------------------------------------
     5. FOOTNOTES
     In ANY text, {{fn: citation}} becomes a small superscript number, and
     the citation is added to the footnote list of the "screen" it is on.
     A screen is whatever the player sees at one time: the start screen,
     the game screen (one turn) or the ending screen, plus the footer.
     The footnotes button in the top corner opens the current screen's list;
     clicking a number in body text opens it with that note highlighted.
     ------------------------------------------------------------------- */
  const NOTE_RE = /\{\{\s*fn\s*:\s*([\s\S]*?)\s*\}\}/gi;
  const SCREEN_OF = new WeakMap();   // footnote number element -> its screen

  function newScreen() { return { notes: [] }; }

  // Text as page content, with each {{fn: ...}} swapped for a numbered marker.
  // Built from text nodes only: student text is never inserted as HTML.
  function withNotes(text, screen) {
    const frag = document.createDocumentFragment();
    const str = String(text == null ? '' : text);
    let last = 0;
    for (const m of str.matchAll(NOTE_RE)) {
      frag.append(str.slice(last, m.index));
      screen.notes.push(m[1]);
      const n = screen.notes.length;
      const sup = el('sup', { class: 'fn-ref', 'data-note': n, title: 'Footnote ' + n }, String(n));
      SCREEN_OF.set(sup, screen);
      frag.append(sup);
      last = m.index + m[0].length;
    }
    frag.append(str.slice(last));
    return frag;
  }

  // Where markup can't appear (tab title, alt text, log, labels): remove the markers.
  function stripNotes(text) { return String(text == null ? '' : text).replace(NOTE_RE, '').replace(/\s{2,}/g, ' ').trim(); }

  // A citation, with web addresses turned into links that open in a new tab.
  function citation(text) {
    const frag = document.createDocumentFragment();
    String(text).split(/(https?:\/\/[^\s<>"]+)/).forEach((part, i) => {
      if (i % 2 === 0) { frag.append(part); return; }
      frag.append(el('a', { href: part, target: '_blank', rel: 'noopener noreferrer' }, part));
    });
    return frag;
  }

  // Show "Footnotes (n)" on a screen's button, or hide it if there are none.
  function updateNotesButton(button, screen) {
    const count = screen.notes.length;
    if (!count || editing) { button.hidden = true; return; }
    // The button's own label may contain a footnote too; it joins the same list.
    button.replaceChildren(withNotes(data.ui.footnotesButton, screen), ' (' + screen.notes.length + ')');
    button.setAttribute('aria-label', stripNotes(data.ui.footnotesButton) + ' (' + screen.notes.length + ')');
    button.onclick = () => openNotes(screen);
    button.hidden = false;
  }

  // Open the footnotes pop-up for a screen, optionally highlighting one note.
  function openNotes(screen, highlight) {
    // The pop-up's own heading and button can hold footnotes as well; they
    // are numbered after the screen's notes, on a copy of its list.
    const shown = { notes: screen.notes.slice() };
    $('#notes-title').replaceChildren(withNotes(data.ui.footnotesTitle, shown));
    $('#notes-back').replaceChildren(withNotes(data.ui.footnotesBack, shown));
    const list = $('#notes-list');
    list.replaceChildren(...shown.notes.map((n, i) => {
      const li = el('li', { id: 'note-' + (i + 1) });
      li.append(citation(n));
      if (i + 1 === Number(highlight)) li.className = 'current';
      return li;
    }));
    const dlg = $('#notes-dialog');
    if (!dlg.open) dlg.showModal();
    const cur = list.querySelector('.current');
    if (cur) cur.scrollIntoView({ block: 'center' });
    else list.scrollTop = 0;
  }
  $('#notes-back').addEventListener('click', () => $('#notes-dialog').close());

  // Clicking a footnote number in body text opens its list with that note
  // highlighted. Numbers inside buttons and links don't, so they still work.
  document.addEventListener('click', e => {
    const ref = e.target.closest && e.target.closest('.fn-ref');
    if (!ref || editing || ref.closest('button, a, [role="button"], summary')) return;
    const screen = SCREEN_OF.get(ref);
    if (screen) openNotes(screen, ref.dataset.note);
  });

  /* -------------------------------------------------------------------
     6. DRAWING THE PAGE AND THE GAME
     The player picks a path on the start screen. Each turn the news panel
     may show an event, and the player picks one of a few decisions, then
     clicks Advance: the event's and the decision's effects are applied,
     the income is added, and the next turn begins. The game ends early if
     the money falls too low or a bar reaches its game-over value, and
     otherwise after the last turn, with an ending picked by the bars.
     ------------------------------------------------------------------- */
  let run = null;            // the game being played (not saved anywhere)
  let screen = newScreen();  // footnotes on the screen being shown
  const TAG_TEXT = { crisis: 'ui.tagCrisis', warn: 'ui.tagWarn', good: 'ui.tagGood' };
  const MULTILINE = /\.(text|intro|body|description|howToPlay)$/;

  // A fresh game, on the start screen.
  function newRun() {
    const g = data.game;
    const values = {};
    g.stats.forEach(s => { values[s.id] = clampValue(s.start); });
    return {
      phase: 'start', path: 0, turn: 0, money: Number(g.money.start) || 0, lastDelta: 0, values: values,
      eventId: null, choiceIds: [], selected: null, log: [], ending: null, notesOpen: false
    };
  }

  // A piece of text from the data at `path` (e.g. "page.title").
  // In edit mode it shows the raw text and can be edited in place;
  // otherwise its footnotes become numbers on the current screen.
  function txt(tag, path, cls, values) {
    const multiline = MULTILINE.test(path);
    const classes = [cls, multiline ? 'ml' : ''].filter(Boolean).join(' ');
    const node = el(tag, classes ? { class: classes } : {});
    const value = getPath(data, path);
    if (editing) {
      node.dataset.text = path;
      if (multiline) node.setAttribute('data-multiline', '');
      node.textContent = value == null ? '' : String(value);
    } else {
      node.append(withNotes(values ? fill(value, values) : value, screen));
    }
    return node;
  }

  // A game button. It is a <div role="button"> so its words can be edited in
  // place in edit mode; click the edge of the button (outside the outlined
  // words) to press it while editing.
  function gameButton(contents, onClick, cls) {
    const b = el('div', { class: cls, role: 'button', tabindex: '0' });
    b.append(...contents);
    b.addEventListener('click', e => {
      if (editing && e.target.closest('[data-text]')) return;
      onClick();
    });
    b.addEventListener('keydown', e => {
      if (e.target === b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); onClick(); }
    });
    return b;
  }

  function panel(titlePath) {
    const p = el('div', { class: 'panel' });
    p.append(txt('div', titlePath, 'panel-title'));
    return p;
  }

  // Money as text, e.g. "$12,000" or "−$500"; signedMoney adds a "+".
  function fmtMoney(v) {
    const n = Math.round(Number(v) || 0);
    return (n < 0 ? '−' : '') + stripNotes(data.game.money.prefix) + Math.abs(n).toLocaleString('en-US');
  }
  function signedMoney(v) { return (Math.round(Number(v) || 0) >= 0 ? '+' : '') + fmtMoney(v); }

  function yearOf(turn) { return (Number(data.game.startYear) || 0) + turn * (Number(data.game.yearStep) || 0); }

  // How good a bar is, from 0 (bad) to 100 (good).
  function goodness(s, v) { return s.lowerIsBetter ? 100 - v : v; }
  function barClass(s, v) { const e = goodness(s, v); return e > 55 ? 'good' : e > 30 ? 'mid' : 'bad'; }

  // "Money: +$500 · Bar 1: −3", built from some effects (empty if they are all 0).
  function effectParts(fx) {
    const g = data.game;
    const parts = [];
    fx = fx || {};
    if (g.money.show && Math.round(Number(fx.money) || 0)) parts.push(stripNotes(g.money.name) + ': ' + signedMoney(fx.money));
    g.stats.forEach(s => {
      const n = Math.round(Number(fx[s.id]) || 0);
      if (n) parts.push(stripNotes(s.name) + ': ' + (n > 0 ? '+' : '−') + Math.abs(n));
    });
    return parts.join(' · ');
  }

  function currentPath() { return data.game.paths[run.path]; }
  function currentEvent() { return run.eventId ? currentPath().events.find(e => e.id === run.eventId) || null : null; }

  function conditionTrue(c) {
    const v = c.stat === 'money' ? run.money : run.values[c.stat];
    if (v == null) return true;
    return c.op === 'above' ? v > Number(c.value) : v < Number(c.value);
  }

  // Pick this turn's event: one whose conditions are all true and whose
  // own chance comes up, and then only with the game's event chance.
  function rollEvent() {
    const eligible = currentPath().events.filter(e => e.conditions.every(conditionTrue) && Math.random() * 100 < Number(e.chance));
    if (!eligible.length || Math.random() * 100 >= Number(data.game.eventChance)) run.eventId = null;
    else run.eventId = eligible[Math.floor(Math.random() * eligible.length)].id;
  }

  // Pick this turn's decisions at random.
  function pickChoices() {
    const list = currentPath().decisions.slice();
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    run.choiceIds = list.slice(0, Math.max(1, Number(data.game.choicesPerTurn) || 1)).map(d => d.id);
  }

  // The decisions on offer this turn (picked again if the list has changed in the editor).
  function currentChoices() {
    const decisions = currentPath().decisions;
    const perTurn = Math.max(1, Number(data.game.choicesPerTurn) || 1);
    let list = run.choiceIds.map(id => decisions.find(d => d.id === id)).filter(Boolean);
    if (list.length < Math.min(perTurn, decisions.length) || list.length > perTurn) {
      pickChoices();
      list = run.choiceIds.map(id => decisions.find(d => d.id === id)).filter(Boolean);
    }
    return list;
  }

  function startTurn() {
    run.selected = null;
    rollEvent();
    pickChoices();
  }

  function choosePath(i) {
    run = newRun();
    run.phase = 'game';
    run.path = i;
    startTurn();
    render();
    window.scrollTo(0, 0);
  }

  function toStart() {
    run = newRun();
    render();
    window.scrollTo(0, 0);
  }

  function applyEffects(fx) {
    fx = fx || {};
    run.money += Number(fx.money) || 0;
    data.game.stats.forEach(s => { run.values[s.id] = clampValue(run.values[s.id] + (Number(fx[s.id]) || 0)); });
  }

  // An early ending: money too low, or a bar at its game-over value.
  function earlyEnding() {
    const g = data.game;
    if (g.money.show && run.money < Number(g.money.loseBelow)) return { kind: 'money' };
    const s = g.stats.find(s => s.canLose && (s.lowerIsBetter ? run.values[s.id] >= Number(s.loseAt) : run.values[s.id] <= Number(s.loseAt)));
    return s ? { kind: 'stat', statId: s.id } : null;
  }

  // The ending after the last turn, from the average of the bars.
  function finalEnding() {
    const g = data.game;
    const score = g.stats.reduce((sum, s) => sum + goodness(s, run.values[s.id]), 0) / Math.max(1, g.stats.length);
    const f = g.finalEndings;
    return { kind: 'final', tier: score > Number(f.winAbove) ? 'win' : score > Number(f.mixedAbove) ? 'mixed' : 'lose' };
  }

  function finish(ending, turnsPlayed, year) {
    run.phase = 'end';
    run.ending = Object.assign(ending, { turnsPlayed: turnsPlayed, year: year });
    render();
    window.scrollTo(0, 0);
  }

  function advance() {
    const g = data.game;
    const decision = currentPath().decisions.find(d => d.id === run.selected);
    if (!decision) return;
    const event = currentEvent();
    const before = run.money;
    if (event) applyEffects(event.effects);
    applyEffects(decision.effects);
    run.money += Number(g.money.income) || 0;
    run.lastDelta = run.money - before;
    const year = yearOf(run.turn);
    run.log.unshift({ year: year, eventId: event ? event.id : null, decisionId: decision.id, delta: run.lastDelta });

    const early = earlyEnding();
    if (early) { finish(early, run.turn + 1, year); return; }
    run.turn++;
    if (run.turn >= Math.max(1, Number(g.turns) || 1)) { finish(finalEnding(), run.turn, yearOf(run.turn)); return; }
    startTurn();
    render();
    const news = $('#event-panel');
    if (news) news.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // If the content changed in the editor, make sure the game being played still fits it.
  function checkRun() {
    const g = data.game;
    if (!run || (run.phase !== 'start' && !g.paths[run.path])) { run = newRun(); return; }
    if (run.phase === 'game' && run.eventId && !currentEvent()) run.eventId = null;
    if (run.phase === 'end') {
      const e = run.ending;
      const gone = (e.kind === 'stat' && !g.stats.some(s => s.id === e.statId)) || (e.kind === 'money' && !g.money.show);
      if (gone) run.ending = Object.assign(finalEnding(), { turnsPlayed: e.turnsPlayed, year: e.year });
    }
  }

  function render() {
    screen = newScreen();
    checkRun();
    updateLocalNote();
    const view = run.phase === 'game' ? gameView() : run.phase === 'end' ? endView() : startView();
    $('#app').replaceChildren(view);

    // The footer (after the screen, so its footnotes number last)
    document.querySelectorAll('.site-footer [data-text], .site-footer [data-label]').forEach(node => {
      const value = getPath(data, node.dataset.text || node.dataset.label);
      if (node.hidden) node.textContent = stripNotes(value);
      else if (editing && node.dataset.text) { if (node !== document.activeElement) node.textContent = value == null ? '' : String(value); }
      else node.replaceChildren(withNotes(value, screen));

  /* -------------------------------------------------------------------
     7. BROWSER STORAGE
     Every storage call is wrapped in try/catch: if the browser blocks
     storage, the game still plays and the editor still works (it just
     can't auto-save).
     ------------------------------------------------------------------- */

  // "Unlocked" lasts for this browser tab only (sessionStorage).
  const unlockStore = {
    key: 'unlocked:' + PAGE_KEY,
    isUnlocked() { try { return sessionStorage.getItem(this.key) === FILE_DATA.auth.hash; } catch (e) { return false; } },
    remember() { try { sessionStorage.setItem(this.key, FILE_DATA.auth.hash); } catch (e) { /* storage blocked */ } }
  };

  // Auto-saves live in IndexedDB (it has room for images), one per page path.
  const autoSaveStore = (function () {
    const DB_NAME = 'student-game-autosave';
    const STORE = 'autosave';
    let dbPromise = null;

    function openDb() {
      if (!dbPromise) {
        dbPromise = new Promise(resolve => {
          try {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = () => req.result.createObjectStore(STORE);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
            req.onblocked = () => resolve(null);
          } catch (e) { resolve(null); }
        });
      }
      return dbPromise;
    }

    // Run one request; resolves with its result, or `fallback` if anything fails.
    async function request(mode, makeRequest, fallback) {
      const db = await openDb();
      if (!db) return fallback;
      return new Promise(resolve => {
        try {
          const req = makeRequest(db.transaction(STORE, mode).objectStore(STORE));
          req.onsuccess = () => resolve(mode === 'readonly' ? (req.result || null) : true);
          req.onerror = () => resolve(fallback);
        } catch (e) { resolve(fallback); }
      });
    }

    return {
      get: () => request('readonly', s => s.get(PAGE_KEY), null),
      put: value => request('readwrite', s => s.put(value, PAGE_KEY), false),
      clear: () => request('readwrite', s => s.delete(PAGE_KEY), false),
      works: async () => !!(await openDb())
    };
  })();

  let saveTimer = null;
  let unsaved = false;        // true when there are changes not yet auto-saved
  let pendingConflict = null; // an auto-save made for a different version of the file

  // Call after every change: auto-saves about half a second later.
  function changed() {
    unsaved = true;
    setStatus(EDITOR_TEXT.statusSaving);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(autoSaveNow, 500);
  }

  async function autoSaveNow() {
    clearTimeout(saveTimer);
    saveTimer = null;
    if (!unsaved) return;
    unsaved = false;
    updateLocalNote();
    if (sameAsFile(data)) {            // back to the uploaded version: nothing to keep
      await autoSaveStore.clear();
      setStatus(EDITOR_TEXT.statusClean);
      return;
    }
    const ok = await autoSaveStore.put({ fingerprint: FILE_FINGERPRINT, savedAt: Date.now(), data: withoutAuth(data) });
    const time = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    setStatus(ok ? fill(EDITOR_TEXT.statusSaved, { time }) : EDITOR_TEXT.statusNoStorage);
  }

  // Use an auto-save's data (the password check always comes from the file).
  function useSaved(saved) {
    data = withDefaults(withFileAuth(saved.data));
    run = null;                        // start the game again with the loaded content
    render();
    if (editing) buildGameEditor();
  }

  // On page load: bring back auto-saved changes, even outside edit mode.
  async function loadAutoSave() {
    const saved = await autoSaveStore.get();
    if (!saved || !saved.data) return;
    withDefaults(saved.data);
    if (sameAsFile(saved.data)) {
      await autoSaveStore.clear();     // the uploaded file already has these changes
    } else if (saved.fingerprint === FILE_FINGERPRINT) {
      useSaved(saved);                 // same file as when they were saved: load them
    } else {
      pendingConflict = saved;         // the file has changed since: ask when edit mode opens
      if (editing) await resolveConflict();
    }
  }

  // Save straight away if the page is closed or hidden.
  window.addEventListener('pagehide', autoSaveNow);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') autoSaveNow(); });

  /* -------------------------------------------------------------------
     8. THE EDITOR
     ------------------------------------------------------------------- */
  let editBar = null;
  let statusEl = null;
  function setStatus(message) { if (statusEl) statusEl.textContent = message; }

  // An editor pop-up. `buttons` is a list of { label, value, primary }.
  // Resolves with the value of the button pressed, or null for Escape.
  // It resolves straight from its own buttons and the Escape key, and only
  // uses the dialog's "close" event as a backup (it doesn't always fire in
  // background tabs).
  function showDialog(title, bodyNodes, buttons, onSubmit) {
    return new Promise(resolve => {
      const dlg = el('dialog', { class: 'ed-ui ed-dialog' });
      const form = el('form');
      let finished = false;

      function finish(value) {
        if (finished) return;
        finished = true;
        try { if (dlg.open) dlg.close(); } catch (e) { /* already closed */ }
        dlg.remove();
        resolve(value);
      }

      const heading = el('h2', { tabindex: '-1' }, title);
      form.append(heading, ...bodyNodes);
      const row = el('div', { class: 'ed-buttons' });
      buttons.forEach(b => {
        const button = el('button', { type: b.primary ? 'submit' : 'button', class: 'ed-btn' + (b.primary ? ' ed-primary' : '') }, b.label);
        if (!b.primary) button.addEventListener('click', () => finish(b.value));
        row.append(button);
      });
      form.append(row);
      // The primary button (or Enter) submits; onSubmit can return false to keep the dialog open.
      form.addEventListener('submit', e => {
        e.preventDefault();
        if (onSubmit && onSubmit() === false) return;
        const primary = buttons.find(b => b.primary);
        finish(primary ? primary.value : null);
      });
      dlg.addEventListener('cancel', e => { e.preventDefault(); finish(null); });  // Escape key
      dlg.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(null); } });
      dlg.addEventListener('close', () => finish(null));                         // backup only
      dlg.append(form);
      document.body.append(dlg);
      dlg.showModal();
      // Start at the top: focus the heading, not the last button (long dialogs like the help).
      heading.focus({ preventScroll: true });
      dlg.scrollTop = 0;
    });
  }
