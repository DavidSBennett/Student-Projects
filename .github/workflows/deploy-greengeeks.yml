# Uploads each project's index.html to the live site on GreenGeeks.
#
#   repo:  <project-folder>/index.html
#   live:  https://studentprojects.davidsbennett.com/<project-folder>/index.html
#
# Same approach as the other GreenGeeks sites: plain rsync over SSH, no marketplace
# action. (It used FTP until 2026-11-22.) rsync only sends the files that changed,
# so every run offers every project and only the edited ones actually travel.
#
# Needs four repository secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST, SSH_PORT, SSH_USERNAME, SSH_PRIVATE_KEY
# and optionally the repository variable DEPLOY_DIR: the site's folder relative to
# the SSH home (default below), so the folder can move without editing this file.

name: Deploy to GreenGeeks (SSH)

on:
  push:
    branches: [main]
    paths: ['*/index.html', '.github/workflows/deploy-greengeeks.yml']
  workflow_dispatch:

concurrency:
  group: deploy-greengeeks
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'public_html/studentprojects.davidsbennett.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble publish/ (each project's index.html)
        run: |
          mkdir -p publish
          # Only top-level project folders; hidden folders like .github are skipped.
          git ls-files -- '*/index.html' | grep -E '^[^./][^/]*/index\.html$' > upload.txt || true
          while IFS= read -r file; do
            mkdir -p "publish/${file%/index.html}"
            cp "$file" "publish/$file"
          done < upload.txt
          echo "Projects offered: $(wc -l < upload.txt)"

      - name: Deploy via rsync over SSH
        env:
          SSH_KEY:  ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "::error::Missing SSH secrets (SSH_HOST, SSH_USERNAME, SSH_PRIVATE_KEY). See the top of this file."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_CMD="ssh -p ${SSH_PORT} -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"

          $SSH_CMD "${SSH_USER}@${SSH_HOST}" "test -d '${DEPLOY_DIR}'" || {
            echo "::error::${DEPLOY_DIR} doesn't exist on the server. Check the Document Root in cPanel -> Domains, and the DEPLOY_DIR variable."
            exit 1
          }
          echo "Deploying to ~/${DEPLOY_DIR}/"

          # No --delete: student work removed from the repo, and cPanel's own files
          # (.well-known, cgi-bin), stay on the server.
          rsync -rltzvO --no-perms -e "$SSH_CMD" publish/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_DIR}/"

          rm -f ~/.ssh/deploy_key
          echo "Live: https://studentprojects.davidsbennett.com/<project>/"
