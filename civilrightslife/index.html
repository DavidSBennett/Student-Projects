          <li>Type the age (or the <b>From age</b> and <b>To age</b>), the <b>Title</b>, and <b>What happens</b>.</li>
          <li>To add a picture, click <b>Upload image</b>, then describe the picture in the box below it.
            <b>Remove image</b> takes it away.</li>
          <li>Under <b>Choices</b>, type the <b>Button text</b> and <b>What happens after this choice</b>.
            Click <b>Add choice</b> for more (up to 4).</li>
          <li>Click <b>Add event</b> at the bottom of the list to make a new event.</li>
        </ol></li>
      <li><b>Activities:</b> things the player can choose to do in a year. Fill in the name, what happens,
        and the ages. Click <b>Add activity</b> for another one.</li>
      <li><b>Endings:</b> the game checks endings from top to bottom and shows the first one that matches.
        Keep one at the bottom with no conditions. Click <b>Add ending</b> for another one.</li>
    </ol>
    <p>Many items also have:</p>
    <ul>
      <li><b>Effects:</b> click <b>Add effect</b>, pick the stat or relationship that changes, and type how much
        (for example 5, or -5 to lower it).</li>
      <li><b>Conditions:</b> click <b>Add condition</b> to make something happen only sometimes, for example
        only if a stat is at least 50, or only if the player picked an earlier choice.</li>
      <li>The <b>↑</b> and <b>↓</b> buttons move an item up or down. The <b>✕</b> button deletes it
        (it asks first).</li>
    </ul>
    <p><b>Testing:</b> while you edit, you can play the game above. It's only a test and doesn't change
      anyone's saved game. Click <b>Preview from an age…</b>, choose an age and stats, then click
      <b>Start preview</b> to jump straight there. <b>Restart test run</b> starts over.</p>

    <h3>4. Adding footnotes</h3>
    <p>You can add a footnote to <b>any</b> text in the game.</p>
    <ol>
      <li>Click right after the sentence that needs a source.</li>
      <li>Type two curly brackets, the letters <code>fn</code>, a colon, your citation, and two closing curly brackets:
        <code class="ed-example">A sentence that needs a source.{{fn: Author, Title, Year, page}}</code></li>
      <li>When you play the game, a small number appears there instead.</li>
      <li>A <b>Footnotes</b> button appears at the top of that screen. Click it, or click the small number,
        to see all the citations.</li>
    </ol>
    <ul>
      <li>In edit mode you'll see the <code>{{fn: ...}}</code> code. That's normal. It turns into a number when you click <b>Done</b>.</li>
      <li>A web address that starts with <code>https://</code> becomes a clickable link.</li>
      <li>Every footnote needs <code>{{</code> at the start and <code>}}</code> at the end, or it won't work.</li>
    </ul>

    <h3>5. Saving your work</h3>
    <ol>
      <li>Your work saves automatically, but only in this browser on this computer.</li>
      <li>When you're finished, click <b>Save file</b>. A file called <b>index.html</b> downloads.</li>
      <li><b>Turn in that index.html file</b> the way your teacher tells you. That's the only way your work
        gets onto the real website.</li>
      <li>Click <b>Done</b> to leave edit mode.</li>
    </ol>

    <h3>6. Tips</h3>
    <ul>
      <li>Replace everything in <b>[square brackets]</b> with your own research.</li>
      <li>Cite your sources with footnotes, and give the source for every image.</li>
      <li>If you make a mistake you can't fix, ask your teacher before you click <b>Discard changes</b>.
        It erases everything back to the last uploaded version.</li>
    </ul>`;

  function showHelp() {
    const content = el('div', { class: 'ed-help' });
    content.innerHTML = HELP_HTML;   // fixed text written above, never student text
    showDialog(EDITOR_TEXT.helpTitle, [content], [{ label: EDITOR_TEXT.close, value: 'close', primary: true }]);
  }

  // Ask for the password. Resolves true if it's right.
  async function askPassword() {
    const input = el('input', { type: 'password', id: 'ed-password', autocomplete: 'current-password' });
    const error = el('p', { class: 'error', role: 'alert' });
    const label = el('label', { for: 'ed-password' }, EDITOR_TEXT.passwordLabel);
    const help = el('button', { type: 'button', class: 'ed-link' }, EDITOR_TEXT.howToEditLink);
    help.addEventListener('click', showHelp);
    let ok = false;
    const shown = showDialog(EDITOR_TEXT.passwordTitle, [label, input, error, help], [
      { label: EDITOR_TEXT.cancel, value: 'cancel' },
      { label: EDITOR_TEXT.unlock, value: 'unlock', primary: true }
    ], () => {
      ok = sha256(FILE_DATA.auth.salt + ':' + input.value) === FILE_DATA.auth.hash;
      if (!ok) { error.textContent = EDITOR_TEXT.passwordWrong; input.select(); }
      return ok;
    });
    input.focus();
    await shown;
    return ok;
  }

  let asking = false;          // true while the password window is open

  async function startEditing() {
    if (editing || asking) return;
    if (!unlockStore.isUnlocked()) {
      asking = true;
      const ok = await askPassword();
      asking = false;
      if (!ok) { clearEditHash(); return; }
      unlockStore.remember();
    }
    editing = true;
    openPanel = null;
    document.body.classList.add('is-editing');
    buildEditBar();
    render();
    makeEditable();
    buildGameEditor();
    setStatus(sameAsFile(data) ? EDITOR_TEXT.statusClean : EDITOR_TEXT.statusHasChanges);
    if (pendingConflict) await resolveConflict();
  }

  async function stopEditing() {
    await autoSaveNow();
    editing = false;
    openPanel = null;
    document.body.classList.remove('is-editing');
    document.querySelectorAll('[data-text]').forEach(n => { n.removeAttribute('contenteditable'); n.removeAttribute('spellcheck'); });
    if (editBar) { editBar.remove(); editBar = null; statusEl = null; }
    removeGameEditor();
    render();
    clearEditHash();
  }

  function clearEditHash() {
    if (location.hash === '#edit') {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* not allowed here */ }
    }
  }

  function buildEditBar() {
    editBar = el('div', { class: 'edit-bar', role: 'region', 'aria-label': 'Editor' });
    statusEl = el('span', { class: 'status', 'aria-live': 'polite' });
    const buttons = [
      [EDITOR_TEXT.howToEdit, showHelp],
      [EDITOR_TEXT.otherText, editOtherText],
      [EDITOR_TEXT.discard, discardChanges],
      [EDITOR_TEXT.saveFile, saveFile],
      [EDITOR_TEXT.done, stopEditing, true]
    ];
    editBar.appendChild(statusEl);
    buttons.forEach(([label, action, primary]) => {
      const b = el('button', { type: 'button', class: primary ? 'primary' : '' }, label);
      b.addEventListener('click', action);
      editBar.appendChild(b);
    });
    document.body.appendChild(editBar);
  }

  // Can this browser do "plain text only" editing? (Most can.)
  const PLAIN_ONLY = (function () {
    try { const d = document.createElement('div'); d.contentEditable = 'plaintext-only'; return d.contentEditable === 'plaintext-only'; }
    catch (e) { return false; }
  })();

  // Turn on click-and-type editing for every data-text element.
  // Safe to call again after re-drawing (listeners are only added once).
  function makeEditable() {
    document.querySelectorAll('[data-text]').forEach(node => {
      node.setAttribute('contenteditable', PLAIN_ONLY ? 'plaintext-only' : 'true');
      node.setAttribute('spellcheck', 'true');
      if (node._editBound) return;
      node._editBound = true;

      node.addEventListener('input', () => {
        if (!editing) return;
        const value = node.innerText.replace(/ /g, ' ');
        setPath(data, node.dataset.text, value);
        // Keep the matching box in the Game editor up to date.
        const twin = panelInputs.get(node.dataset.text);
        if (twin) twin.value = value;
        changed();
      });
      // Single-line text: Enter finishes editing instead of adding a line.
      node.addEventListener('keydown', e => {
        if (editing && e.key === 'Enter' && !node.hasAttribute('data-multiline')) { e.preventDefault(); node.blur(); }
      });
      // Clicking text inside a button-like card shouldn't also trigger it.
      node.addEventListener('click', e => { if (editing) e.stopPropagation(); });
      // Pasting always pastes plain text (no fonts, colours or links).
      node.addEventListener('paste', e => {
        if (!editing) return;
        e.preventDefault();
        let text = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
        if (!node.hasAttribute('data-multiline')) text = text.replace(/\s*\n\s*/g, ' ');
        document.execCommand('insertText', false, text);
      });
      // When leaving a field, tidy its contents to match the saved text.
      node.addEventListener('blur', () => {
        if (!editing) return;
        const value = getPath(data, node.dataset.text);
        node.textContent = value == null ? '' : String(value);
      });
    });
  }

  // Clicking an image box in edit mode lets you upload a replacement.
  document.addEventListener('click', async e => {
    const box = editing && e.target.closest('[data-image-box]');
    if (!box) return;
    const name = box.dataset.imageBox;
    const src = await uploadImage();
    if (!src) return;
    data.images = data.images || {};
    data.images[name] = Object.assign({ alt: '' }, data.images[name], { src: src });
    render();
    changed();
  });

  // Ask for an image file and return it shrunk, as a data URL (or null).
  async function uploadImage() {
    const file = await pickFile();
    if (!file) return null;
    try { return await shrinkImage(file, 1600); }
    catch (err) { setStatus(EDITOR_TEXT.statusImageError); return null; }
  }

  function pickFile() {
    return new Promise(resolve => {
      const input = el('input', { type: 'file', accept: 'image/*' });
      input.addEventListener('change', () => resolve(input.files[0] || null));
      input.click();
    });
  }

  // Scale an uploaded photo down (longest side about `max` px) and store it as JPEG.
  function shrinkImage(file, max) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';               // JPEG has no transparency
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Not an image')); };
      img.src = url;
    });
  }

  // Parts of the data that are not edited in the "Other text" window:
  // settings rather than words, and the game (which has its own editor).
  const NOT_TEXT_KEYS = ['auth', 'schemaVersion', 'src', 'id', 'type', 'game'];

  // List every piece of text in the data that is NOT currently visible on the
  // page (visible text is edited in place). Returns [{ path, value }].
  function hiddenTextFields() {
    const visible = new Set();
    document.querySelectorAll('[data-text]').forEach(n => { if (n.getClientRects().length) visible.add(n.dataset.text); });
    const fields = [];
    (function walk(obj, prefix) {
      Object.keys(obj).forEach(k => {
        if (NOT_TEXT_KEYS.includes(k)) return;
        const path = prefix ? prefix + '.' + k : k;
        const v = obj[k];
        if (typeof v === 'string') { if (!visible.has(path)) fields.push({ path, value: v }); }
        else if (v && typeof v === 'object') walk(v, path);
      });
    })(data, '');
    return fields;
  }

  // "camelCase.path" -> "Camel case › path" for labels in the dialog.
  function niceName(part) {
    if (part === 'alt') return 'Description (alt text)';
    const s = part.replace(/([a-z0-9])([A-Z])/g, '$1 $2').toLowerCase();
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  async function editOtherText() {
    const fields = hiddenTextFields();
    const body = [el('p', {}, EDITOR_TEXT.otherTextHelp), el('p', { class: 'ge-hint' }, EDITOR_TEXT.fnHint)];
    const inputs = [];
    let group = null;
    fields.forEach((f, i) => {
      const parts = f.path.split('.');
      if (parts[0] !== group) { group = parts[0]; body.push(el('div', { class: 'group' }, niceName(group))); }
      const id = 'ed-field-' + i;
      body.push(el('label', { for: id }, parts.slice(1).map(niceName).join(' › ') || niceName(parts[0])));
      const box = el('textarea', { id: id, rows: '2' });
      box.value = f.value;
      body.push(box);
      inputs.push([f.path, box]);
    });
    const choice = await showDialog(EDITOR_TEXT.otherTextTitle, body, [
      { label: EDITOR_TEXT.cancel, value: 'cancel' },
      { label: EDITOR_TEXT.apply, value: 'apply', primary: true }
    ]);
    if (choice !== 'apply') return;
    let any = false;
    inputs.forEach(([path, box]) => {
      if (getPath(data, path) !== box.value) { setPath(data, path, box.value); any = true; }
    });
    if (any) { render(); changed(); }
  }

  async function discardChanges() {
    const choice = await showDialog(EDITOR_TEXT.discardTitle, [el('p', {}, EDITOR_TEXT.discardBody)], [
      { label: EDITOR_TEXT.cancel, value: 'cancel' },
      { label: EDITOR_TEXT.discard, value: 'discard', primary: true }
    ]);
    if (choice !== 'discard') return;
    clearTimeout(saveTimer);
    unsaved = false;
    pendingConflict = null;
    data = clone(FILE_DATA);
    await autoSaveStore.clear();
    if (document.activeElement) document.activeElement.blur();
    refreshAll();
    setStatus(EDITOR_TEXT.statusClean);
  }

  // Build a complete new index.html: the original page with only the
  // game-data block replaced.
  function buildFile() {
    const doc = new DOMParser().parseFromString(ORIGINAL_PAGE, 'text/html');
    // "<" is written as < so the data can never close its <script> tag early.
    const json = JSON.stringify(withFileAuth(data), null, 2).replace(/</g, '\\u003c');
    doc.getElementById('game-data').textContent = '\n' + json + '\n';
    return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML + '\n';
  }

  function saveFile() {
    const blob = new Blob([buildFile()], { type: 'text/html' });
    const a = el('a', { href: URL.createObjectURL(blob), download: 'index.html' });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    setStatus(EDITOR_TEXT.statusDownloaded);
  }

  /* -------------------------------------------------------------------
     9. THE GAME EDITOR
     A panel under the game (edit mode only) with a section for each part
     of data.game. Every box writes straight into the data, then the game
     is redrawn and the change is auto-saved.
     ------------------------------------------------------------------- */
  const GT = EDITOR_TEXT.game;
  let gameEditorEl = null;
  const openSections = new Set();      // which sections are open (kept across redraws)
  const panelInputs = new Map();       // data path -> editor box, to mirror in-place edits
  let fieldCount = 0;
  let gameRenderTimer = null;

  // A small text change: auto-save, and redraw the game shortly.
  function gameChanged() {
    changed();
    clearTimeout(gameRenderTimer);
    gameRenderTimer = setTimeout(renderGame, 250);
  }
  // Something was added, removed or moved: redraw the editor and the game now.
  function structureChanged() {
    changed();
    buildGameEditor();
    renderGame();
  }

  function removeGameEditor() {
    if (gameEditorEl) { gameEditorEl.remove(); gameEditorEl = null; }
    panelInputs.clear();
  }

  function buildGameEditor() {
    if (!gameEditorEl) {
      gameEditorEl = el('section', { class: 'game-editor', 'aria-label': GT.heading });
      document.querySelector('main').appendChild(gameEditorEl);
    }
    panelInputs.clear();
    fieldCount = 0;
    const g = game();
    ['stats', 'names', 'backgrounds', 'people', 'events', 'activities', 'endings'].forEach(k => { if (!Array.isArray(g[k])) g[k] = []; });
    g.settings = g.settings || {};

    const top = el('div', { class: 'ge-top' });
    top.appendChild(edButton(GT.preview, openPreview, 'primary'));
    top.appendChild(edButton(GT.resetPreview, () => { previewLife = null; openPanel = null; renderGame(); }));

    gameEditorEl.replaceChildren(
      el('h2', {}, GT.heading),
      el('p', {}, GT.intro),
      el('p', { class: 'ge-hint' }, EDITOR_TEXT.fnHint),
      top,
      section('settings', GT.settings, settingsPanel),
      section('stats', GT.stats, statsPanel),
      section('setup', GT.setup, setupPanel),
      section('people', GT.people, peoplePanel),
      section('events', GT.events, eventsPanel),
      section('activities', GT.activities, activitiesPanel),
      section('endings', GT.endings, endingsPanel)
    );
  }

  // A fold-out section. `key` remembers whether it was open.
  function section(key, title, build, summaryExtra) {
    const d = el('details');
    d.open = openSections.has(key);
    const summary = el('summary', {}, title);
    if (summaryExtra) summary.appendChild(summaryExtra);
    d.appendChild(summary);
    d.addEventListener('toggle', () => { if (d.open) openSections.add(key); else openSections.delete(key); });
    const body = el('div', { class: 'ge-body' });
    build(body);
    d.appendChild(body);
    return d;
  }

  function edButton(label, onClick, cls, ariaLabel) {
    const b = el('button', { type: 'button', class: cls || '' }, label);
    if (ariaLabel) b.setAttribute('aria-label', ariaLabel);
    b.addEventListener('click', onClick);
    return b;
  }

  function fieldWrap(label, control) {
    const id = 'ge-' + (++fieldCount);
    control.id = id;
    const wrap = el('div', { class: 'ge-field' });
    wrap.append(el('label', { for: id }, label), control);
    return wrap;
  }

  // A text box bound to obj[key]. `path` links it to the same text shown in the game.
  function edText(obj, key, label, path, multiline, onInput) {
    const input = multiline ? el('textarea', { rows: '3' }) : el('input', { type: 'text' });
    input.value = obj[key] == null ? '' : obj[key];
    input.addEventListener('input', () => { obj[key] = input.value; if (onInput) onInput(); gameChanged(); });
    if (path) panelInputs.set(path, input);
    return fieldWrap(label, input);
  }

  // A whole-number box bound to obj[key], kept between min and max.
  function edNumber(obj, key, label, min, max, onInput) {
    const input = el('input', { type: 'number', min: String(min), max: String(max), step: '1' });
    input.value = obj[key] == null ? '' : obj[key];
    input.addEventListener('input', () => {
      if (input.value === '' || isNaN(Number(input.value))) return;
      obj[key] = limit(input.value, min, max);
      if (onInput) onInput();
      gameChanged();
    });
    input.addEventListener('blur', () => { input.value = obj[key]; });
    return fieldWrap(label, input);
  }

  // A drop-down bound to obj[key]. options: [[value, label], ...]
  function edSelect(obj, key, label, options, onChange) {
    const select = makeSelect(options, obj[key]);
    select.addEventListener('change', () => { obj[key] = select.value; if (onChange) onChange(); else gameChanged(); });
    return fieldWrap(label, select);
  }
  function makeSelect(options, value) {
    const select = el('select');
    options.forEach(([v, l]) => select.appendChild(el('option', { value: v }, l)));
    select.value = value == null ? '' : value;
    if (select.selectedIndex < 0 && options.length) select.selectedIndex = 0;
    return select;
  }

  // Up / down / delete buttons for item `index` of `list`.
  function itemTools(list, index, onDelete, canDelete) {
    const tools = el('div', { class: 'ge-tools' });
    const up = edButton('↑', () => { [list[index - 1], list[index]] = [list[index], list[index - 1]]; structureChanged(); }, '', GT.moveUp);
    const down = edButton('↓', () => { [list[index + 1], list[index]] = [list[index], list[index + 1]]; structureChanged(); }, '', GT.moveDown);
    const del = edButton('✕', async () => {
      const ok = await showDialog(GT.removeTitle, [el('p', {}, GT.removeBody)], [
        { label: EDITOR_TEXT.cancel, value: 'cancel' },
        { label: GT.remove, value: 'delete', primary: true }
      ]);
      if (ok !== 'delete') return;
      const removed = list.splice(index, 1)[0];
      if (onDelete) onDelete(removed);
      structureChanged();
    }, '', GT.remove);
    up.disabled = index === 0;
    down.disabled = index === list.length - 1;
    del.disabled = canDelete === false;
    tools.append(up, down, del);
    return tools;
  }

  // Remove effects and conditions that point to things that were deleted.
  function forgetIds(ids) {
    (function walk(o) {
      if (Array.isArray(o)) { o.forEach(walk); return; }
      if (!o || typeof o !== 'object') return;
      Object.keys(o).forEach(k => {
        if ((k === 'effects' || k === 'conditions') && Array.isArray(o[k])) {
          o[k] = o[k].filter(x => !ids.includes(x.ref));
        }
        walk(o[k]);
      });
    })(game());
    if (ids.includes(game().settings.endStat)) game().settings.endStat = '';
  }

  // --- Effects: a list of "stat or relationship goes up/down by N" ---
  function effectTargets() {
    return game().stats.map(s => ['stat:' + s.id, GT.statPrefix + s.name])
      .concat(game().people.map(p => ['person:' + p.id, GT.personPrefix + p.name]));
  }

  function effectsEditor(effects) {
    const box = el('div', { class: 'ge-sub' });
    function draw() {
      box.replaceChildren(el('div', { class: 'ge-subhead' }, GT.effects));
      effects.forEach((ef, i) => {
        const row = el('div', { class: 'ge-row' });
        const target = makeSelect(effectTargets(), ef.kind + ':' + ef.ref);
        target.setAttribute('aria-label', GT.effectTarget);
        target.addEventListener('change', () => { [ef.kind, ef.ref] = target.value.split(':'); gameChanged(); });
        const change = el('input', { type: 'number', step: '1', 'aria-label': GT.effectChange, title: GT.effectChange });
        change.value = ef.change;
        change.addEventListener('input', () => { ef.change = limit(change.value, -100, 100); gameChanged(); });
        const del = edButton('✕', () => { effects.splice(i, 1); draw(); gameChanged(); }, '', GT.remove);
        row.append(target, change, del);
        box.appendChild(row);
      });
      const add = edButton(GT.addEffect, () => {
        const first = effectTargets()[0];
        if (!first) return;
        const [kind, ref] = first[0].split(':');
        effects.push({ kind: kind, ref: ref, change: 5 });
        draw();
        gameChanged();
      });
      box.appendChild(add);
    }
    draw();
    return box;
  }

  // --- Conditions: "only if age / stat / relationship / background / earlier choice ..." ---
  const CONDITION_KINDS = [['age', GT.condAge], ['stat', GT.condStat], ['person', GT.condPerson], ['background', GT.condBackground], ['choice', GT.condChoice]];

  function conditionRefs(kind) {
    if (kind === 'stat') return game().stats.map(s => [s.id, s.name]);
    if (kind === 'person') return game().people.map(p => [p.id, p.name]);
    if (kind === 'background') return game().backgrounds.map(b => [b.id, b.name]);
    if (kind === 'choice') {
      const list = [];
      game().events.forEach(e => (e.choices || []).forEach(c => list.push([c.id, e.title + ' → ' + c.label])));
      return list;
    }
    return [];
  }
  function conditionOps(kind) {
    if (kind === 'background') return [['is', GT.is], ['not', GT.isNot]];
    if (kind === 'choice') return [['made', GT.made], ['not', GT.notMade]];
    return [['min', GT.atLeast], ['max', GT.atMost]];
  }

  function conditionsEditor(conditions) {
    const box = el('div', { class: 'ge-sub' });
    function draw() {
      box.replaceChildren(el('div', { class: 'ge-subhead' }, GT.conditions));
      conditions.forEach((c, i) => {
        const row = el('div', { class: 'ge-row' });
        const kind = makeSelect(CONDITION_KINDS, c.kind);
        kind.setAttribute('aria-label', GT.conditions);
        kind.addEventListener('change', () => {
          c.kind = kind.value;
          const refs = conditionRefs(c.kind);
          c.ref = refs.length ? refs[0][0] : '';
          c.op = conditionOps(c.kind)[0][0];
          c.value = c.kind === 'age' ? 18 : 50;
          draw();
          gameChanged();
        });
        row.appendChild(kind);
        if (c.kind !== 'age') {
          const ref = makeSelect(conditionRefs(c.kind), c.ref);
          ref.setAttribute('aria-label', GT.conditions);
          ref.addEventListener('change', () => { c.ref = ref.value; gameChanged(); });
          row.appendChild(ref);
        }
        const op = makeSelect(conditionOps(c.kind), c.op);
        op.setAttribute('aria-label', GT.conditions);
        op.addEventListener('change', () => { c.op = op.value; gameChanged(); });
        row.appendChild(op);
        if (c.kind === 'age' || c.kind === 'stat' || c.kind === 'person') {
          const value = el('input', { type: 'number', step: '1', min: '0', 'aria-label': GT.conditions });
          value.value = c.value;
          value.addEventListener('input', () => { c.value = limit(value.value, 0, 200); gameChanged(); });
          row.appendChild(value);
        }
        row.appendChild(edButton('✕', () => { conditions.splice(i, 1); draw(); gameChanged(); }, '', GT.remove));
        box.appendChild(row);
      });
      box.appendChild(edButton(GT.addCondition, () => {
        conditions.push({ kind: 'age', ref: '', op: 'min', value: 18 });
        draw();
        gameChanged();
      }));
    }
    draw();
    return box;
  }

  // Make sure a list exists on an object (older data might not have it).
  function listOf(obj, key) { if (!Array.isArray(obj[key])) obj[key] = []; return obj[key]; }

  // --- The sections ---
  function settingsPanel(body) {
    const s = game().settings;
    const grid = el('div', { class: 'ge-grid' });
    grid.appendChild(edNumber(s, 'maxAge', GT.maxAge, 1, 150));
    grid.appendChild(edNumber(s, 'randomEventChance', GT.randomChance, 0, 100));
    grid.appendChild(edNumber(s, 'activitiesPerYear', GT.activitiesPerYear, 0, 20));
    body.appendChild(grid);
    body.appendChild(edSelect(s, 'endStat', GT.endStat, [['', GT.noEndStat]].concat(game().stats.map(x => [x.id, x.name]))));
  }

  function statsPanel(body) {
    body.appendChild(el('p', {}, GT.statsHelp));
    const stats = game().stats;
    stats.forEach((s, i) => {
      const item = el('div', { class: 'ge-item' });
      item.appendChild(itemTools(stats, i, removed => forgetIds([removed.id])));
      const grid = el('div', { class: 'ge-grid' });
      grid.appendChild(edText(s, 'name', GT.statName, 'game.stats.' + i + '.name'));
      grid.appendChild(edNumber(s, 'start', GT.statStart, 0, 100));
      item.appendChild(grid);
      body.appendChild(item);
    });
    body.appendChild(edButton(GT.addStat, () => {
      stats.push({ id: newId('s'), name: '[Stat]', start: 50 });
      structureChanged();
    }));
  }

  function setupPanel(body) {
    const g = game();
    const names = el('textarea', { rows: '4' });
    names.value = g.names.join('\n');
    names.addEventListener('input', () => { g.names = names.value.split('\n').map(n => n.trim()).filter(Boolean); gameChanged(); });
    body.appendChild(fieldWrap(GT.names, names));

    body.appendChild(el('div', { class: 'ge-subhead' }, GT.backgrounds));
    body.appendChild(el('p', {}, GT.backgroundsHelp));
    g.backgrounds.forEach((b, i) => {
      const path = 'game.backgrounds.' + i;
      const item = el('div', { class: 'ge-item' });
      item.appendChild(itemTools(g.backgrounds, i, removed => forgetIds([removed.id])));
      item.appendChild(edText(b, 'name', GT.bgName, path + '.name'));
      item.appendChild(edText(b, 'description', GT.bgDescription, path + '.description', true));
      item.appendChild(effectsEditor(listOf(b, 'effects')));
      body.appendChild(item);
    });
    body.appendChild(edButton(GT.addBackground, () => {
      g.backgrounds.push({ id: newId('b'), name: '[Background]', description: '[Background description]', effects: [] });
      structureChanged();
    }));
  }

  function peoplePanel(body) {
    body.appendChild(el('p', {}, GT.peopleHelp));
    const people = game().people;
    people.forEach((p, i) => {
      const path = 'game.people.' + i;
      const item = el('div', { class: 'ge-item' });
      item.appendChild(itemTools(people, i, removed => forgetIds([removed.id])));
      const grid = el('div', { class: 'ge-grid' });
      grid.appendChild(edText(p, 'name', GT.personName, path + '.name'));
      grid.appendChild(edText(p, 'role', GT.personRole, path + '.role'));
      grid.appendChild(edNumber(p, 'start', GT.personStart, 0, 100));
      grid.appendChild(edNumber(p, 'fromAge', GT.personFrom, 0, 150));
      item.appendChild(grid);
      item.appendChild(edText(p, 'description', GT.personDescription, path + '.description', true));
      item.appendChild(conditionsEditor(listOf(p, 'conditions')));
      body.appendChild(item);
    });
    body.appendChild(edButton(GT.addPerson, () => {
      people.push({ id: newId('p'), name: '[Person]', role: '[Role]', description: '[Person description]', start: 50, fromAge: 0, conditions: [] });
      structureChanged();
    }));
  }

  function eventSummary(e) {
    return e.type === 'fixed'
      ? fill(GT.summaryFixed, { age: e.age })
      : fill(GT.summaryRandom, { min: e.minAge, max: e.maxAge });
  }

  function eventsPanel(body) {
    body.appendChild(el('p', {}, GT.eventsHelp));
    const events = game().events;
    events.forEach((e, i) => {
      const path = 'game.events.' + i;
      const summaryText = el('span', { class: 'sub' }, eventSummary(e));
      const titleText = el('span', {}, e.title);
      const updateSummary = () => { titleText.textContent = e.title; summaryText.textContent = eventSummary(e); };
      const wrap = el('span');
      wrap.append(titleText, summaryText);

      body.appendChild(section('event:' + e.id, '', inner => {
        inner.appendChild(itemTools(events, i, removed => forgetIds([removed.id].concat((removed.choices || []).map(c => c.id)))));
        inner.appendChild(edSelect(e, 'type', GT.eventType, [['fixed', GT.fixed], ['random', GT.random]], structureChanged));
        const grid = el('div', { class: 'ge-grid' });
        if (e.type === 'fixed') grid.appendChild(edNumber(e, 'age', GT.eventAge, 0, 150, updateSummary));
        else {
          grid.appendChild(edNumber(e, 'minAge', GT.eventMinAge, 0, 150, updateSummary));
          grid.appendChild(edNumber(e, 'maxAge', GT.eventMaxAge, 0, 150, updateSummary));
        }
        inner.appendChild(grid);
        inner.appendChild(edText(e, 'title', GT.eventTitle, path + '.title', false, updateSummary));
        inner.appendChild(edText(e, 'text', GT.eventText, path + '.text', true));
        inner.appendChild(imageEditor(e));
        inner.appendChild(conditionsEditor(listOf(e, 'conditions')));

        // Choices
        const choices = listOf(e, 'choices');
        const box = el('div', { class: 'ge-sub' });
        box.appendChild(el('div', { class: 'ge-subhead' }, GT.choices));
        choices.forEach((c, j) => {
          const item = el('div', { class: 'ge-item' });
          item.appendChild(itemTools(choices, j, removed => forgetIds([removed.id])));
          item.appendChild(edText(c, 'label', GT.choiceLabel));
          item.appendChild(edText(c, 'result', GT.choiceResult, null, true));
          item.appendChild(effectsEditor(listOf(c, 'effects')));
          item.appendChild(conditionsEditor(listOf(c, 'conditions')));
          box.appendChild(item);
        });
        const addChoice = edButton(GT.addChoice, () => {
          choices.push({ id: newId('c'), label: '[Choice]', result: '[What happens after this choice]', effects: [], conditions: [] });
          structureChanged();
        });
        addChoice.disabled = choices.length >= 4;
        box.appendChild(addChoice);
        inner.appendChild(box);
      }, wrap));
    });
    body.appendChild(edButton(GT.addEvent, () => {
      const id = newId('e');
      events.push({
        id: id, type: 'random', age: 1, minAge: 0, maxAge: Number(settings().maxAge),
        title: '[Event title]', text: '[What happens]',
        image: { src: '', alt: '[Image description]' }, conditions: [],
        choices: [{ id: newId('c'), label: '[Choice]', result: '[What happens after this choice]', effects: [], conditions: [] }]
      });
      openSections.add('event:' + id);
      structureChanged();
    }));
  }

  // Upload / remove an event's picture, plus its description.
  function imageEditor(e) {
    e.image = e.image || { src: '', alt: '' };
    const box = el('div', { class: 'ge-sub' });
    function draw() {
      box.replaceChildren();
      if (e.image.src) box.appendChild(el('img', { class: 'ge-thumb', src: e.image.src, alt: '' }));
      const row = el('div', { class: 'ge-row' });
      row.appendChild(edButton(GT.uploadImage, async () => {
        const src = await uploadImage();
        if (!src) return;
        e.image.src = src;
        draw();
        gameChanged();
      }));
      if (e.image.src) row.appendChild(edButton(GT.removeImage, () => { e.image.src = ''; draw(); gameChanged(); }));
      box.appendChild(row);
      box.appendChild(edText(e.image, 'alt', GT.imageAlt));
    }
    draw();
    return box;
  }

  function activitiesPanel(body) {
    body.appendChild(el('p', {}, GT.activitiesHelp));
    const activities = game().activities;
    activities.forEach((a, i) => {
      const item = el('div', { class: 'ge-item' });
      item.appendChild(itemTools(activities, i));
      item.appendChild(edText(a, 'name', GT.activityName));
      item.appendChild(edText(a, 'result', GT.activityResult, null, true));
      const grid = el('div', { class: 'ge-grid' });
      grid.appendChild(edNumber(a, 'minAge', GT.eventMinAge, 0, 150));
      grid.appendChild(edNumber(a, 'maxAge', GT.eventMaxAge, 0, 150));
      item.appendChild(grid);
      item.appendChild(effectsEditor(listOf(a, 'effects')));
      item.appendChild(conditionsEditor(listOf(a, 'conditions')));
      body.appendChild(item);
    });
    body.appendChild(edButton(GT.addActivity, () => {
      activities.push({ id: newId('a'), name: '[Activity]', result: '[What happens]', minAge: 0, maxAge: Number(settings().maxAge), effects: [], conditions: [] });
      structureChanged();
    }));
  }

  function endingsPanel(body) {
    body.appendChild(el('p', {}, GT.endingsHelp));
    const endings = game().endings;
    endings.forEach((en, i) => {
      const path = 'game.endings.' + i;
      const item = el('div', { class: 'ge-item' });
      item.appendChild(itemTools(endings, i, null, endings.length > 1));
      item.appendChild(edText(en, 'title', GT.endingTitle, path + '.title'));
      item.appendChild(edText(en, 'text', GT.endingText, path + '.text', true));
      item.appendChild(conditionsEditor(listOf(en, 'conditions')));
      body.appendChild(item);
    });
    body.appendChild(edButton(GT.addEnding, () => {
      endings.unshift({ id: newId('end'), title: '[Ending title]', text: '[Ending text]', conditions: [] });
      structureChanged();
    }));
  }

  // Start a test life at any age, with chosen stats.
  async function openPreview() {
    const g = game();
    const form = {};
    const body = [el('p', {}, GT.previewHelp)];
    const name = el('input', { type: 'text' });
    name.value = randomName();
    body.push(fieldWrap(GT.previewName, name));
    if (g.backgrounds.length) {
      form.background = g.backgrounds[0].id;
      body.push(edSelectPlain(form, 'background', GT.previewBackground, g.backgrounds.map(b => [b.id, b.name])));
    }
    const age = el('input', { type: 'number', min: '0', max: String(settings().maxAge), step: '1' });
    age.value = 0;
    body.push(fieldWrap(GT.previewAge, age));
    const statInputs = g.stats.map(s => {
      const input = el('input', { type: 'number', min: '0', max: '100', step: '1' });
      input.value = limit(s.start, 0, 100);
      body.push(fieldWrap(s.name, input));
      return [s.id, input];
    });
    const choice = await showDialog(GT.previewTitle, body, [
      { label: EDITOR_TEXT.cancel, value: 'cancel' },
      { label: GT.startPreview, value: 'start', primary: true }
    ]);
    if (choice !== 'start') return;
    const values = {};
    statInputs.forEach(([id, input]) => { values[id] = limit(input.value, 0, 100); });
    openPanel = null;
    previewLife = newLife(name.value.trim() || randomName(), form.background || '', limit(age.value, 0, 150), values);
    renderGame();
    document.getElementById('game-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // A drop-down that only changes a plain object (no auto-save), for dialogs.
  function edSelectPlain(obj, key, label, options) {
    const select = makeSelect(options, obj[key]);
    select.addEventListener('change', () => { obj[key] = select.value; });
    return fieldWrap(label, select);
  }

  /* -------------------------------------------------------------------
     10. GETTING EVERYTHING GOING
     ------------------------------------------------------------------- */

  // Three ways into edit mode: the footer link, Ctrl+Shift+E, or #edit in the address.
  document.getElementById('edit-link').addEventListener('click', e => { e.preventDefault(); startEditing(); });
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.shiftKey && (e.key === 'E' || e.key === 'e')) { e.preventDefault(); startEditing(); }
  });
  window.addEventListener('hashchange', () => { if (location.hash === '#edit') startEditing(); });

  render();
  loadAutoSave().then(() => {
    updateLocalNote();
    if (location.hash === '#edit') startEditing();
  });
})();
</script>
</body>
</html>
