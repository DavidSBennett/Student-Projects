      will to fight down a lot but raise the exposure a lot too.</p>
    <p>After the card, the event's effects are added, and then each track changes a little by itself (for example
      the will to fight slowly recovers and the exposure slowly cools off). Played cards go to the discard pile; when
      the deck runs out, the discard pile is shuffled back in.</p>
    <p>The game can end in four ways:</p>
    <ol>
      <li><b>Network exposed:</b> the exposure rises to its end point. This is checked first, so it wins over everything.</li>
      <li><b>Will broken:</b> the will to fight falls to its end point. This is the best ending.</li>
      <li><b>Middle ending:</b> after the last turn, if the will to fight is low enough.</li>
      <li><b>Worst ending:</b> after the last turn, if the will to fight is still too high.</li>
    </ol>

    <h3>4. The Game editor</h3>
    <p>Scroll down to the blue <b>Game editor</b> box under the game. Click a section name to open it.</p>
    <ol>
      <li><b>Settings:</b> the <b>Number of turns</b>, how many <b>Cards in the hand</b>, the chance of an event each
        turn, and the <b>Dates</b>, one per line (the first line is turn 1).</li>
      <li><b>The two tracks:</b> each track's name, description, starting value, how much it changes by itself every
        turn, the point where the game ends, and that ending. The red mark on each bar shows its end point.</li>
      <li><b>Kinds of propaganda:</b> the name and description of white, grey and black propaganda.</li>
      <li><b>Lie low:</b> the move that plays no card. Untick <b>Let the player lie low</b> to remove it.</li>
      <li><b>Cards:</b> click a card to open it.
        <ol>
          <li>Pick its <b>Kind of propaganda</b> and type its <b>Name</b>, <b>Description</b>, the <b>Hint</b> the
            player sees, and <b>What happened</b> (shown after it is played). Add a picture with <b>Upload image</b>.</li>
          <li>Under <b>Effects</b>, type how much it changes each track: <code>-8</code> lowers it, <code>5</code> raises
            it, <code>0</code> leaves it alone. Remember: the player wants <b>both</b> tracks low.</li>
          <li><b>Spread</b> makes the effects a little random, so the player can never be sure. A spread of
            <code>3</code> turns an effect of <code>-8</code> into anything from <code>-11</code> to <code>-5</code>.
            Use <code>0</code> for exact effects.</li>
          <li><b>Copies</b> is how many of this card are in the deck. <code>0</code> takes it out without deleting it.</li>
          <li><b>Put this card in the hand now</b> lets you see it in the test game.</li>
        </ol></li>
      <li><b>Events:</b> pick the <b>Type</b> (crisis, warning or good news) and type the <b>Headline</b> and
        <b>What happened</b>. Add effects, a picture, and a caption with its credit. <b>Conditions</b> limit when it
        can happen, for example "When Network exposure is above 50". <b>Show this event now</b> puts it in the game
        so you can see it.</li>
      <li><b>Historical notes:</b> background reading shown under the game.</li>
      <li><b>Turn with no event:</b> what the news panel says on a quiet turn.</li>
      <li><b>Final endings:</b> the middle and worst endings, and the will to fight that picks between them.</li>
    </ol>
    <ul>
      <li>While you edit, you can play the game as a test. <b>Restart test run</b> starts it again with a fresh deck
        (do this after adding cards or changing copies).</li>
      <li>You can also click outlined words inside the game and type. To press a game button or pick a card while
        editing, click its edge, outside the outlined words.</li>
    </ul>

    <h3>5. Adding footnotes</h3>
    <p>You can add a footnote to <b>any</b> text in the game.</p>
    <ol>
      <li>Click right after the sentence that needs a source.</li>
      <li>Type two curly brackets, the letters <code>fn</code>, a colon, your citation, and two closing curly brackets:
        <code class="ed-example">A sentence that needs a source.{{fn: Author, Title, Year, page}}</code></li>
      <li>When you play the game, a small number appears there instead.</li>
      <li>A <b data-fill="ui.footnotesButton"></b> button appears in the top corner of that screen. Click it,
        or click the small number, to see all the citations.</li>
    </ol>
    <ul>
      <li>In edit mode you'll see the <code>{{fn: ...}}</code> code. That's normal. It turns into a number when you click <b>Done</b>.</li>
      <li>A web address that starts with <code>https://</code> or <code>http://</code> becomes a clickable link.</li>
      <li>Every footnote needs <code>{{</code> at the start and <code>}}</code> at the end, or it won't work.</li>
    </ul>

    <h3>6. Saving your work</h3>
    <ol>
      <li>Your work saves automatically, but only in this browser on this computer.</li>
      <li>When you're finished, click <b>Save file</b>. A file called <b>index.html</b> downloads.</li>
      <li><b>Turn in that index.html file</b> the way your teacher tells you. That's the only way your work
        gets onto the real website.</li>
      <li>Click <b>Done</b> to leave edit mode.</li>
    </ol>

    <h3>7. Tips</h3>
    <ul>
      <li>Replace everything in <b>[square brackets]</b> with your own research.</li>
      <li>Cite your sources with footnotes, and give the source for every image in its caption.</li>
      <li>Play the game several times after changing effects. It should be possible to win, but not by playing
        only the strongest cards.</li>
      <li>If you make a mistake you can't fix, ask your teacher before you click <b>Discard changes</b>.
        It erases everything back to the last uploaded version.</li>
    </ul>`;

  function showHelp() {
    const content = el('div', { class: 'ed-help' });
    content.innerHTML = HELP_HTML;   // fixed text written above, never student text
    // Current wording from the game data, inserted as plain text.
    content.querySelectorAll('[data-fill]').forEach(b => { b.textContent = stripNotes(getPath(data, b.dataset.fill)); });
    showDialog(EDITOR_TEXT.helpTitle, [content], [{ label: EDITOR_TEXT.close, value: 'close', primary: true }]);
  }

  // Ask for the password. Resolves true if it's right.
  async function askPassword() {
    const input = el('input', { type: 'password', id: 'ed-password', autocomplete: 'off' });
    const error = el('p', { class: 'ed-error', role: 'alert' });
    const label = el('label', { for: 'ed-password' }, EDITOR_TEXT.passwordLabel);
    const help = el('button', { type: 'button', class: 'ed-link' }, EDITOR_TEXT.howToEditLink);
    help.addEventListener('click', showHelp);
    let ok = false;
    const shown = showDialog(EDITOR_TEXT.passwordTitle, [label, input, error, help], [
      { label: EDITOR_TEXT.cancel, value: 'cancel' },
      { label: EDITOR_TEXT.unlock, value: 'unlock', primary: true }
    ], () => {
      ok = sha256(FILE_DATA.auth.salt + ':' + input.value) === FILE_DATA.auth.hash;
      if (!ok) { error.textContent = EDITOR_TEXT.passwordWrong; input.select(); }
      return ok;
    });
    input.focus();
    await shown;
    return ok;
  }

  // Ask whether to keep auto-saved changes made to a different version of the file.
  async function resolveConflict() {
    const saved = pendingConflict;
    if (!saved) return;
    pendingConflict = null;
    const time = new Date(saved.savedAt).toLocaleString();
    const choice = await showDialog(EDITOR_TEXT.conflictTitle, [el('p', {}, fill(EDITOR_TEXT.conflictBody, { time }))], [
      { label: EDITOR_TEXT.useUploaded, value: 'uploaded' },
      { label: EDITOR_TEXT.keepSaved, value: 'keep', primary: true }
    ]);
    if (choice === 'keep') {
      useSaved(saved);
      changed();                       // re-save, now linked to the current file
    } else if (choice === 'uploaded') {
      await autoSaveStore.clear();
      setStatus(EDITOR_TEXT.statusClean);
    } else {
      pendingConflict = saved;         // closed without choosing: ask again next time
    }
  }

  let asking = false;                  // true while the password window is open

  async function startEditing() {
    if (editing || asking) return;
    if (!unlockStore.isUnlocked()) {
      asking = true;
      const ok = await askPassword();
      asking = false;
      clearEditHash();
      if (!ok) return;
      unlockStore.remember();
    }
    clearEditHash();
    editing = true;
    document.body.classList.add('is-editing');
    buildEditBar();
    render();
    buildGameEditor();
    const canSave = await autoSaveStore.works();
    setStatus(!canSave ? EDITOR_TEXT.statusNoStorage : sameAsFile(data) ? EDITOR_TEXT.statusClean : EDITOR_TEXT.statusHasChanges);
    if (pendingConflict) await resolveConflict();
  }

  async function stopEditing() {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    await autoSaveNow();
    editing = false;
    document.body.classList.remove('is-editing');
    document.querySelectorAll('[data-text]').forEach(n => { n.removeAttribute('contenteditable'); n.removeAttribute('spellcheck'); });
    document.querySelectorAll('.ed-ui').forEach(n => n.remove());
    editBar = statusEl = gameEditorEl = null;
    panelInputs.clear();
    render();                          // footnotes render again
  }

  function clearEditHash() {
    if (location.hash === '#edit') {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* not allowed here */ }
    }
  }

  function buildEditBar() {
    editBar = el('div', { class: 'ed-ui edit-bar', role: 'region', 'aria-label': 'Editor' });
    statusEl = el('span', { class: 'ed-status', 'aria-live': 'polite' });
    editBar.append(statusEl);
    [
      [EDITOR_TEXT.howToEdit, showHelp],
      [EDITOR_TEXT.otherText, editOtherText],
      [EDITOR_TEXT.discard, discardChanges],
      [EDITOR_TEXT.saveFile, saveFile, true],
      [EDITOR_TEXT.done, stopEditing]
    ].forEach(([label, action, primary]) => {
      const b = el('button', { type: 'button', class: 'ed-btn' + (primary ? ' ed-primary' : '') }, label);
      b.addEventListener('click', action);
      editBar.append(b);
    });
    document.body.append(editBar);
  }

  // Can this browser do "plain text only" editing? (Most can.)
  const PLAIN_ONLY = (function () {
    try { const d = document.createElement('div'); d.contentEditable = 'plaintext-only'; return d.contentEditable === 'plaintext-only'; }
    catch (e) { return false; }
  })();

  // Turn on click-and-type editing for every data-text element.
  // Safe to call again after redrawing (listeners are only added once).
  function makeEditable() {
    document.querySelectorAll('[data-text]').forEach(node => {
      node.setAttribute('contenteditable', PLAIN_ONLY ? 'plaintext-only' : 'true');
      node.setAttribute('spellcheck', 'true');
      if (node._editBound) return;
      node._editBound = true;

      node.addEventListener('input', () => {
        if (!editing) return;
        let value = node.innerText.replace(/ /g, ' ');
        if (!node.hasAttribute('data-multiline')) value = value.replace(/\s*\n\s*/g, ' ');
        const path = node.dataset.text;
        setPath(data, path, value);
        // Keep the matching Game editor box, and any other copy on the page, up to date.
        const twin = panelInputs.get(path);
        if (twin) twin.value = value;
        document.querySelectorAll('[data-text]').forEach(n => { if (n !== node && n.dataset.text === path) n.textContent = value; });
        changed();
      });
      // One-line text: Enter finishes editing instead of adding a line.
      node.addEventListener('keydown', e => {
        if (editing && e.key === 'Enter' && !node.hasAttribute('data-multiline')) { e.preventDefault(); node.blur(); }
      });
      // Pasting always pastes plain text (no fonts, colours or links).
      node.addEventListener('paste', e => {
        if (!editing) return;
        e.preventDefault();
        let text = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
        if (!node.hasAttribute('data-multiline')) text = text.replace(/\s*\n\s*/g, ' ');
        document.execCommand('insertText', false, text);
      });
      // When leaving a box, tidy it to match the saved text.
      node.addEventListener('blur', () => {
        if (!editing) return;
        const value = getPath(data, node.dataset.text);
        node.textContent = value == null ? '' : String(value);
      });
    });
  }

  // Ask for an image file and return it scaled down, as a data URL (or null).
  async function uploadImage() {
    const file = await pickFile();
    if (!file) return null;
    try { return await shrinkImage(file, 1600); }
    catch (err) { setStatus(EDITOR_TEXT.statusImageError); return null; }
  }

  function pickFile() {
    return new Promise(resolve => {
      const input = el('input', { type: 'file', accept: 'image/*' });
      input.addEventListener('change', () => resolve(input.files[0] || null));
      input.click();
    });
  }

  // Scale a photo down (longest side about `max` px) and store it as JPEG,
  // so the single file stays a reasonable size.
  function shrinkImage(file, max) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';     // JPEG has no transparency
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Not an image')); };
      img.src = url;
    });
  }

  // Parts of the data that are not text: settings and pictures.
  const NOT_TEXT_KEYS = ['auth', 'schemaVersion', 'src', 'id'];

  // Every piece of text in the data that is NOT on screen right now (text on
  // screen is edited in place). The game's own content is left out: all of it
  // is always in the Game editor panel.
  function hiddenTextFields() {
    const visible = new Set();
    document.querySelectorAll('[data-text]').forEach(n => { if (n.getClientRects().length) visible.add(n.dataset.text); });
    const fields = [];
    (function walk(obj, prefix) {
      Object.keys(obj).forEach(k => {
        if (NOT_TEXT_KEYS.includes(k) || (!prefix && k === 'game')) return;
        const path = prefix ? prefix + '.' + k : k;
        const v = obj[k];
        if (typeof v === 'string') { if (!visible.has(path)) fields.push({ path, value: v }); }
        else if (v && typeof v === 'object') walk(v, path);
      });
    })(data, '');
    return fields;
  }

  // A label for a box: from EDITOR_TEXT.fields, or made from the key ("footnotesBack" -> "Footnotes back").
  function fieldName(path) {
    if (EDITOR_TEXT.fields[path]) return EDITOR_TEXT.fields[path];
    return path.split('.').slice(1).map(part => {
      const s = part.replace(/([a-z0-9])([A-Z])/g, '$1 $2').toLowerCase();
      return s.charAt(0).toUpperCase() + s.slice(1);
    }).join(' › ') || path;
  }

  async function editOtherText() {
    const fields = hiddenTextFields();
    const body = [el('p', { class: 'ed-hint' }, EDITOR_TEXT.fnHint), el('p', {}, fields.length ? EDITOR_TEXT.otherTextHelp : EDITOR_TEXT.otherTextNone)];
    const inputs = [];
    let group = null;
    fields.forEach((f, i) => {
      const top = f.path.split('.')[0];
      if (top !== group) { group = top; body.push(el('div', { class: 'ed-group' }, EDITOR_TEXT.groups[top] || fieldName('x.' + top))); }
      const id = 'ed-field-' + i;
      body.push(el('label', { for: id }, fieldName(f.path)));
      const box = el('textarea', { id: id, rows: f.value.length > 60 || f.value.includes('\n') ? '3' : '1' });
      box.value = f.value;
      body.push(box);
      inputs.push([f.path, box]);
    });
    const choice = await showDialog(EDITOR_TEXT.otherTextTitle, body, [
      { label: EDITOR_TEXT.cancel, value: 'cancel' },
      { label: EDITOR_TEXT.apply, value: 'apply', primary: true }
    ]);
    if (choice !== 'apply') return;
    let any = false;
    inputs.forEach(([path, box]) => {
      if (getPath(data, path) !== box.value) { setPath(data, path, box.value); any = true; }
    });
    if (any) { render(); changed(); }
  }

  async function discardChanges() {
    const choice = await showDialog(EDITOR_TEXT.discardTitle, [el('p', {}, EDITOR_TEXT.discardBody)], [
      { label: EDITOR_TEXT.cancel, value: 'cancel' },
      { label: EDITOR_TEXT.discard, value: 'discard', primary: true }
    ]);
    if (choice !== 'discard') return;
    clearTimeout(saveTimer);
    unsaved = false;
    pendingConflict = null;
    data = clone(FILE_DATA);
    await autoSaveStore.clear();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    run = null;
    render();
    buildGameEditor();
    setStatus(EDITOR_TEXT.statusDiscarded);
  }

  // Build a complete new index.html: the original page (copied before
  // anything was drawn) with only the game-data block replaced.
  function buildFile() {
    const doc = new DOMParser().parseFromString(ORIGINAL_PAGE, 'text/html');
    // "<" is written as < so the data can never close its <script> tag early.
    const json = JSON.stringify(withFileAuth(data), null, 2).replace(/</g, '\\u003c');
    doc.getElementById('game-data').textContent = '\n' + json + '\n';
    return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML + '\n';
  }

  function saveFile() {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const blob = new Blob([buildFile()], { type: 'text/html' });
    const a = el('a', { href: URL.createObjectURL(blob), download: 'index.html' });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    setStatus(EDITOR_TEXT.statusDownloaded);
  }

  /* -------------------------------------------------------------------
     8b. THE GAME EDITOR
     A panel under the game (edit mode only) with a box for every part of
     data.game. Every box writes straight into the data, then the game is
     redrawn and the change is auto-saved. Buttons that change the shape
     of the game (add, delete, upload) rebuild the whole panel.
     ------------------------------------------------------------------- */
  const GT = EDITOR_TEXT.game;
  let gameEditorEl = null;
  const openParts = new Set();         // which sections are open (kept across rebuilds)
  const panelInputs = new Map();       // data path -> editor box, to mirror in-place edits
  let fieldCount = 0;
  let renderTimer = null;

  // Redraw the game shortly after typing stops in the panel.
  function renderSoon() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 200);
  }

  // A labelled text box tied to a path in the data.
  function textField(label, path, multiline) {
    const id = 'ge-field-' + (++fieldCount);
    const box = el(multiline ? 'textarea' : 'input', { id: id });
    if (!multiline) box.type = 'text';
    const value = getPath(data, path);
    box.value = value == null ? '' : String(value);
    box.addEventListener('input', () => { setPath(data, path, box.value); renderSoon(); changed(); });
    panelInputs.set(path, box);
    const wrap = el('div');
    wrap.append(el('label', { for: id }, label), box);
    return wrap;
  }

  // A labelled number box. `get` and `set` read and write the number.
  function numberField(label, get, set, min, max) {
    const id = 'ge-field-' + (++fieldCount);
    const box = el('input', { id: id, type: 'number', step: '1' });
    if (min != null) box.min = String(min);
    if (max != null) box.max = String(max);
    box.value = String(get());
    box.addEventListener('input', () => { set(Math.round(Number(box.value) || 0)); renderSoon(); changed(); });
    const wrap = el('div');
    wrap.append(el('label', { for: id }, label), box);
    return wrap;
  }

  // A tick box. Changing it rebuilds the panel, as it can show or hide boxes.
  function checkField(label, get, set) {
    const box = el('input', { type: 'checkbox' });
    box.checked = !!get();
    box.addEventListener('change', () => { set(box.checked); reshaped(); });
    const wrap = el('label', { class: 'ge-check' });
    wrap.append(box, label);
    return wrap;
  }

  // A drop-down list. `options` is a list of [value, label].
  function selectField(label, options, get, set) {
    const id = 'ge-field-' + (++fieldCount);
    const box = el('select', { id: id });
    options.forEach(([value, text]) => box.append(el('option', { value: value }, text)));
    box.value = get();
    box.addEventListener('change', () => { set(box.value); renderSoon(); changed(); });
    const wrap = el('div');
    wrap.append(el('label', { for: id }, label), box);
    return wrap;
  }

  function panelButton(label, onClick, cls) {
    const b = el('button', { type: 'button', class: 'ed-btn' + (cls ? ' ' + cls : '') }, label);
    b.addEventListener('click', onClick);
    return b;
  }

  function buttonRow(...buttons) {
    const row = el('div', { class: 'ge-row' });
    row.append(...buttons.filter(Boolean));
    return row;
  }

  // A section that opens and closes, and remembers whether it was open.
  function part(key, title, fillIn) {
    const d = el('details');
    if (openParts.has(key)) d.open = true;
    d.addEventListener('toggle', () => { if (d.open) openParts.add(key); else openParts.delete(key); });
    d.append(el('summary', {}, title));
    fillIn(d);
    return d;
  }

  function fieldset(legend, ...children) {
    const fs = el('fieldset');
    fs.append(el('legend', {}, legend), ...children);
    return fs;
  }

  // Title, verdict and text boxes for an ending at `path`.
  function endingFields(legend, path) {
    return fieldset(legend, textField(GT.title, path + '.title'), textField(GT.verdict, path + '.verdict'), textField(GT.text, path + '.text', true));
  }

  // Number boxes for how much something changes each track.
  function effectsFields(fx) {
    const grid = el('div', { class: 'ge-grid' });
    TRACK_IDS.forEach(id => grid.append(numberField(stripNotes(data.game.tracks[id].name), () => Number(fx[id]) || 0, v => { fx[id] = v; }, -100, 100)));
    const wrap = el('div');
    wrap.append(el('label', {}, GT.effects), grid);
    return wrap;
  }

  // Upload / remove buttons and the caption boxes for a picture at `path`.
  function imageFields(image, path) {
    const nodes = [];
    if (image.src) nodes.push(el('img', { class: 'ge-thumb', src: image.src, alt: '' }));
    nodes.push(buttonRow(
      panelButton(GT.uploadImage, async () => {
        const src = await uploadImage();
        if (!src) return;
        image.src = src;
        reshaped();
      }),
      image.src && panelButton(GT.removeImage, () => { image.src = ''; reshaped(); }, 'ed-danger')));
    nodes.push(textField(GT.imageAlt, path + '.alt'), textField(GT.imageCaption, path + '.caption'));
    return nodes;
  }

  // After a change to the shape of the game: save, redraw the game and the panel.
  function reshaped() {
    changed();
    render();
    buildGameEditor();
  }

  function confirmDelete(body) {
    return showDialog(GT.deleteTitle, [el('p', {}, body || GT.deleteBody)], [
      { label: EDITOR_TEXT.cancel, value: 'cancel' },
      { label: GT.deleteButton, value: 'delete', primary: true }
    ]).then(v => v === 'delete');
  }

  function newCard(n) {
    return {
      id: newId('c'), type: 'grey', name: '[Card ' + n + ']', description: '[What this leaflet, broadcast or rumour says]',
      hint: '[A hint about how risky it is]', result: '[What happened when it was used]',
      image: { src: '', alt: '[Image description]', caption: '[Image caption and credit]' },
      effects: { will: -5, exposure: 5 }, spread: 3, copies: 1
    };
  }
  function newEvent(n) {
    return {
      id: newId('e'), tag: 'warn', headline: '[Event ' + n + ' headline]', body: '[What happened]',
      image: { src: '', alt: '[Image description]', caption: '[Image caption and credit]' },
      effects: { will: 0, exposure: 0 }, chance: 100, conditions: []
    };
  }
  function newNote(n) { return { id: newId('n'), title: '[Historical note ' + n + ' title]', body: '[Historical note text]' }; }

  // Make sure a test game is being played, and scroll up to it.
  function testGame() {
    if (run.phase !== 'game') { run = newRun(); run.phase = 'game'; run.deck = buildDeck(); startTurn(); }
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function buildGameEditor() {
    if (!editing) return;
    const scrollY = window.scrollY;
    const g = data.game;
    panelInputs.clear();
    const panel = el('section', { class: 'ed-ui game-editor', 'aria-label': GT.heading });
    panel.append(el('h2', {}, GT.heading), el('p', {}, GT.intro), el('p', { class: 'ed-hint' }, EDITOR_TEXT.fnHint),
      buttonRow(panelButton(GT.showStart, toStart), panelButton(GT.startTest, testGame),
        panelButton(GT.restartTest, () => { if (run.phase === 'start') toStart(); else { run = null; checkRun(); testGame(); } })));

    // Settings
    panel.append(part('settings', GT.settings, d => {
      const grid = el('div', { class: 'ge-grid' });
      grid.append(
        numberField(GT.turns, () => g.turns, v => { g.turns = Math.max(1, v); }, 1, 100),
        numberField(GT.handSize, () => g.handSize, v => { g.handSize = Math.max(1, Math.min(10, v)); }, 1, 10),
        numberField(GT.eventChance, () => g.eventChance, v => { g.eventChance = clampValue(v); }, 0, 100));
      d.append(grid, textField(GT.dates, 'game.dates', true));
    }));

    // The two tracks
    panel.append(part('tracks', GT.tracks, d => {
      d.append(el('p', {}, GT.tracksHelp));
      TRACK_IDS.forEach(id => {
        const t = g.tracks[id];
        const tp = 'game.tracks.' + id;
        const grid = el('div', { class: 'ge-grid' });
        grid.append(
          numberField(GT.trackStart, () => t.start, v => { t.start = clampValue(v); if (run.phase === 'start') run = null; }, 0, 100),
          numberField(GT.perTurn, () => t.perTurn, v => { t.perTurn = v; }, -100, 100),
          numberField(GT[id + 'EndAt'], () => t.endAt, v => { t.endAt = clampValue(v); }, 0, 100));
        d.append(fieldset(GT[id], textField(GT.trackName, tp + '.name'), textField(GT.trackDescription, tp + '.description', true),
          grid, endingFields(GT[id + 'Ending'], tp + '.ending')));
      });
    }));

    // Kinds of propaganda
    panel.append(part('cardTypes', GT.cardTypes, d => {
      d.append(el('p', {}, GT.cardTypesHelp));
      CARD_TYPES.forEach(t => d.append(fieldset(GT.typeNames[t], textField(GT.typeName, 'game.cardTypes.' + t + '.name'),
        textField(GT.typeDescription, 'game.cardTypes.' + t + '.description', true))));
    }));

    // Lie low
    panel.append(part('lieLow', GT.lieLow, d => {
      const l = g.lieLow;
      d.append(el('p', {}, GT.lieLowHelp), checkField(GT.lieLowShow, () => l.show, v => { l.show = v; }));
      if (!l.show) return;
      d.append(textField(GT.lieLowLabel, 'game.lieLow.label'), textField(GT.lieLowDescription, 'game.lieLow.description', true),
        textField(GT.lieLowResult, 'game.lieLow.result', true), effectsFields(l.effects));
    }));

    // Cards
    panel.append(part('cards', GT.cards, d => {
      d.append(el('p', {}, GT.cardsHelp));
      g.cards.forEach((c, i) => d.append(cardPart(c, i)));
      d.append(buttonRow(panelButton(GT.addCard, () => {
        const c = newCard(g.cards.length + 1);
        g.cards.push(c);
        openParts.add('card-' + c.id);
        reshaped();
      })));
    }));

    // Events
    panel.append(part('events', GT.events, d => {
      d.append(el('p', {}, GT.eventsHelp));
      g.events.forEach((x, j) => d.append(eventPart(x, j)));
      d.append(buttonRow(panelButton(GT.addEvent, () => {
        const x = newEvent(g.events.length + 1);
        g.events.push(x);
        openParts.add('ev-' + x.id);
        reshaped();
      })));
    }));

    // Historical notes
    panel.append(part('notes', GT.notes, d => {
      g.notes.forEach((x, j) => {
        const np = 'game.notes.' + j;
        d.append(fieldset(fill(GT.note, { n: j + 1 }), textField(GT.noteTitle, np + '.title'), textField(GT.noteBody, np + '.body', true),
          buttonRow(panelButton(GT.deleteNote, async () => {
            if (!(await confirmDelete())) return;
            g.notes.splice(j, 1);
            reshaped();
          }, 'ed-danger'))));
      });
      d.append(buttonRow(panelButton(GT.addNote, () => { g.notes.push(newNote(g.notes.length + 1)); reshaped(); })));
    }));

    // Turn with no event
    panel.append(part('noEvent', GT.noEvent, d => {
      d.append(el('p', {}, GT.noEventHelp), textField(GT.dateline, 'game.noEvent.dateline'),
        textField(GT.headline, 'game.noEvent.headline'), textField(GT.body, 'game.noEvent.body', true));
    }));

    // Final endings
    panel.append(part('final', GT.final, d => {
      const f = g.finalEndings;
      d.append(el('p', {}, GT.finalHelp), numberField(GT.mixedAt, () => f.mixedAt, v => { f.mixedAt = clampValue(v); }, 0, 100),
        endingFields(GT.mixed, 'game.finalEndings.mixed'), endingFields(GT.lose, 'game.finalEndings.lose'));
    }));

    if (gameEditorEl) gameEditorEl.replaceWith(panel); else $('.site-footer').before(panel);
    gameEditorEl = panel;
    window.scrollTo(0, scrollY);
  }

  // One card's section in the panel.
  function cardPart(c, i) {
    const g = data.game;
    const cp = 'game.cards.' + i;
    return part('card-' + c.id, fill(GT.card, { n: i + 1 }) + ': ' + stripNotes(c.name), d => {
      d.append(selectField(GT.cardType, CARD_TYPES.map(t => [t, stripNotes(g.cardTypes[t].name) || GT.typeNames[t]]), () => c.type, v => { c.type = v; }),
        textField(GT.cardName, cp + '.name'), textField(GT.cardDescription, cp + '.description', true),
        textField(GT.cardHint, cp + '.hint'), textField(GT.cardResult, cp + '.result', true),
        ...imageFields(c.image, cp + '.image'), effectsFields(c.effects));
      const grid = el('div', { class: 'ge-grid' });
      grid.append(numberField(GT.spread, () => c.spread, v => { c.spread = Math.max(0, v); }, 0, 50),
        numberField(GT.copies, () => c.copies, v => { c.copies = Math.max(0, Math.min(20, v)); }, 0, 20));
      d.append(grid, buttonRow(
        panelButton(GT.putInHand, () => {
          testGame();
          // Swap it in for the last card in the hand (that card goes back on the deck).
          const size = Math.max(1, Number(g.handSize) || 1);
          if (run.hand.length >= size) run.deck.push(run.hand.pop());
          run.hand.push(c.id);
          run.selected = null;
          render();
        }),
        panelButton(GT.deleteCard, async () => {
          if (!(await confirmDelete())) return;
          g.cards.splice(i, 1);
          reshaped();
        }, 'ed-danger')));
    });
  }

  // One event's section in the panel.
  function eventPart(x, j) {
    const g = data.game;
    const ep = 'game.events.' + j;
    return part('ev-' + x.id, fill(GT.event, { n: j + 1 }) + ': ' + stripNotes(x.headline), d => {
      d.append(selectField(GT.tag, TAGS.map(t => [t, GT.tagNames[t]]), () => x.tag, v => { x.tag = v; }),
        textField(GT.headline, ep + '.headline'), textField(GT.body, ep + '.body', true),
        ...imageFields(x.image, ep + '.image'), effectsFields(x.effects),
        numberField(GT.chance, () => x.chance, v => { x.chance = clampValue(v); }, 0, 100));

      // Conditions
      const things = TRACK_IDS.map(id => [id, stripNotes(g.tracks[id].name)]);
      const fs = fieldset(GT.conditions);
      if (!x.conditions.length) fs.append(el('p', {}, GT.noConditions));
      x.conditions.forEach((c, k) => {
        const row = el('div', { class: 'ge-cond' });
        row.append(selectField(GT.condWhat, things, () => c.stat, v => { c.stat = v; }),
          selectField(GT.condOp, [['above', GT.above], ['below', GT.below]], () => c.op, v => { c.op = v; }),
          numberField(GT.condValue, () => c.value, v => { c.value = v; }),
          panelButton(GT.removeCondition, () => { x.conditions.splice(k, 1); reshaped(); }, 'ed-danger'));
        fs.append(row);
      });
      fs.append(buttonRow(panelButton(GT.addCondition, () => {
        x.conditions.push({ stat: 'exposure', op: 'above', value: 50 });
        reshaped();
      })));
      d.append(fs);

      d.append(buttonRow(
        panelButton(GT.showEvent, () => {
          testGame();
          run.eventId = x.id;
          render();
        }),
        panelButton(GT.deleteEvent, async () => {
          if (!(await confirmDelete())) return;
          g.events.splice(j, 1);
          reshaped();
        }, 'ed-danger')));
    });
  }

  /* -------------------------------------------------------------------
     9. GETTING EVERYTHING GOING
     ------------------------------------------------------------------- */
  render();

  // Three ways into edit mode: the footer link, Ctrl+Shift+E, or #edit in the address.
  $('#edit-link').addEventListener('click', e => { e.preventDefault(); startEditing(); });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'e') { e.preventDefault(); startEditing(); }
  });
  window.addEventListener('hashchange', () => { if (location.hash === '#edit') startEditing(); });

  loadAutoSave().finally(() => { if (location.hash === '#edit') startEditing(); });
})();
</script>
</body>
